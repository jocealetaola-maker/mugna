<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#241a15" />
<title>Café Ledger & POS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<style>
:root{
  --paper:#f3ede1;
  --paper-2:#e9dfca;
  --card:#fffdf8;
  --ink:#241a15;
  --bean:#6b4a35;
  --bean-soft:#a98a73;
  --brass:#d35e2a;
  --brass-deep:#b54a1c;
  --sage:#5e7350;
  --sage-soft:#e7eede;
  --clay:#9e3a2b;
  --clay-soft:#f1ddd5;
  --line:#e2d4bd;
  --line-soft:#efe5d2;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(36,26,21,.06), 0 8px 24px rgba(36,26,21,.06);
  --mono:'Spline Sans Mono',ui-monospace,Menlo,monospace;
  --ui:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100vh}
body{
  font-family:var(--ui); color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; line-height:1.45; font-size:15px;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:15px}
h1,h2,h3{font-family:var(--disp); font-weight:500; letter-spacing:-.01em; margin:0}
a{color:var(--brass-deep)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* Auth */
.auth-wrap{min-height:100dvh; display:grid; place-items:center; padding:1cm;
  background:radial-gradient(120% 90% at 50% -10%, #2f221b 0%, #241a15 55%, #1b130f 100%); color:var(--paper)}
.auth-card{width:min(480px,100%); background:var(--card); color:var(--ink); border-radius:18px;
  padding:34px 30px; box-shadow:0 30px 60px rgba(0,0,0,.35)}
.brand-mark{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.brand-cup{width:48px;height:48px;border-radius:12px;background:var(--paper);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(36,26,21,.12);overflow:hidden}
.brand-cup svg, .brand-cup img{width:82%;height:82%;object-fit:contain;display:block}
#authView .brand-cup{width:64px;height:64px;border-radius:15px}
.brand-name{font-family:var(--disp); font-size:30px; line-height:1}
.brand-sub{color:var(--bean); font-size:13px; letter-spacing:.16em; text-transform:uppercase; margin-top:2px}
.auth-card h2{font-size:20px; margin:22px 0 4px}
.auth-card p.muted{color:var(--bean); font-size:13.5px; margin:0 0 18px}
label.fld{display:block; margin:14px 0 0}
label.fld>span{display:block; font-size:12.5px; font-weight:600; color:var(--bean); margin-bottom:6px; letter-spacing:.02em}
.input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--paper); color:var(--ink); outline:none}
.input:focus{border-color:var(--brass); box-shadow:0 0 0 3px rgba(211,94,42,.2)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent;
  padding:11px 16px; border-radius:var(--radius-sm); font-weight:600; font-size:14.5px; background:var(--paper-2); color:var(--ink)}
.btn:hover{filter:brightness(.98)}
.btn-primary{background:var(--ink); color:var(--paper)}
.btn-primary:hover{background:#34261d}
.btn-brass{background:var(--brass); color:#fff}
.btn-brass:hover{background:var(--brass-deep)}
.btn-ghost{background:transparent; border-color:var(--line)}
.btn-block{width:100%}
.btn-sm{padding:7px 11px; font-size:13px; border-radius:99px}
.btn-md{padding:12px 18px; font-size:14px; border-radius:10px}
.btn-lg{padding:14px 24px; font-size:15px; border-radius:12px}
.err{color:var(--clay); font-size:13px; margin-top:10px; min-height:1em}
.user-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px; margin-top:16px}
.user-card{background:var(--paper-2); border:2px solid var(--line); border-radius:14px; padding:16px 8px; text-align:center; cursor:pointer; transition:all .15s ease}
.user-card:hover{border-color:var(--brass); transform:translateY(-2px)}
.user-avatar{width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-weight:700; font-size:18px; margin:0 auto 8px}
.user-card.owner-card .user-avatar{background:var(--brass); color:#fff}
.user-card .user-name{font-weight:600; font-size:13.5px; word-break:break-word}
.user-card .user-role{font-size:11px; color:var(--bean); text-transform:uppercase; font-weight:700; margin-top:2px}

/* Cards */
.grid{display:grid; gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:880px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow)}
.card h3{font-size:17px; margin-bottom:4px}
.card .sub{color:var(--bean); font-size:13px; margin-bottom:14px}
.kpi{display:flex; flex-direction:column; gap:6px}
.kpi .label{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--bean); font-weight:600}
.kpi .val{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.02em}
.kpi .val.in{color:var(--sage)} .kpi .val.out{color:var(--clay)}

table{width:100%; border-collapse:collapse}
th,td{text-align:left; padding:10px 10px; border-bottom:1px solid var(--line-soft); font-size:14px; vertical-align:middle}
th{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--bean); font-weight:700}
.muted{color:var(--bean)}
.right{text-align:right}

/* Modal */
.modal-back{position:fixed; inset:0; background:rgba(27,19,15,.5); backdrop-filter:blur(3px); z-index:100;
  display:grid; place-items:center; padding:1cm}
.modal{background:var(--card); width:min(640px,100%); max-height:92dvh; overflow:auto; border-radius:18px; box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px}
.modal-head h3{font-size:20px}
.modal-body{padding:6px 20px 20px}
.modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:14px 20px 20px; position:sticky; bottom:0; background:var(--card)}
.x{border:none; background:var(--paper-2); width:32px; height:32px; border-radius:999px; font-size:16px; color:var(--bean)}

/* Toast */
.toasts{position:fixed; z-index:200; left:50%; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:10px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); font-weight:500}
.toast.bad{background:var(--clay)} .toast.ok{background:var(--sage)}

/* Loading */
.spinner{width:18px;height:18px;border:2px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite; display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100dvh; display:grid; place-items:center; gap:14px; color:var(--bean)}

/* Sidebar Layout */
#appView{display:none; min-height:100vh}
.app-shell{display:flex; min-height:100vh}
.sidebar-shell{width:280px; min-width:280px; background:#f6f4f3; border-right:1px solid #ddd; padding:16px; display:flex; flex-direction:column; overflow-y:auto}
.brand-block{display:flex; align-items:center; gap:12px; padding:12px 0; margin-bottom:24px}
.brand-block .brand-cup{width:42px; height:42px; border-radius:10px; background:#fff; border:1px solid rgba(0,0,0,.1)}
.brand-block .brand-name{font-size:24px; font-weight:700; color:#2d2a2a}
.sidebar-nav{display:flex; flex-direction:column; gap:8px; padding-bottom:16px}
.nav-item{display:flex; align-items:center; gap:14px; width:100%; padding:12px 14px; border:none; background:transparent; color:#4a4641; text-align:left; font-size:16px; font-weight:500; border-radius:10px; cursor:pointer; transition:all .15s ease; font-family:var(--ui)}
.nav-item:hover{background:#efefef}
.nav-item .nav-icon{display:inline-flex; align-items:center; justify-content:center; width:20px; font-size:18px}
.nav-item.active{background:var(--brass); color:#fff; box-shadow:0 2px 8px rgba(211,94,42,.2)}
.sidebar-footer{margin-top:auto; padding-top:16px; border-top:1px solid #ddd; display:flex; flex-direction:column; gap:8px}
.content-shell{flex:1; background:#f5f5f3; display:flex; flex-direction:column; overflow:hidden}
.apphead{display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; color:var(--ink); padding:14px 20px; border-bottom:1px solid #ddd}
.homebtn{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink);cursor:pointer;padding:0}
.homebtn .brand-cup{width:32px;height:32px;border-radius:8px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.homebtn .brand-name{font-family:var(--disp);color:var(--ink);font-size:20px}
.user-pill{display:flex; align-items:center; gap:10px; background:rgba(36,26,21,.05); color:var(--ink); padding:8px 12px; border-radius:999px; font-size:13px; font-weight:600}
.lockbtn{background:var(--brass);color:#fff;border:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;cursor:pointer}
.lockbtn:active{transform:scale(.97)}
.main{flex:1; overflow:auto; padding:20px; max-width:100%; margin:0}

/* Home Screen */
.main-cats{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-bottom:24px}
@media(max-width:1200px){.main-cats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.main-cats{grid-template-columns:1fr}}
.cat-tile{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:28px 20px; text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:all .2s ease}
.cat-tile:hover{border-color:var(--brass); transform:translateY(-3px)}
.cat-tile .cico{font-size:48px; line-height:1; margin-bottom:12px}
.cat-tile .clabel{font-family:var(--disp); font-size:22px; font-weight:600}
.cat-tile .csub{font-size:13px; color:var(--bean); margin-top:4px}
.group-section{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:24px; box-shadow:var(--shadow)}
.group-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bean);margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.tile{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;transition:transform .07s}
.tile:hover{border-color:var(--brass)}
.tile:active{transform:scale(.96)}
.tile .tico{font-size:32px;line-height:1;margin-bottom:8px}
.tile .tlabel{font-weight:600;font-size:13.5px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--bean);font-weight:600;font-size:14.5px;margin-bottom:12px;cursor:pointer}
.back:hover{color:var(--ink)}

/* Tabs */
.tabs{display:flex; gap:8px; border-bottom:2px solid var(--line); margin-bottom:20px; padding-bottom:0}
.tab-btn{background:none; border:none; padding:12px 16px; border-bottom:3px solid transparent; color:var(--bean); font-weight:600; cursor:pointer; font-size:14px; transition:all .15s ease}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--brass); border-bottom-color:var(--brass)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Dashboard Cards */
.dashboard-kpi{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:16px; margin-bottom:24px}
.dashboard-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow)}
.dashboard-card h3{font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--bean); font-weight:700; margin-bottom:8px}
.dashboard-card .big-val{font-family:var(--mono); font-size:32px; font-weight:600; color:var(--ink); margin-bottom:4px}
.dashboard-card .sub-val{font-size:13px; color:var(--bean)}

/* Quick Action Bar */
.quick-actions{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap}
.quick-btn{display:flex; align-items:center; gap:10px; padding:12px 18px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--card); cursor:pointer; font-weight:600; transition:all .15s ease}
.quick-btn:hover{border-color:var(--brass); box-shadow:0 4px 12px rgba(211,94,42,.15)}
.quick-btn .ico{font-size:20px}

/* Staff Box */
.staff-box{background:var(--card); border:2px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px}
.staff-header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
.staff-name{font-size:16px; font-weight:700; color:var(--ink)}
.staff-status{font-size:12px; padding:4px 12px; border-radius:999px; background:var(--sage-soft); color:var(--sage); font-weight:600}
.staff-actions{display:flex; gap:10px; align-items:center}
.staff-actions button{flex:1; min-width:100px}

/* Chart Container */
.chart-container{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; position:relative; height:300px}
.chart-container canvas{max-height:100%}

/* PIN */
.pindots{display:flex;gap:12px;justify-content:center;margin:16px 0 18px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.pindots i.on{background:var(--brass);border-color:var(--brass)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pinpad button{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:20px;font-weight:600;font-family:var(--mono);cursor:pointer}
.pinpad button:active{background:var(--paper-2)}

/* POS Layout */
.pos-header-bar{background:var(--card); border-bottom:2px solid var(--line); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px}
.pos-header-bar .btn{margin:0}

/* Form */
.form-group{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.form-group label{font-weight:600; font-size:13px; color:var(--bean)}
.form-group input, .form-group select, .form-group textarea{padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:14px}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingView" class="loading-screen"><span class="spinner"></span><div>Loading Ledger & POS…</div></div>

<!-- LOGIN -->
<div id="authView" class="auth-wrap hide">
  <div class="auth-card">
    <div class="brand-mark"><div class="brand-cup"></div><div><div class="brand-name" id="authBrandTitle">Café Ledger</div><div class="brand-sub">Management Portal</div></div></div>
    
    <div id="userSelectScreen">
      <h2>Select User</h2>
      <p class="muted">Tap your profile to sign in with your PIN.</p>
      <div class="user-grid" id="userListGrid"></div>
      <div style="margin-top:20px; text-align:center;">
        <button id="showEmailAuthBtn" class="btn btn-ghost btn-sm">Sign in with Email/Pass (Owner)</button>
      </div>
    </div>

    <div id="emailAuthScreen" class="hide">
      <h2>Email Login</h2>
      <p class="muted">Sign in with Supabase account credentials.</p>
      <label class="fld"><span>Email</span><input id="email" class="input" type="email" autocomplete="username" placeholder="owner@cafe.com"></label>
      <label class="fld"><span>Password</span><input id="pass" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <div class="err" id="authErr"></div>
      <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:16px">Sign in</button>
      <button id="backToUsersBtn" class="btn btn-ghost btn-block" style="margin-top:8px">← Back to User Select</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appView">
  <div class="app-shell">
    <aside class="sidebar-shell">
      <div class="brand-block">
        <div class="brand-cup"></div>
        <div class="brand-name">MUGNA</div>
      </div>

      <nav class="sidebar-nav" aria-label="Sidebar navigation">
        <button class="nav-item active" type="button" data-nav="dashboard"><span class="nav-icon">📊</span><span>Dashboard</span></button>
        <button class="nav-item" type="button" data-nav="sales"><span class="nav-icon">🧾</span><span>Sales</span></button>
        <button class="nav-item" type="button" data-nav="finance"><span class="nav-icon">💰</span><span>Finance</span></button>
        <button class="nav-item" type="button" data-nav="hr"><span class="nav-icon">👥</span><span>HR</span></button>
        <button class="nav-item" type="button" data-nav="menu"><span class="nav-icon">☕</span><span>Menu & Inventory</span></button>
        <button class="nav-item" type="button" data-nav="reports"><span class="nav-icon">📈</span><span>Reports</span></button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" type="button" data-nav="settings"><span class="nav-icon">⚙️</span><span>Settings</span></button>
        <button class="nav-item" type="button" id="switchUserBtn" style="color:#9e3a2b"><span class="nav-icon">🚪</span><span>Switch User</span></button>
      </div>
    </aside>

    <div class="content-shell">
      <header class="apphead">
        <button class="homebtn" id="homeBtn" title="Home"><span class="brand-cup"></span><span class="brand-name" id="headerBrandName">Café Ledger</span></button>
        <div style="display:flex; align-items:center; gap:10px">
          <div class="user-pill">
            <span id="activeUserName">Staff</span>
          </div>
        </div>
      </header>
      <main class="main" id="mainContent"></main>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

<script>
const SUPABASE_URL  = "https://vnztvasfojliizflrnix.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuenR2YXNmb2psaWl6Zmxybml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDQ4NjAsImV4cCI6MjA5NjkyMDg2MH0.ec2qhBYO58i9";
const BUCKET = "files";
const OWNER_PIN = "1998";
const CONFIGURED = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON.includes("YOUR-ANON");
let sb = null;
if (CONFIGURED) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,a={},...kids)=>{const n=document.createElement(t);for(const k in a){if(k==="class")n.className=a[k];else if(k==="html")n.innerHTML=a[k];else if(k.startsWith("on")&&typeof a[k]==="function")n.addEventListener(k.slice(2).toLowerCase(),a[k]);else n.setAttribute(k,a[k]);}kids.forEach(c=>{if(c!==null&&c!==undefined)n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;};
const peso = n => "₱"+(Number(n)||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO = ()=> new Date().toISOString().slice(0,10);

function getWeekStart() {
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(now.setDate(diff)).toISOString().slice(0,10);
}

function toast(msg,kind=""){const t=el("div",{class:"toast "+kind},msg);$("#toasts").append(t);setTimeout(()=>t.style.opacity=0,2200);setTimeout(()=>t.remove(),2600);}

const State = { 
  currentUser: { id: "owner_main", name: "Owner", role: "owner" },
  data: { menu:[], sales:[], expenses:[], shifts:[], staff_roster:[], settings:null },
  charts: {}
};

function getActiveProfiles() {
  const roster = State.data.staff_roster || [];
  const staffList = roster.map(s => ({id: s.id, name: s.name, role: "staff", pin: s.pin || ""}));
  return [...staffList, { id: "owner_main", name: "Owner / Mgmt", role: "owner", pin: OWNER_PIN }];
}

function updateUserDisplay(){
  const nameEl = $("#activeUserName");
  if(nameEl) nameEl.textContent = State.currentUser.name;
}

function renderUserSelection() {
  const grid = $("#userListGrid");
  if(!grid) return;
  grid.innerHTML = "";
  const profiles = getActiveProfiles();
  profiles.forEach(usr => {
    const isOw = usr.role === "owner";
    const card = el("div", {
      class: "user-card" + (isOw ? " owner-card" : ""),
      onclick: () => selectUser(usr)
    },
      el("div", { class: "user-avatar" }, usr.name.charAt(0)),
      el("div", { class: "user-name" }, usr.name),
      el("div", { class: "user-role" }, usr.role)
    );
    grid.append(card);
  });
}

function selectUser(usr) {
  if (usr.role === "owner") {
    promptPIN(() => {
      State.currentUser = usr;
      toast(`Signed in as ${usr.name}`, "ok");
      enterApp();
    });
  } else {
    promptStaffPIN(usr, () => {
      State.currentUser = usr;
      toast(`Signed in as ${usr.name}`, "ok");
      enterApp();
    });
  }
}

function renderDashboard() {
  const main = $("#mainContent");
  main.innerHTML = "";
  
  // Quick POS Button
  const quickPOS = el("div", { class: "quick-actions" },
    el("button", { class: "quick-btn btn-brass", onclick: () => goToSection("sales") },
      el("span", { class: "ico" }, "🛒"),
      el("span", {}, "Go to POS")
    )
  );
  main.append(quickPOS);

  // KPIs
  const weekStart = getWeekStart();
  const weekSales = State.data.sales.filter(s => s.date >= weekStart).reduce((sum, s) => sum + (Number(s.amount)||0), 0);
  const weekExpenses = State.data.expenses.filter(e => e.date >= weekStart).reduce((sum, e) => sum + (Number(e.amount)||0), 0);

  const kpis = el("div", { class: "dashboard-kpi" },
    el("div", { class: "dashboard-card" },
      el("h3", {}, "Weekly Sales So Far"),
      el("div", { class: "big-val in" }, peso(weekSales)),
      el("div", { class: "sub-val" }, `Since ${new Date(weekStart).toLocaleDateString('en-PH', {month:'short', day:'numeric'})}`)
    ),
    el("div", { class: "dashboard-card" },
      el("h3", {}, "Weekly Expenses So Far"),
      el("div", { class: "big-val out" }, peso(weekExpenses)),
      el("div", { class: "sub-val" }, "Including quick expenses")
    )
  );
  main.append(kpis);

  // Charts
  const chartsRow = el("div", { class: "cols-2" });
  
  // Sales by drink type
  const drinkChart = el("div", { class: "chart-container" },
    el("canvas", { id: "drinkChart" })
  );
  chartsRow.append(drinkChart);

  // Expenses by category
  const expenseChart = el("div", { class: "chart-container" },
    el("canvas", { id: "expenseChart" })
  );
  chartsRow.append(expenseChart);

  main.append(chartsRow);

  // Render charts after DOM is ready
  setTimeout(() => {
    renderDrinkChart();
    renderExpenseChart();
  }, 0);
}

function renderDrinkChart() {
  const ctx = document.getElementById("drinkChart")?.getContext("2d");
  if (!ctx) return;
  
  const drinkSales = {};
  State.data.sales.forEach(s => {
    const type = s.drink_type || "Other";
    drinkSales[type] = (drinkSales[type] || 0) + (Number(s.amount) || 0);
  });

  new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: Object.keys(drinkSales),
      datasets: [{
        data: Object.values(drinkSales),
        backgroundColor: ["#d35e2a", "#5e7350", "#9e3a2b", "#6b4a35", "#a98a73"],
        borderColor: "#fff",
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 12 }, padding: 12 }}
      }
    }
  });
}

function renderExpenseChart() {
  const ctx = document.getElementById("expenseChart")?.getContext("2d");
  if (!ctx) return;
  
  const expByCategory = {};
  State.data.expenses.forEach(e => {
    const cat = e.category || "Other";
    expByCategory[cat] = (expByCategory[cat] || 0) + (Number(e.amount) || 0);
  });

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: Object.keys(expByCategory),
      datasets: [{
        label: "Expenses (₱)",
        data: Object.values(expByCategory),
        backgroundColor: "#9e3a2b",
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: "y",
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: { beginAtZero: true }
      }
    }
  });
}

function renderSales() {
  const main = $("#mainContent");
  main.innerHTML = "";

  // Tabs
  const tabsContainer = el("div", { class: "tabs" },
    el("button", { class: "tab-btn active", "data-tab": "pos" }, "POS Terminal"),
    el("button", { class: "tab-btn", "data-tab": "summary" }, "Sales Summary"),
    el("button", { class: "tab-btn", "data-tab": "reconciliation" }, "Reconciliation")
  );
  main.append(tabsContainer);

  // POS Content
  const posTab = el("div", { class: "tab-content active", id: "pos-content" });
  renderPOSContent(posTab);
  main.append(posTab);

  // Summary Content
  const summaryTab = el("div", { class: "tab-content", id: "summary-content" });
  summaryTab.append(el("p", {}, "Sales summary coming soon..."));
  main.append(summaryTab);

  // Reconciliation Content
  const reconTab = el("div", { class: "tab-content", id: "reconciliation-content" });
  reconTab.append(el("p", {}, "Reconciliation coming soon..."));
  main.append(reconTab);

  // Tab switching
  $$(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      $$(".tab-btn").forEach(b => b.classList.remove("active"));
      $$(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.dataset.tab;
      $(`#${tab}-content`)?.classList.add("active");
    });
  });
}

function renderPOSContent(container) {
  // Staff clock in/out section
  const staffSections = el("div", {});
  
  const staffList = State.data.shifts || [];
  staffList.forEach(shift => {
    const staffBox = el("div", { class: "staff-box" },
      el("div", { class: "staff-header" },
        el("div", {}, 
          el("div", { class: "staff-name" }, shift.staff_name || "Staff Member"),
          el("div", { class: "staff-status" }, shift.status === "clocked_in" ? "Clocked In" : "Clocked Out")
        ),
        el("div", { class: "staff-actions" },
          el("button", { class: "btn btn-lg btn-brass", onclick: () => toast("Clock " + (shift.status === "clocked_in" ? "out" : "in") + " for " + (shift.staff_name || "staff")) }, 
            shift.status === "clocked_in" ? "🕐 Clock Out" : "🕐 Clock In"
          ),
          el("button", { class: "btn btn-md btn-ghost", onclick: () => toast("Quick expense recorded") }, 
            "💸 Quick Expense"
          ),
          el("button", { class: "btn btn-md btn-ghost", onclick: () => toast("Float updated") }, 
            "💵 Float"
          )
        )
      )
    );
    staffSections.append(staffBox);
  });

  // If no shifts, show demo
  if (staffList.length === 0) {
    const demoBox = el("div", { class: "staff-box" },
      el("div", { class: "staff-header" },
        el("div", {}, 
          el("div", { class: "staff-name" }, "Barista Demo"),
          el("div", { class: "staff-status" }, "Clocked Out")
        ),
        el("div", { class: "staff-actions" },
          el("button", { class: "btn btn-lg btn-brass" }, "🕐 Clock In"),
          el("button", { class: "btn btn-md btn-ghost" }, "💸 Quick Expense"),
          el("button", { class: "btn btn-md btn-ghost" }, "💵 Float")
        )
      )
    );
    staffSections.append(demoBox);
  }

  container.append(staffSections);
}

function goToSection(section) {
  $$(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.nav === section));
  
  if (section === "dashboard") renderDashboard();
  else if (section === "sales") renderSales();
  else toast("Section " + section + " coming soon", "ok");
}

function promptPIN(onOk){
  let entered="";
  const dots=el("div",{class:"pindots"}, ...[0,1,2,3].map(()=>el("i",{})));
  const err=el("div",{class:"err",style:"text-align:center;min-height:1em"});
  function refreshDots(){ $$("i",dots).forEach((d,i)=>d.classList.toggle("on", i<entered.length)); }
  function press(v){
    if(v==="del"){ entered=entered.slice(0,-1); }
    else if(entered.length<4){ entered+=v; }
    refreshDots();
    if(entered.length===4){
      if(entered===String(OWNER_PIN)){ back.remove(); onOk(); }
      else { err.textContent="Wrong PIN"; entered=""; setTimeout(refreshDots,120); }
    }
  }
  const pad=el("div",{class:"pinpad"});
  ["1","2","3","4","5","6","7","8","9"].forEach(n=>pad.append(el("button",{onclick:()=>press(n)},n)));
  pad.append(el("button",{onclick:()=>press("del"),style:"font-size:15px"},"⌫"), el("button",{onclick:()=>press("0")},"0"), el("button",{onclick:()=>back.remove(),style:"font-size:14px"},"Cancel"));
  const back=openModal({title:"Owner PIN", body:el("div",{}, el("p",{class:"muted",style:"text-align:center;margin-top:0"},"Enter PIN"), dots, err, pad)});
}

function promptStaffPIN(staffUser, onOk){
  let entered="";
  const dots=el("div",{class:"pindots"}, ...[0,1,2,3,4,5].map(()=>el("i",{})));
  const err=el("div",{class:"err",style:"text-align:center;min-height:1em"});
  function refreshDots(){ $$("i",dots).forEach((d,i)=>d.classList.toggle("on", i<entered.length)); }
  function press(v){
    if(v==="del"){ entered=entered.slice(0,-1); }
    else if(entered.length<6){ entered+=v; }
    refreshDots();
    if(entered.length===6){
      const expectedPIN = String(staffUser.pin || "").trim();
      if(expectedPIN && entered === expectedPIN){ back.remove(); onOk(); }
      else { err.textContent="Wrong PIN"; entered=""; setTimeout(refreshDots,120); }
    }
  }
  const pad=el("div",{class:"pinpad"});
  ["1","2","3","4","5","6","7","8","9"].forEach(n=>pad.append(el("button",{onclick:()=>press(n)},n)));
  pad.append(el("button",{onclick:()=>press("del"),style:"font-size:15px"},"⌫"), el("button",{onclick:()=>press("0")},"0"), el("button",{onclick:()=>back.remove(),style:"font-size:14px"},"Cancel"));
  const back=openModal({title:`Sign In: ${staffUser.name}`, body:el("div",{}, el("p",{class:"muted",style:"text-align:center;margin-top:0"},"Enter 6-digit PIN"), dots, err, pad)});
}

function openModal({title, body, footer}){
  const back=el("div",{class:"modal-back",onclick:e=>{if(e.target===back)back.remove();}});
  const m=el("div",{class:"modal"});
  m.append(el("div",{class:"modal-head"}, el("h3",{},title), el("button",{class:"x",onclick:()=>back.remove()},"✕")));
  const b=el("div",{class:"modal-body"}); 
  b.append(body); 
  m.append(b);
  if(footer){const f=el("div",{class:"modal-foot"}); footer(back).forEach(x=>f.append(x)); m.append(f);}
  back.append(m); 
  $("#modalRoot").append(back); 
  return back;
}

function bindSidebarNav() {
  $$(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      const target = item.dataset.nav;
      if (target) {
        $$(".nav-item").forEach(n => n.classList.toggle("active", n === item));
        goToSection(target);
      }
    });
  });
  $("#switchUserBtn").addEventListener("click", () => {
    $("#appView").style.display = "none";
    $("#authView").classList.remove("hide");
    renderUserSelection();
  });
}

async function loadAll(){
  if(!CONFIGURED) return;
  const tables=["menu","sales","expenses","shifts","staff_roster"];
  await Promise.all(tables.map(async t=>{
    try {
      const {data,error}=await sb.from(t).select("*").order("created_at",{ascending:false});
      if(error) State.data[t]=[];
      else State.data[t]=data||[];
    } catch (e) {
      State.data[t]=[];
    }
  }));
  const {data:st}=await sb.from("settings").select("*").eq("id",1).maybeSingle().catch(()=>({}));
  State.data.settings = st || {id:1, business_name:"Café Ledger"};
}

function enterApp() {
  $("#authView").classList.add("hide");
  $("#appView").style.display = "block";
  updateUserDisplay();
  bindSidebarNav();
  renderDashboard();
}

// Boot
(async function(){
  try {
    await loadAll();
    renderUserSelection();
  } catch (e) {
    console.error(e);
  } finally {
    $("#loadingView").classList.add("hide");
    $("#authView").classList.remove("hide");
  }
})();
</script>
