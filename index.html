/* ============================================================
   PAYROLL & SCHEDULE SHEET (With "PAID" Confirmation & Dispute Edits)
   ============================================================ */
let ACTIVE_PAY_PERIOD_ID = null;

function renderPayrollSheet(root) {
  if (!isOwner()) {
    root.append(el("div", { class: "notice" }, "🔒 Owner PIN Required to view Payroll & Pay Schedule."));
    return;
  }

  root.append(topbar("Payroll & Pay Schedule Sheet", "Calculate regular hours, dispute corrections, and confirm payroll payout as Salary expense"));

  const periods = State.data.pay_periods || [];
  const roster = State.data.staff_roster || [];
  const shifts = State.data.shifts || [];
  const payrollRuns = State.data.payroll_runs || [];

  if (!periods.length && !ACTIVE_PAY_PERIOD_ID) {
    ACTIVE_PAY_PERIOD_ID = "custom";
  } else if (!ACTIVE_PAY_PERIOD_ID && periods.length) {
    ACTIVE_PAY_PERIOD_ID = periods[0].id;
  }

  const periodSel = el("select", { class: "input", style: "max-width:280px;", onchange: (e) => { ACTIVE_PAY_PERIOD_ID = e.target.value; go("payroll"); }});
  periods.forEach(p => {
    periodSel.append(el("option", { value: p.id, selected: ACTIVE_PAY_PERIOD_ID === p.id }, `${p.period_name} (${p.start_date} to ${p.end_date})`));
  });
  periodSel.append(el("option", { value: "custom", selected: ACTIVE_PAY_PERIOD_ID === "custom" }, "Create New Pay Period..."));

  const head = el("div", { class: "section-head" },
    el("div", { style: "display:flex; align-items:center; gap:10px;" }, el("span", { style: "font-weight:600;" }, "Active Pay Period:"), periodSel),
    el("button", { class: "btn btn-ghost btn-sm", onclick: () => createPayPeriodModal() }, "＋ Add Period")
  );
  root.append(head);

  if (ACTIVE_PAY_PERIOD_ID === "custom") {
    root.append(el("div", { class: "empty" }, "Select or create a Pay Period to generate the payroll run."));
    return;
  }

  const activePeriod = periods.find(p => p.id === ACTIVE_PAY_PERIOD_ID);
  if (!activePeriod) return;

  const tw = el("div", { class: "tbl-wrap card", style: "padding:0; overflow:hidden;" });
  const t = el("table");
  t.append(el("thead", {}, el("tr", {},
    el("th", {}, "Employee"),
    el("th", { class: "num" }, "Reg Hrs"),
    el("th", { class: "num" }, "Late/Undertime"),
    el("th", { class: "num" }, "OT Hrs"),
    el("th", { class: "num" }, "Gross Pay"),
    el("th", {}, "Status / Payout")
  )));

  const tb = el("tbody");
  let totalPayrollOut = 0;

  const pStart = new Date(activePeriod.start_date + "T00:00:00");
  const pEnd = new Date(activePeriod.end_date + "T23:59:59");

  roster.forEach(emp => {
    const empShifts = shifts.filter(s => {
      if (s.name !== emp.name || !s.time_out) return false;
      const d = new Date(s.time_in);
      return d >= pStart && d <= pEnd;
    });

    let calcRegHrs = 0;
    let calcLateHrs = 0;
    let calcOtHrs = 0;

    empShifts.forEach(s => {
      const tIn = new Date(s.time_in);
      const tOut = new Date(s.time_out);
      const actualHrs = (tOut - tIn) / 3.6e6;

      const dayOfWeek = tIn.toLocaleDateString('en-US', {weekday: 'long'}).toLowerCase();
      const schedState = (emp.work_schedule || {})[dayOfWeek];

      let schedHrs = 0;
      let isRestDay = true;

      if (schedState && schedState.enabled) {
        isRestDay = false;
        let [sh, sm] = (schedState.start || "00:00").split(':').map(Number);
        let [eh, em] = (schedState.end || "00:00").split(':').map(Number);
        let sDec = sh + sm/60;
        let eDec = eh + em/60;
        if (eDec <= sDec) eDec += 24; 
        schedHrs = eDec - sDec;
      }

      if (isRestDay) {
        calcOtHrs += actualHrs;
      } else {
        if (actualHrs >= schedHrs) {
          calcRegHrs += schedHrs;
          calcOtHrs += (actualHrs - schedHrs);
        } else {
          calcRegHrs += actualHrs;
          calcLateHrs += (schedHrs - actualHrs);
        }
      }
    });

    // Check if payroll run exists for this period & employee
    const existingRun = payrollRuns.find(pr => pr.period_id === activePeriod.id && pr.employee_id === emp.id);
    
    const regHrs = existingRun != null && existingRun.reg_hrs != null ? Number(existingRun.reg_hrs) : calcRegHrs;
    const otHrs = existingRun != null && existingRun.ot_hrs != null ? Number(existingRun.ot_hrs) : calcOtHrs;

    const dailyRate = Number(emp.daily_rate || 0);
    const hourlyRate = dailyRate / 8;
    const otRate = hourlyRate * 1.25;

    const basePay = regHrs * hourlyRate;
    const otPay = otHrs * otRate;
    const grossPay = basePay + otPay;
    
    if (existingRun && existingRun.status === "paid") {
      totalPayrollOut += Number(existingRun.amount_paid || grossPay);
    }

    const payStatusCell = el("td", {});
    if (existingRun && existingRun.status === "paid") {
      payStatusCell.append(el("span", { class: "tag match" }, `✓ PAID (${peso(existingRun.amount_paid)} via ${existingRun.payment_method})`),
        el("button", { class: "iconbtn", style: "margin-left:6px;", title: "Edit / Dispute", onclick: () => openPayrollPayModal(activePeriod, emp, { reg_hrs: regHrs, ot_hrs: otHrs, gross_pay: grossPay }, existingRun) }, "✎")
      );
    } else {
      payStatusCell.append(el("button", { class: "btn btn-brass btn-sm", onclick: () => openPayrollPayModal(activePeriod, emp, { reg_hrs: regHrs, ot_hrs: otHrs, gross_pay: grossPay }, null) }, "💵 Mark Paid / Review"));
    }

    tb.append(el("tr", {},
      el("td", { style: "font-weight:600;" }, emp.name),
      el("td", { class: "num", style: "color:var(--sage);" }, regHrs.toFixed(1) + "h"),
      el("td", { class: "num", style: "color:var(--clay);" }, calcLateHrs > 0 ? calcLateHrs.toFixed(1) + "h" : "—"),
      el("td", { class: "num", style: "color:var(--brass-deep);" }, otHrs > 0 ? otHrs.toFixed(1) + "h" : "—"),
      el("td", { class: "num", style: "font-weight:700;" }, peso(grossPay)),
      payStatusCell
    ));
  });

  t.append(tb);
  t.append(el("tfoot", {}, el("tr", {},
    el("td", { colspan: "5", style: "font-weight:700;" }, "Total Paid Payroll Outlay"),
    el("td", { class: "num", style: "font-weight:700; font-size:16px;" }, peso(totalPayrollOut))
  )));

  tw.append(t);
  root.append(tw);
}

function openPayrollPayModal(period, emp, computed, existingRun) {
  const regHrsIn = el("input", { class: "input", type: "number", step: "0.1", value: existingRun ? existingRun.reg_hrs : computed.reg_hrs });
  const otHrsIn = el("input", { class: "input", type: "number", step: "0.1", value: existingRun ? existingRun.ot_hrs : computed.ot_hrs });
  
  const dailyRate = Number(emp.daily_rate || 0);
  const hourlyRate = dailyRate / 8;
  const otRate = hourlyRate * 1.25;

  const defaultAmt = existingRun ? existingRun.amount_paid : computed.gross_pay;
  const amountIn = el("input", { class: "input", type: "number", step: "0.01", value: defaultAmt });

  let method = existingRun ? existingRun.payment_method : "Cash";
  const payMethodSel = el("select", { class: "input" },
    el("option", { value: "Cash", selected: method === "Cash" }, "Cash"),
    el("option", { value: "GCash", selected: method === "GCash" }, "GCash")
  );

  const dateIn = el("input", { class: "input", type: "date", value: existingRun ? existingRun.payout_date : todayISO() });

  // Recalculate suggested amount when hours change
  regHrsIn.oninput = () => {
    const rh = parseFloat(regHrsIn.value) || 0;
    const oh = parseFloat(otHrsIn.value) || 0;
    amountIn.value = ((rh * hourlyRate) + (oh * otRate)).toFixed(2);
  };
  otHrsIn.oninput = () => {
    const rh = parseFloat(regHrsIn.value) || 0;
    const oh = parseFloat(otHrsIn.value) || 0;
    amountIn.value = ((rh * hourlyRate) + (oh * otRate)).toFixed(2);
  };

  const body = el("div", {},
    el("div", { class: "notice", style: "margin-bottom:12px;" }, `Confirming payout for <b>${emp.name}</b> (${period.period_name}). You can correct hours here if there's a dispute (e.g. changing 80h to 40h).`),
    el("div", { class: "form-row" }, field("Corrected Regular Hours", regHrsIn), field("Corrected OT Hours", otHrsIn)),
    el("div", { class: "form-row" }, field("Amount to Pay (₱)", amountIn), field("Payment Method", payMethodSel)),
    field("Payout Date (Logs as expense on this day)", dateIn)
  );

  openModal({
    title: `Payroll Payout: ${emp.name}`,
    body,
    footer: bk => [
      el("button", { class: "btn btn-ghost", onclick: () => bk.remove() }, "Cancel"),
      el("button", { class: "btn btn-brass", onclick: async () => {
        const amt = parseFloat(amountIn.value) || 0;
        if (amt <= 0) return toast("Enter valid amount", "bad");

        const rh = parseFloat(regHrsIn.value) || 0;
        const oh = parseFloat(otHrsIn.value) || 0;
        const selectedMethod = payMethodSel.value;
        const payoutDate = dateIn.value || todayISO();

        try {
          const runRow = {
            period_id: period.id,
            employee_id: emp.id,
            reg_hrs: rh,
            ot_hrs: oh,
            amount_paid: amt,
            payment_method: selectedMethod,
            payout_date: payoutDate,
            status: "paid"
          };

          if (existingRun) {
            await upd("payroll_runs", existingRun.id, runRow);
          } else {
            await ins("payroll_runs", runRow);
          }

          // Salary expense for reports (the books post salary from payroll_runs, never twice)
          const expenseSource = selectedMethod === "Cash" ? "Business" : "GCash";
          if (!existingRun) await ins("expenses", {
            spent_at: payoutDate,
            supplier: emp.name,
            description: `Salary Payout: ${emp.name} (${period.period_name})`,
            category: "Salary",
            amount: amt,
            expense_type: "Recurring",
            source: expenseSource,
            status: "approved",
            has_receipt: "Yes"
          });

          await Promise.all([refresh("payroll_runs"), refresh("expenses")]);
          bk.remove();
          go("payroll");
          toast("Payroll marked as PAID and logged as Salary expense!", "ok");
        } catch (e) {
          toast(e.message, "bad");
        }
      }}, "Confirm Paid & Log Expense")
    ]
  });
}

async function deductInventory(items, sign){
  const m=ingMap(); const deltas={};
  items.forEach(li=>{const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi)return;
    recipeForLine(mi, li, m).forEach(r=>{
      deltas[r.ingredient_id]=(deltas[r.ingredient_id]||0)+ r.qty*li.qty*sign;
    });});
  for(const id in deltas){const ing=m[id]; if(!ing||ing.stock_qty==null)continue;
    const next=Number(ing.stock_qty)-deltas[id];
    try{await upd("ingredients",id,{stock_qty:next});}catch(_){}}
}

function inRange(dateStr, range){
  const d=new Date(dateStr); const now=new Date();
  if(range==="all")return true;
  if(range==="today")return d.toDateString()===now.toDateString();
  const days=parseInt(range); return (now-d) <= days*864e5;
}

function settingsColors(){
  const draft={...themeOf()};
  const row=el("div",{class:"color-row"}), prev=el("div",{}), note=el("div",{class:"contrast-note"});
  const ratio=()=>contrastRatio(_hex(draft.text),_hex(draft.bg));
  function redraw(){
    paintThemePreview(prev,draft);
    const r=ratio();
    note.textContent = r>=4.5 ? `Text on background: easy to read (${r.toFixed(1)}:1).`
      : r>=3 ? `Text on background is a bit faint (${r.toFixed(1)}:1). Aim for 4.5 or more.`
      : `Text on background is too hard to read (${r.toFixed(1)}:1). Pick colors that contrast more.`;
    note.style.color = r>=4.5 ? "var(--sage)" : (r>=3 ? "var(--warn)" : "var(--clay)");
  }
  [["accent","Accent","Buttons and the active menu item"],["bg","Background","Page and panels"],["text","Text","Headings and body text"]].forEach(([k,l,h])=>{
    const pick=el("input",{type:"color",value:draft[k],"aria-label":l+" color"});
    const hex=el("input",{class:"input",value:draft[k],maxlength:7,"aria-label":l+" hex code"});
    pick.addEventListener("input",()=>{ draft[k]=pick.value; hex.value=pick.value; redraw(); });
    hex.addEventListener("input",()=>{ let v=hex.value.trim(); if(v && v[0]!=="#") v="#"+v;
      if(v.length===7 && _hex(v)){ draft[k]=v.toLowerCase(); pick.value=draft[k]; redraw(); } });
    row.append(field(l, el("div",{class:"color-pick"},pick,hex), h));
  });
  redraw();
  const card=settingsCard("Colors","Choose your café's look. It applies to everyone who signs in to your café, on every device.",
    [row, prev, note],
    async()=>{
      if(ratio()<3){ toast("Text and background are too close. Pick colors that contrast more.","bad"); return false; }
      const ok=await saveSettings({config:{...cfg(), theme:{accent:draft.accent, bg:draft.bg, text:draft.text}}});
      if(ok){ applyTheme(cfg().theme); go("settings"); } return ok;
    }, "Save colors");
  const reset=el("button",{class:"btn btn-ghost",type:"button",onclick:async()=>{
    const ok=await saveSettings({config:{...cfg(), theme:null}});
    if(ok){ applyTheme(null); toast("Back to the default colors","ok"); go("settings"); } }},"Reset to default");
  card.querySelector(".set-actions").prepend(reset);
  return card;
}

/* ============================================================
   CAFÉ COLORS: accent, background, text
   The rest of the palette (cards, lines, muted text) is worked out from these three.
   ============================================================ */
const THEME_DEFAULT = { accent:"#d35e2a", bg:"#f8f7f5", text:"#241a15" };
const THEME_VARS = ["--brass","--brass-deep","--on-accent","--paper","--paper-2","--card","--line","--line-soft","--ink","--bean","--bean-soft","--side-muted"];
const _hex = h => { h=String(h||"").trim().replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); return /^[0-9a-f]{6}$/i.test(h) ? [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)) : null; };
const _toHex = a => "#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const _mix = (a,b,t) => _toHex(a.map((v,i)=>v+(b[i]-v)*t));
const _lum = a => { const f=v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }; return .2126*f(a[0])+.7152*f(a[1])+.0722*f(a[2]); };
const contrastRatio = (a,b) => { const x=_lum(a), y=_lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
function themeOf(){ const t=cfg().theme||{}; return { accent:t.accent||THEME_DEFAULT.accent, bg:t.bg||THEME_DEFAULT.bg, text:t.text||THEME_DEFAULT.text }; }
function applyTheme(t){
  const root=document.documentElement.style;
  const A=_hex(t&&t.accent), B=_hex(t&&t.bg), T=_hex(t&&t.text);
  if(!A||!B||!T){ THEME_VARS.forEach(v=>root.removeProperty(v)); return; }   // no theme saved: use the built-in look
  const light=_lum(B)>0.4, white=[255,255,255], set=(k,v)=>root.setProperty(k,v);
  set("--brass",_toHex(A));            set("--brass-deep",_mix(A,[0,0,0],.2));
  set("--on-accent", _lum(A)>0.5 ? "#1b130f" : "#ffffff");
  set("--paper",_toHex(B));            set("--paper-2",_mix(B,T,.07));
  set("--card", light ? _mix(B,white,.65) : _mix(B,white,.07));
  set("--line",_mix(B,T,.14));         set("--line-soft",_mix(B,T,.07));
  set("--ink",_toHex(T));              set("--bean",_mix(T,B,.32));
  set("--bean-soft",_mix(T,B,.55));    set("--side-muted",_mix(T,B,.45));
}
function paintThemePreview(box,t){
  const A=_hex(t.accent), B=_hex(t.bg), T=_hex(t.text); if(!A||!B||!T) return;
  const light=_lum(B)>0.4, card=light?_mix(B,[255,255,255],.65):_mix(B,[255,255,255],.07),
        line=_mix(B,T,.14), mut=_mix(T,B,.4), on=_lum(A)>0.5?"#1b130f":"#ffffff", a=_toHex(A);
  box.innerHTML=`<div class="theme-preview" style="background:${_toHex(B)};color:${_toHex(T)}">
    <div style="display:grid;grid-template-columns:110px 1fr;min-height:150px">
      <div style="background:${card};border-right:1px solid ${line};padding:12px 0">
        <div style="margin:0 10px 6px 0;padding:7px 12px;border-radius:0 99px 99px 0;background:${a};color:${on};font-weight:600;font-size:13px">Sales</div>
        <div style="padding:7px 12px;font-size:13px;color:${mut}">Finance</div>
        <div style="padding:7px 12px;font-size:13px;color:${mut}">Menu</div></div>
      <div style="padding:14px"><div style="font-weight:700;font-size:16px">Today</div>
        <div style="margin-top:8px;padding:12px;border-radius:12px;background:${card};border:1px solid ${line}">
          <div style="color:${mut};font-size:12px">Sales</div><div style="font-weight:700;font-size:20px">₱1,250.00</div>
          <button type="button" style="margin-top:10px;border:0;border-radius:9px;padding:8px 14px;font-weight:600;background:${a};color:${on}">Pay</button></div></div></div></div>`;
}

// Owner PIN. With migration 01 + acct_set_owner_pin(), the PIN is checked by the database
// (and the old PIN in this file stops working). onOk(token) receives an owner session token.
function promptPIN(onOk, opts={}){
  if(State.v>=10 && !serverPins()) return ownerPinMissing(onOk);
  let entered="", busy=false;
  const dots=el("div",{class:"pindots"}, ...[0,1,2,3].map(()=>el("i",{})));
  const err=el("div",{class:"err",style:"text-align:center;min-height:1em"});
  function refreshDots(){ $$("i",dots).forEach((d,i)=>d.classList.toggle("on", i<entered.length)); }
  async function check(){
    busy=true;
    try{
      if(serverPins()){
        const r=await rpc("rpc_login",State.v>=10?{p_who:"owner",p_pin:entered,p_device:BUHAT.device}:{p_who:"owner",p_pin:entered});
        if(r && r.device_unlinked){ back.remove(); forgetDevice(); toast(r.error,"bad"); showBuhatLogin(); return; }
        if(r && r.paused){ back.remove(); BUHAT.paused={name:BUHAT.cafe&&BUHAT.cafe.name, msg:r.error}; showPaused(); return; }
        if(r && r.ok){ back.remove(); onOk(r.token); return; }
        err.textContent=(r&&r.error)||"Wrong PIN";
      } else if(State.v<10 && entered===String(OWNER_PIN)){ back.remove(); onOk(null); return; }
      else err.textContent="Wrong PIN";
    }catch(e){ err.textContent=e.message; }
    entered=""; busy=false; setTimeout(refreshDots,120);
  }
  function press(v){
    if(busy) return;
    if(v==="del"){ entered=entered.slice(0,-1); } else if(entered.length<4){ entered+=v; }
    refreshDots(); if(entered.length===4) check();
  }
  const pad=el("div",{class:"pinpad"});
  ["1","2","3","4","5","6","7","8","9"].forEach(n=>pad.append(el("button",{onclick:()=>press(n)},n)));
  pad.append(el("button",{onclick:()=>press("del"),style:"font-size:15px"},"⌫"), el("button",{onclick:()=>press("0")},"0"), el("button",{onclick:()=>back.remove(),style:"font-size:14px"},"Cancel"));
  const back=openModal({title:opts.title||"Owner PIN required", body:el("div",{}, el("p",{class:"muted",style:"text-align:center;margin-top:0"},opts.sub||"Enter the owner PIN to continue."), dots, err, pad)});
}

/* Clock-in / clock-out reminder for the signed-in staff member (wording + timing in Settings) */
function shiftReminderText(){
  if(isOwner()) return null;
  const u=State.currentUser, r=cfg().reminders||{};
  const wd=new Date().toLocaleDateString("en-US",{weekday:"long"}).toLowerCase();
  const sch=(u.work_schedule||{})[wd]; if(!sch||!sch.enabled||!sch.start||!sch.end) return null;
  const now=new Date(), start=new Date(), end=new Date();
  const [sh,sm]=sch.start.split(":").map(Number), [eh,em]=sch.end.split(":").map(Number);
  start.setHours(sh,sm,0,0); end.setHours(eh,em,0,0); if(end<=start) end.setDate(end.getDate()+1);
  const open=(State.data.shifts||[]).find(s=>!s.time_out && s.name===u.name);
  const before=Number(r.clockin_minutes_before ?? 0), outMins=Number(r.clockout_minutes_before ?? 10);
  const fill=t=>String(t).replaceAll("{name}", u.name);
  if(!open && now >= new Date(start - before*6e4) && now < end) return {kind:"in", text:fill(r.clockin_msg||"Hi {name}, please do not forget to clock in.")};
  if(open && now >= new Date(end - outMins*6e4)) return {kind:"out", text:fill(r.clockout_msg||"Hey {name}, don't forget to clock out.")};
  return null;
}
function drawReminder(){
  const box=$("#posReminder"); if(!box) return; box.innerHTML="";
  const r=shiftReminderText(); box.classList.toggle("hide", !r); if(!r) return;
  const open=(State.data.shifts||[]).find(s=>!s.time_out && s.name===State.currentUser.name);
  box.className="reminder "+(r.kind==="in"?"is-in":"is-out");
  box.append(el("div",{class:"reminder-text"}, r.text),

}

/* ---------- Period filter: Today · Yesterday · This week (Sun) · This month · Custom ---------- */
function localISO(d){ d=new Date(d); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function weekStart(d=new Date()){ const s=new Date(d); s.setHours(0,0,0,0); s.setDate(s.getDate()-s.getDay()); return s; }
function periodBounds(st){
  const now=new Date(), t0=new Date(now); t0.setHours(0,0,0,0);
  const day=864e5;
  switch(st.mode){
    case "today": return [t0, new Date(+t0+day)];
    case "yesterday": return [new Date(+t0-day), t0];
    case "week": return [weekStart(now), new Date(+t0+day)];
    case "month": return [new Date(now.getFullYear(),now.getMonth(),1), new Date(+t0+day)];
    case "lastmonth": return [new Date(now.getFullYear(),now.getMonth()-1,1), new Date(now.getFullYear(),now.getMonth(),1)];
    case "custom": if(st.start&&st.end) return [new Date(st.start+"T00:00:00"), new Date(new Date(st.end+"T00:00:00").getTime()+day)]; return [null,null];
    default: return [null,null];
  }
}
function filterPeriod(items, dateFn, st){
  const [a,b]=periodBounds(st);
  return (items||[]).filter(r=>{ const v=dateFn(r); if(!v) return false;
    const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+"T12:00:00") : new Date(v);
    return (!a||d>=a)&&(!b||d<b); });
}
function periodFilter(st, onUpdate, extra){
  const ex=extra||[];
  const opts=[...ex.filter(e=>e[0]==="shift"),["today","Today"],["yesterday","Yesterday"],["week","This week"],["month","This month"],...ex.filter(e=>e[0]!=="shift"),["custom","Custom range"]];
  const s=el("input",{class:"input",type:"date",value:st.start,style:"width:auto"}), e=el("input",{class:"input",type:"date",value:st.end,style:"width:auto"});
  const box=el("div",{class:"kbar period-custom"+(st.mode==="custom"?"":" hide")}, s, el("span",{class:"muted"},"to"), e);
  s.onchange=()=>{st.start=s.value; if(st.end) onUpdate();}; e.onchange=()=>{st.end=e.value; if(st.start) onUpdate();};
  const sel=el("select",{class:"input",style:"width:auto;font-size:13px",onchange:ev=>{st.mode=ev.target.value; box.classList.toggle("hide",st.mode!=="custom"); if(st.mode!=="custom") onUpdate();}},
    ...opts.map(([v,l])=>el("option",{value:v,selected:st.mode===v},l)));
  return el("div",{class:"kbar"}, sel, box);
}
function addonTotal(s){ return (s.items||[]).reduce((a,li)=>{const m=li.mods||{}; const nw=(li.addons||[]).reduce((b,x)=>b+(Number(x.price)||0),0); return a+(nw+(Number(m.upsizePrice)||0)+(Number(m.milkPrice)||0)+(Number(m.cupPrice)||0))*(Number(li.qty)||1);},0); }
function cupsSold(sales){ const c={}; sales.forEach(s=>(s.items||[]).forEach(li=>{ const mi=State.data.menu.find(m=>m.id===li.menu_id); if(mi&&!isDrink(mi)) return; c[li.name]=(c[li.name]||0)+(Number(li.qty)||1); })); return c; }

/* ============================================================
   SALES SUMMARY
   ============================================================ */
const SUM_F = { mode:"today", start:"", end:"", pay:"all", ing:"all", item:"all" };
function summaryFilteredSales(includeCancelled){
  let rows=filterPeriod(State.data.sales, saleDay, SUM_F);
  if(!includeCancelled) rows=rows.filter(isActiveSale);
  if(SUM_F.pay!=="all") rows=rows.filter(s=>payMatch(s,SUM_F.pay));
  if(SUM_F.item!=="all") rows=rows.filter(s=>(s.items||[]).some(li=>li.menu_id===SUM_F.item));

function lowStockList(){
  const out=[];
  (State.data.ingredients||[]).forEach(i=>{
    if(i.stock_qty==null) return;
    const stock=Number(i.stock_qty);
    if(i.reorder_level!=null && i.reorder_level!==""){ if(stock<=Number(i.reorder_level)) out.push({i,why:`${stock} ${i.unit||""} left (reorder at ${i.reorder_level})`}); return; }
    const uses=State.data.menu.filter(mm=>mm.active!==false).map(mm=>(mm.recipe||[]).find(r=>r.ingredient_id===i.id)).filter(r=>r&&Number(r.qty)>0);
    if(!uses.length) return;
    const servings=Math.floor(stock/Math.max(...uses.map(r=>Number(r.qty))));
    if(servings<10) out.push({i,why:`about ${Math.max(servings,0)} serving(s) left`});
  });
  return out;
}

      box.innerHTML="";
      const A=bs.assets||[], L=bs.liabilities||[], E=bs.equity||[];
      const cash=sumOf(A,["1000"]), gcash=sumOf(A,["1010"]), bank=sumOf(A,["1020"]), withP=sumOf(A,["1030"]), onHand=cash+gcash+bank+withP;
      const stock=sumOf(A,["1200"]);
      const otherA=A.filter(r=>!["1000","1010","1020","1030","1200"].includes(r.code));
      const putIn=sumOf(E,["3000","3050","3100"]), takenOut=-sumOf(E,["3200"]), retained=sumOf(E,["3900"]);

      box.append(el("div",{class:"snap-eq"},

        el("span",{class:"ok"}, bs.balanced?"✓ Balanced":"⚠ Not balanced: run Check the books")));

      box.append(el("div",{class:"snap-grid"},
        card("Money on hand", onHand, "Cash you could spend today.", [["Cash register",cash],["GCash",gcash],["Bank",bank],...(withP?[["Held by partners",withP]]:[])]),
        card("Stock & other things owned", stock+otherA.reduce((a,r)=>a+Number(r.amount||0),0), "Worth money, but not cash yet.",
          [["Stock on the shelf (at cost)",stock], ...otherA.map(r=>[r.name,r.amount])]),
        card("We owe", owes, owes>0?"Money that isn't really ours yet.":"Nothing owed right now.", L.map(r=>[r.code==="2300"?"Tips owed to staff":r.name, r.amount])),

const isStockCategory = c => /ingredient|inventory|stock/i.test(c||"");
const newLid = () => (crypto.randomUUID ? crypto.randomUUID() : "l"+Date.now()+Math.random().toString(16).slice(2));
const fmtQty = (q,u) => `${(Math.round((Number(q)||0)*100)/100).toLocaleString("en-PH")} ${u||"units"}`;
function lineQty(l){
  const ing=State.data.ingredients.find(i=>i.id===l.ingredient_id);
  if(l.mode==="packs") return (Number(l.packs)||0) * (Number(ing?.pack_size)||0);
  return Number(l.qty)||0;
}
function purchaseSummary(e){
  const items=Array.isArray(e.purchase_items)?e.purchase_items:[];
  if(items.length) return el("div",{class:"muted",style:"font-size:12.5px;margin-top:2px"},
    "🧾 "+items.map(l=> l.mode==="packs"&&l.packs ? `${l.packs} pack${Number(l.packs)===1?"":"s"} ${l.name||""}` : `${fmtQty(l.qty,l.unit)} ${l.name||""}`).join(", "));
  if(e.needs_items) return el("span",{class:"tag fixed",style:"margin-left:6px"},"🧾 Pick ingredients");
  return null;
}

// Editor: returns {node, getItems(), total(), validate()}
function purchaseEditor(initial, opts={}){
  let lines=(Array.isArray(initial)?initial:[]).map(l=>({...l}));
  const ings=[...State.data.ingredients].sort((a,b)=>String(a.name).localeCompare(b.name));
  const wrap=el("div",{class:"purchase-box"}), list=el("div",{class:"recipe-rows"}), foot=el("div",{class:"help"});
  const old = opts.date && State.acct.purchases_since && opts.date < State.acct.purchases_since;
  function draw(){
    list.innerHTML="";
    if(!ings.length) list.append(el("div",{class:"notice"},"No ingredients in Inventory yet. Add them first so purchases can top up their stock."));
    lines.forEach((l,idx)=>{
      const ing=ings.find(i=>i.id===l.ingredient_id);
      const canPacks=!!(ing && Number(ing.pack_size)>0);
      if(!l.mode) l.mode = canPacks ? "packs" : "units";
      if(l.mode==="packs" && !canPacks) l.mode="units";
      const sel=el("select",{class:"input","aria-label":"Ingredient",onchange:e=>{ l.ingredient_id=e.target.value; const i=ings.find(x=>x.id===l.ingredient_id); l.name=i?.name; l.unit=i?.unit; l.mode=(i&&Number(i.pack_size)>0)?"packs":"units"; draw(); }},
        el("option",{value:""},"Choose ingredient"), ...ings.map(i=>el("option",{value:i.id,selected:i.id===l.ingredient_id},i.name)));
      const modeBtns=el("div",{class:"seg",style:"margin:0"},
        el("button",{type:"button",class:l.mode==="packs"?"on":"",disabled:canPacks?null:"","aria-pressed":String(l.mode==="packs"),onclick:()=>{l.mode="packs"; draw();}},"Packs"),
        el("button",{type:"button",class:l.mode==="units"?"on":"","aria-pressed":String(l.mode==="units"),onclick:()=>{l.mode="units"; draw();}}, ing?.unit||"Units"));
      const qtyIn=el("input",{class:"input",type:"number",min:"0",step:"any",inputmode:"decimal",placeholder:l.mode==="packs"?"Packs":"Amount",
        value:(l.mode==="packs"?l.packs:l.qty)??"", oninput:e=>{ const v=parseFloat(e.target.value); if(l.mode==="packs") l.packs=isNaN(v)?null:v; else l.qty=isNaN(v)?null:v; hint.textContent=hintText(); updFoot(); }});
      const priceIn=el("input",{class:"input",type:"number",min:"0",step:"0.01",inputmode:"decimal",placeholder:"₱ price (optional)",value:l.amount??"",
        oninput:e=>{ const v=parseFloat(e.target.value); l.amount=isNaN(v)?null:v; costRow.classList.toggle("hide",!(l.amount>0)); costHint.textContent=costText(); updFoot(); }});
      const costCb=el("input",{type:"checkbox",checked:!!l.update_cost,onchange:e=>{l.update_cost=e.target.checked;}});
      const costHint=el("span",{class:"muted"});
      const costRow=el("label",{class:"check"+(l.amount>0?"":" hide"),style:"margin-top:6px"}, costCb, " Update this ingredient's cost ", costHint);
      const hint=el("div",{class:"help",style:"margin-top:4px"});
      function hintText(){ if(!ing) return ""; const q=lineQty(l); return l.mode==="packs" ? `= ${fmtQty(q,ing.unit)} (1 pack = ${fmtQty(ing.pack_size,ing.unit)})` : (q?`= ${fmtQty(q,ing.unit)}`:""); }
      function costText(){ if(!ing) return ""; const q=lineQty(l); if(!(l.amount>0)||!(q>0)) return "";
        const per=l.amount/q; return Number(ing.pack_size)>0 ? `→ ${peso(per*ing.pack_size)} per pack (now ${peso(ing.pack_cost ?? (ing.cost_per_unit*ing.pack_size))})` : `→ ${peso4(per)} per ${ing.unit||"unit"} (now ${peso4(ing.cost_per_unit)})`; }
      hint.textContent=hintText(); costHint.textContent=costText();
      list.append(el("div",{class:"purchase-line"},
        el("div",{class:"purchase-top"}, sel, el("button",{class:"iconbtn",type:"button",title:"Remove",onclick:()=>{lines.splice(idx,1); draw();}},"✕")),
        el("div",{class:"purchase-mid"}, modeBtns, qtyIn, priceIn), hint, costRow));
    });
    list.append(el("button",{class:"btn btn-ghost btn-sm",type:"button",onclick:()=>{ lines.push({lid:newLid(), mode:null}); draw(); }}, lines.length?"+ Add another ingredient":"+ Add an ingredient"));
    updFoot();
  }
  function updFoot(){
    const sum=lines.reduce((a,l)=>a+(Number(l.amount)||0),0);
    foot.textContent = (sum>0?`Prices entered add up to ${peso(sum)}. `:"") + (old?"This expense is dated before stock tracking started, so quantities won't change; only the money does.":"Stock goes up as soon as you save.");
    if(opts.onSum) opts.onSum(sum);
  }
  wrap.append(el("h4",{class:"sub-h",style:"margin-top:14px"},"What did you buy?"), list, foot);
  draw();
  return {
    node: wrap,
    getItems: ()=> lines.filter(l=>l.ingredient_id).map(l=>{ const ing=ings.find(i=>i.id===l.ingredient_id);
      return { lid:l.lid||newLid(), ingredient_id:l.ingredient_id, name:ing?.name||l.name, unit:ing?.unit||l.unit, mode:l.mode,
        packs: l.mode==="packs" ? (Number(l.packs)||null) : null, qty: lineQty(l) || null,
        amount: Number(l.amount)>0 ? Math.round(Number(l.amount)*100)/100 : null, update_cost: Number(l.amount)>0 ? !!l.update_cost : null }; }),
    validate: ()=>{ for(const l of lines){ if(!l.ingredient_id && (l.packs||l.qty)) return "Choose the ingredient for each line"; if(l.ingredient_id && !(lineQty(l)>0)) return `Enter how much ${ings.find(i=>i.id===l.ingredient_id)?.name||"of it"} you bought`; } return null; }
  };
}

/* ============================================================
   ADD-ONS (one list for the menu; offered per category; can swap / add ingredients or scale the recipe)
   ============================================================ */
const PACKAGING_RX = /cup|lid|straw|sleeve|bag|napkin|stirrer/i;
function addonById(id){ return (State.data.addons||[]).find(a=>a.id===id); }
function addonsFor(item){
  const cat=item.category||"";
  return (State.data.addons||[]).filter(a=>a.active!==false && (a.categories||[]).includes(cat))
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||String(a.name).localeCompare(b.name));
}
function lineAddons(line){ return (line.addons||[]).map(addonById).filter(Boolean); }
function lineUnitPrice(line){ return (Number(line.item.price)||0) + lineAddons(line).reduce((a,x)=>a+(Number(x.price)||0),0); }
function cartToItems(){
  return Object.values(CART).map(c=>({ menu_id:c.item.id, name:c.item.name, price:lineUnitPrice(c), qty:c.qty,
    addons: lineAddons(c).map(a=>({id:a.id, name:a.name, price:Number(a.price)||0})) }));
}
function itemLabel(li){
  const extra = (li.addons&&li.addons.length) ? ` (${li.addons.map(a=>a.name).join(", ")})` : modsLabel(li.mods);
  return `${li.qty}× ${li.name}${extra}`;
}
function addonChips(k, redraw){
  const line=CART[k]; const list=addonsFor(line.item); if(!list.length) return null;
  const wrap=el("div",{class:"cline-addons"});
  list.forEach(a=>{
    const on=(line.addons||[]).includes(a.id);
    wrap.append(el("button",{class:"chip addon"+(on?" on":""),"aria-pressed":String(on),onclick:()=>{
      line.addons = on ? line.addons.filter(x=>x!==a.id) : [...(line.addons||[]), a.id]; redraw(); }},
      `${a.name}${Number(a.price)?` +₱${Number(a.price)}`:""}`));
  });
  return wrap;
}
// Recipe actually used for one sold line: swaps, then multiplier (not packaging), then extra ingredients.
function applyAddons(recipe, defs, m){
  let lines=(recipe||[]).map(r=>({ingredient_id:r.ingredient_id, qty:Number(r.qty)||0}));
  defs.forEach(d=>(d.swaps||[]).forEach(sw=>{ lines.forEach(l=>{ if(sw.from&&sw.to&&l.ingredient_id===sw.from) l.ingredient_id=sw.to; }); }));
  const mult=defs.reduce((a,d)=>a*(Number(d.multiplier)||1),1);
  if(mult!==1) lines.forEach(l=>{ const ing=m[l.ingredient_id]; if(!(ing&&PACKAGING_RX.test(ing.name||""))) l.qty*=mult; });
  defs.forEach(d=>(d.adds||[]).forEach(ad=>{ if(ad.ingredient_id&&Number(ad.qty)>0) lines.push({ingredient_id:ad.ingredient_id, qty:Number(ad.qty)}); }));
  return lines;
}
function recipeForLine(mi, li, m){
  m=m||ingMap();
  if(li.addons && li.addons.length) return applyAddons(mi.recipe, li.addons.map(a=>addonById(a.id)).filter(Boolean), m);
  return effectiveRecipe(mi, li.mods, m);
}
function costOfLines(lines, m){ return lines.reduce((a,r)=>{ const ing=m[r.ingredient_id]; return a+(ing?r.qty*(Number(ing.cost_per_unit)||0):0); },0); }
function cogsOfSaleLine(li,m){
  m=m||ingMap(); const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi) return 0;
  return costOfLines(recipeForLine(mi, li, m), m);
}
function computeSwapReport(sales){
  const m=ingMap(), rows={};
  const add=(name,count,extraCost,revenue)=>{ rows[name]=rows[name]||{name,count:0,extraCost:0,revenue:0};
    rows[name].count+=count; rows[name].extraCost+=extraCost; rows[name].revenue+=revenue; };
  sales.forEach(s=>(s.items||[]).forEach(li=>{
    const q=Number(li.qty)||1, mi=State.data.menu.find(x=>x.id===li.menu_id);
    (li.addons||[]).forEach(a=>{
      const d=addonById(a.id); let extra=0;
      if(mi&&d) extra=(costOfLines(applyAddons(mi.recipe,[d],m),m)-costOfLines(applyAddons(mi.recipe,[],m),m))*q;
      add(a.name,q,extra,(Number(a.price)||0)*q);
    });
    const md=li.mods; if(!md) return;
    if(md.milk&&md.milk!=="std") add("Sub Oat Milk (old)",q,0,(Number(md.milkPrice)||0)*q);
    if(md.upsize&&md.upsize!=="std") add("Upsize 16oz (old)",q,0,(Number(md.upsizePrice)||0)*q);
    if(md.cup&&md.cup!=="std") add("8oz Hot Cup (old)",q,0,(Number(md.cupPrice)||0)*q);
  }));
  return Object.values(rows);
}
function addonSummary(a){
  const m=ingMap(), nm=id=>m[id]?.name||"?", parts=[];
  (a.swaps||[]).filter(x=>x.from&&x.to).forEach(x=>parts.push(`${nm(x.from)} → ${nm(x.to)}`));
  if(a.multiplier&&Number(a.multiplier)!==1) parts.push(`recipe × ${Number(a.multiplier)}`);
  (a.adds||[]).filter(x=>x.ingredient_id).forEach(x=>parts.push(`+ ${x.qty} ${m[x.ingredient_id]?.unit||""} ${nm(x.ingredient_id)}`));
  return parts.join(" · ") || "Price only";
}
function menuCategories(){ return orderedCats([...new Set(State.data.menu.map(m=>m.category).filter(Boolean))]); }

function resumeParked(p){
  CART={};
  (p.items||[]).forEach((li,idx)=>{
    const mi=State.data.menu.find(m=>m.id===li.menu_id)||State.data.menu.find(m=>m.name===li.name)||{id:li.menu_id,name:li.name,price:li.price};
    const key=`${mi.id}_${Date.now()}_${idx}`;

  drawCart(); toast("Order resumed","ok");
}

/* ---------- Phone: tables become stacked cards (label on each value) ---------- */
function stackTables(root){
  if(!root) return;
  $$("table",root).forEach(t=>{
    const heads=[...t.querySelectorAll("thead th")].map(th=>th.textContent.replace(/[▲▼↑↓⇅]/g,"").trim());
    t.classList.add("stack");
    t.querySelectorAll("tbody tr, tfoot tr").forEach(tr=>{
      let i=0;
      [...tr.children].forEach(td=>{
        const span=Number(td.getAttribute("colspan"))||1;
        if(!td.hasAttribute("data-label")) td.setAttribute("data-label", span>1?"":(heads[i]||""));
        i+=span;
      });
    });
  });
}

/* ============================================================
   SHIFT ACCOUNTABILITY · SIGN-IN THAT SURVIVES A REFRESH · LIVE SYNC
   ============================================================ */
State.v = 0;   // database version (6 = shift tracking installed)
async function schemaInit(){ try{ State.v = Number(await rpc("rpc_schema_version")) || 0; }catch(_){ State.v = 0; } }

/* ---------- Business day: the day the shift started ---------- */
function saleDay(s){ return s.business_date || localISO(s.sold_at || s.created_at); }
function shiftDay(sh){ return sh.business_date || localISO(sh.time_in); }

/* ---------- Whose shift is the register on? ---------- */
function myOpenShift(){
  const u=State.currentUser||{}, open=(State.data.shifts||[]).filter(s=>!s.time_out);
  if(isOwner()) return open.sort((a,b)=>new Date(b.time_in)-new Date(a.time_in))[0]||null;   // one register: the open shift
  return open.find(s=>s.staff_id===u.id) || open.find(s=>s.name===u.name) || null;
}
function myLastShift(){
  const u=State.currentUser||{};
  const mine=(State.data.shifts||[]).filter(s=>isOwner()||s.staff_id===u.id||s.name===u.name).sort((a,b)=>new Date(b.time_in)-new Date(a.time_in));
  return mine[0]||null;
}
function shiftTag(){
  if(State.v<6) return {};
  const sh=myOpenShift();
  // Owner/admin can always sell: on the open staff shift if there is one (same cash drawer), otherwise as an owner sale
  if(!sh) return isOwner() ? { staff_name: State.currentUser.name } : null;
  return { shift_id:sh.id, staff_id: isOwner()?null:State.currentUser.id, staff_name: State.currentUser.name };
}
function salesOfShift(sh){
  const tin=new Date(sh.time_in), tout=sh.time_out?new Date(sh.time_out):new Date();
  return (State.data.sales||[]).filter(s=> s.shift_id ? s.shift_id===sh.id
    : (State.v<6 && (d=>d>=tin&&d<=tout)(new Date(s.sold_at||s.created_at))));
}
function expensesOfShift(sh){
  const tin=new Date(sh.time_in), tout=sh.time_out?new Date(sh.time_out):new Date();
  return (State.data.expenses||[]).filter(e=> e.shift_id ? e.shift_id===sh.id
    : (State.v<6 && (d=>d>=tin&&d<=tout)(new Date(e.created_at))));
}
// Opening cash: the previous shift's count that business day, else the day's float
function openingForShift(sh){
  const day=shiftDay(sh);
  const prev=(State.data.shifts||[]).filter(x=>x.id!==sh.id && shiftDay(x)===day && x.time_out && new Date(x.time_out)<=new Date(+new Date(sh.time_in)+3e5)
      && (x.counted_cash!=null||x.expected_cash!=null)).sort((a,b)=>new Date(b.time_out)-new Date(a.time_out))[0];
  if(prev) return {amount:Number(prev.counted_cash??prev.expected_cash), source:`Handed over from ${prev.name}`};
  const fl=(State.data.daily_floats||[]).find(f=>f.float_date===day);
  return fl ? {amount:Number(fl.amount??fl.amount_today??0), source:"Float for the day"} : {amount:0, source:"No float logged"};
}
const isCashSale = s => isActiveSale(s) && (s.payment_status||"paid")!=="unpaid" && ["cash","split"].includes((s.payment_method||"Cash").toLowerCase());
const isRegisterExpense = e => (e.status||"approved")!=="rejected" && ["business","cash"].includes((e.source||"Business").toLowerCase());
/* GCash cash-in / cash-out at the counter */
const liveSwap = x => (x.status||"completed")!=="cancelled";
function swapsOfShift(sh){ return (State.data.cash_swaps||[]).filter(x=>x.shift_id===sh.id && liveSwap(x)); }
const swapCashIn  = arr => arr.filter(x=>x.kind==="cash_in").reduce((a,x)=>a+Number(x.amount||0)+Number(x.fee||0),0);
const swapCashOut = arr => arr.filter(x=>x.kind==="cash_out").reduce((a,x)=>a+Number(x.amount||0),0);
function expectedCashForShift(sh){
  const op=openingForShift(sh);
  const sales=salesOfShift(sh).filter(isCashSale).reduce((a,s)=>a+cashPart(s),0);

function gcashFee(amount){
  const f=cfg().gcash_fee||{mode:"free"}, a=Number(amount)||0;
  if(!a || f.mode==="free" || !f.mode) return 0;
  let fee = f.mode==="percent" ? a*(Number(f.value)||0)/100 : (Number(f.value)||0);
  if(f.min && fee < Number(f.min)) fee=Number(f.min);
  return f.round===false ? Math.round(fee*100)/100 : Math.ceil(fee-1e-9);
}
function gcashFeeLabel(){
  const f=cfg().gcash_fee||{mode:"free"};
  return f.mode==="percent" ? `${f.value}%${f.round===false?"":", rounded up to the peso"}${f.min?` (min ₱${f.min})`:""}` : f.mode==="fixed" ? `₱${f.value} per transaction` : "Free";
}

/* ---------- Stay signed in after a refresh (until Switch User) ---------- */
const SESSION_KEY="mugna_session", SESSION_HOURS=12;
/* Owner view: a separate tab opened from a staff screen. Its sign-in lives only in that tab
   (sessionStorage), so the staff tab's sign-in and open shift are never touched. */
const PEEK_KEY="buhat_owner_view";
try{
  const m=/^#ownerview=(.+)$/.exec(location.hash||"");
  if(m){
    const s=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    sessionStorage.setItem(PEEK_KEY,"1");
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({...s, at:Date.now()}));
    history.replaceState(null,"",location.pathname+location.search);
  }
  State.peek = sessionStorage.getItem(PEEK_KEY)==="1";
}catch(_){ State.peek=false; }
const sessStore=()=> State.peek ? sessionStorage : localStorage;
function saveSession(){
  try{
    if(!State.currentUser) return;
    sessStore().setItem(SESSION_KEY, JSON.stringify({ user:State.currentUser, token:State.acct.token, role:State.acct.role,
      ownerToken:State.acct.ownerToken, unlocked:!!State.unlocked, section:State.section, cafe:BUHAT.cafe, at:Date.now() }));
  }catch(_){}
}
function clearSession(){ try{ sessStore().removeItem(SESSION_KEY); }catch(_){} }
async function restoreSession(){
  let s=null; try{ s=JSON.parse(sessStore().getItem(SESSION_KEY)||"null"); }catch(_){}
  if(!s||!s.user) return false;
  if(Date.now()-(s.at||0) > SESSION_HOURS*3600e3){ clearSession(); return false; }
  if(State.v>=10){
    if(!s.token){ clearSession(); return false; }
    let w=null; try{ w=await rpc("rpc_whoami",{p_token:s.token}); }catch(_){}
    if(!w||!w.ok){ clearSession(); return false; }
    if(BUHAT.deviceInfo && w.cafe_id!==BUHAT.deviceInfo.cafe.id){ clearSession(); return false; }
    BUHAT.cafe = (s.cafe && s.cafe.id===w.cafe_id) ? s.cafe : (BUHAT.cafe && BUHAT.cafe.id===w.cafe_id ? BUHAT.cafe : {id:w.cafe_id, name:""});
    State.acct.token=s.token;
    try{ await loadAll(); }catch(_){}
  } else if(State.acct.installed && s.token){
    try{ const w=await rpc("rpc_whoami",{p_token:s.token}); if(!w||!w.ok){ clearSession(); return false; } }
    catch(_){ /* rpc_whoami not installed yet: trust the saved session until it expires */ }
  }
  let user=s.user;
  if(user.role!=="owner"){ const row=(State.data.staff_roster||[]).find(r=>r.id===user.id); if(!row){ clearSession(); return false; } user={...user,...row, role:user.role||"staff"}; }
  State.currentUser=user; State.unlocked=!!s.unlocked;
  State.acct.token=s.token||null; State.acct.role=s.role||null; State.acct.ownerToken=s.ownerToken||null;
  State.restoreSection=s.section||null;
  await enterApp();
  return true;
}

function saleCost(s,m){ if(s.cogs_amount!=null) return Number(s.cogs_amount)||0; return (s.items||[]).reduce((b,li)=>b+cogsOfSaleLine(li,m)*(Number(li.qty)||1),0); }

// the figures for one stretch of time
function healthFigures(a,b){
  const m=ingMap();
  const sales=(State.data.sales||[]).filter(s=>isActiveSale(s)&&inSpan(saleDay(s),a,b));
  const S=sales.reduce((x,s)=>x+saleNet(s),0), C=sales.reduce((x,s)=>x+saleCost(s,m),0);
  const exps=(State.data.expenses||[]).filter(e=>approvedExpense(e)&&inSpan(dayKey(e.spent_at||e.created_at),a,b));
  const running=exps.filter(e=>!isStockCategory(e.category)&&!isOneTimeExp(e)&&!isStaffExp(e));
  const R=running.reduce((x,e)=>x+Number(e.amount||0),0);
  const byCat={}; running.forEach(e=>{ const k=e.category||"Other"; byCat[k]=(byCat[k]||0)+Number(e.amount||0); });
  const runs=(State.data.payroll_runs||[]).filter(r=>(r.status||"")!=="draft"&&inSpan(payrollDate(r),a,b));
  const staffExp=exps.filter(isStaffExp).reduce((x,e)=>x+Number(e.amount||0),0);
  const W=runs.length ? runs.reduce((x,r)=>x+Number(r.gross_pay??r.net_pay??0),0) : staffExp;
  return {S,C,R,W,byCat,orders:sales.length,profit:S-C-R-W};
}
function monthStart(off){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth()+off, 1); }
// typical monthly running costs: the Opex plan if set, else the last 3 full months
function monthlyFixedCosts(){
  const plan=opexPlan(); const pm=plan.items.reduce((a,i)=>a+opexMonthly(i),0);
  if(pm>0) return {amount:pm, from:"your Opex plan"};
  let tot=0, n=0;
  for(let k=1;k<=3;k++){ const f=healthFigures(monthStart(-k),monthStart(-k+1)); if(f.S||f.R||f.W){ tot+=f.R+f.W; n++; } }
  if(n) return {amount:tot/n, from:`your average of the last ${n} month${n>1?"s":""}`};
  const f=healthFigures(monthStart(0),new Date()); return {amount:f.R+f.W, from:"this month so far"};

const OPEX_EVERY=[["week","Every week",52/12],["month","Every month",1],["quarter","Every 3 months",1/3],["year","Once a year",1/12]];

// suggestions from the last 3 full months of approved non-stock, non-one-time expenses, plus payroll
function opexSuggestions(){
  const out={}; let months=0;
  for(let k=1;k<=3;k++){
    const a=monthStart(-k), b=monthStart(-k+1);
    const exps=(State.data.expenses||[]).filter(e=>approvedExpense(e)&&inSpan(dayKey(e.spent_at||e.created_at),a,b)&&!isStockCategory(e.category)&&!isOneTimeExp(e));
    const runs=(State.data.payroll_runs||[]).filter(r=>(r.status||"")!=="draft"&&inSpan(payrollDate(r),a,b));
    if(exps.length||runs.length) months++;
    exps.forEach(e=>{ const k2=e.category||"Other"; out[k2]=(out[k2]||0)+Number(e.amount||0); });
    if(runs.length) out["Staff salaries"]=(out["Staff salaries"]||0)+runs.reduce((x,r)=>x+Number(r.gross_pay??r.net_pay??0),0);
  }
  return {months, items:Object.entries(out).map(([name,tot])=>({name, amount:Math.round(tot/Math.max(months,1)), every:"month"})).sort((x,y)=>y.amount-x.amount)};
}
function nextDue(i, from){
  const f=new Date(from||new Date()); f.setHours(0,0,0,0);
  const day=Math.min(Math.max(Number(i.due_day)||1,1),28);
  if((i.every||"month")==="week"){ const d=new Date(f); const want=Number(i.due_weekday??0); while(d.getDay()!==want) d.setDate(d.getDate()+1); return d; }
  if(i.every==="year"){ const mo=Math.max(0,Math.min(11,(Number(i.due_month)||1)-1)); let d=new Date(f.getFullYear(),mo,day); if(d<f) d=new Date(f.getFullYear()+1,mo,day); return d; }
  if(i.every==="quarter"){ const start=Math.max(0,Math.min(11,(Number(i.due_month)||1)-1)); for(let k=0;k<15;k++){ const mo=f.getMonth()+k; if(((mo-start)%3+3)%3) continue; const d=new Date(f.getFullYear(),mo,day); if(d>=f) return d; } }
  let d=new Date(f.getFullYear(),f.getMonth(),day); if(d<f) d=new Date(f.getFullYear(),f.getMonth()+1,day); return d;
}

const advLive = a => (a.status||"completed")==="completed";
function partnerCash(pid){
  const adv=(State.data.cash_advances||[]).filter(a=>advLive(a)&&a.partner_id===pid);
  const out=adv.filter(a=>a.kind==="out").reduce((x,a)=>x+Number(a.amount||0),0);
  const back=adv.filter(a=>a.kind==="return").reduce((x,a)=>x+Number(a.amount||0),0);
  const kept=adv.filter(a=>a.kind==="withdraw").reduce((x,a)=>x+Number(a.amount||0),0);
  const spent=(State.data.expenses||[]).filter(e=>e.source==="Advance"&&e.partner_id===pid&&(e.status||"approved")!=="rejected").reduce((x,e)=>x+Number(e.amount||0),0);
  return {out,back,kept,spent,held:Math.round((out-back-kept-spent)*100)/100};
}

/* ============================================================
   v15 · TIMELINES ON REPORTS: view by day / week / month / year / hour / weekday, compare periods
   ============================================================ */
const TL_BY=[["day","By day"],["week","By week"],["month","By month"],["year","By year"],["hour","By time of day"],["weekday","By day of the week"]];
const TL_CMP=[["none","No comparison"],["prev","vs previous period"],["year","vs same time last year"]];
const TL=(()=>{ try{ return {by:"day",compare:"none",...JSON.parse(localStorage.getItem("buhat_timeline")||"{}")}; }catch(_){ return {by:"day",compare:"none"}; } })();
function saveTL(){ try{ localStorage.setItem("buhat_timeline",JSON.stringify(TL)); }catch(_){} }
function timelineControl(onChange){
  const by=el("select",{class:"input",style:"width:auto;font-size:13px","aria-label":"View sales by",onchange:e=>{TL.by=e.target.value; saveTL(); onChange();}},
    ...TL_BY.map(([v,l])=>el("option",{value:v,selected:TL.by===v},l)));
  const cmp=el("select",{class:"input",style:"width:auto;font-size:13px","aria-label":"Compare with",onchange:e=>{TL.compare=e.target.value; saveTL(); onChange();}},
    ...TL_CMP.map(([v,l])=>el("option",{value:v,selected:TL.compare===v},l)));
  return el("div",{class:"kbar tl-bar"}, el("span",{class:"muted",style:"font-size:13px"},"View"), by, cmp);
}
const DAY=864e5;
const toDate = v => !v ? null : (/^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+"T12:00:00") : new Date(v));
function spanOf(st, rows, dateFn){
  let [a,b]=periodBounds(st);
  if(!a||!b){ const ds=(rows||[]).map(r=>toDate(dateFn(r))).filter(Boolean); if(!ds.length) return [null,null];
    a=new Date(Math.min(...ds)); a.setHours(0,0,0,0); b=new Date(Math.max(...ds)); b.setHours(0,0,0,0); b=new Date(+b+DAY); }
  return [a,b];
}
// the comparison stretch for [a,b)
function compareSpan(st,a,b,kind){
  if(!a||!b||kind==="none") return null;
  const shiftY=(d,n)=>{ const x=new Date(d); x.setFullYear(x.getFullYear()+n); return x; };
  if(kind==="year") return [shiftY(a,-1), shiftY(b,-1), "same time last year"];
  if(st.mode==="month"){ const pa=new Date(a.getFullYear(),a.getMonth()-1,1); const days=Math.round((b-a)/DAY);
    const pe=new Date(pa.getFullYear(),pa.getMonth()+1,1); return [pa, new Date(Math.min(+pa+days*DAY, +pe)), "same days last month"]; }
  if(st.mode==="lastmonth"){ return [new Date(a.getFullYear(),a.getMonth()-1,1), a, "the month before"]; }
  if(st.mode==="week") return [new Date(+a-7*DAY), new Date(+b-7*DAY), "same days last week"];
  if(st.mode==="today") return [new Date(+a-DAY), new Date(+b-DAY), "yesterday"];
  if(st.mode==="yesterday") return [new Date(+a-DAY), new Date(+b-DAY), "the day before"];
  const len=b-a; return [new Date(+a-len), a, "the previous period"];
}
const inSpanD = (d,a,b) => d && (!a||d>=a) && (!b||d<b);
function bucketKey(d, by){
  if(by==="day") return localISO(d);
  if(by==="week") return localISO(weekStart(d));
  if(by==="month") return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  if(by==="year") return String(d.getFullYear());
  if(by==="hour") return String(d.getHours());
  if(by==="weekday") return String((d.getDay()+6)%7);   // Mon=0 … Sun=6
}
function bucketList(a,b,by){
  if(by==="hour") return [...Array(24)].map((_,h)=>String(h));
  if(by==="weekday") return ["0","1","2","3","4","5","6"];
  const out=[], seen=new Set(); let d=new Date(a); const step=by==="day"?1:by==="week"?7:1;
  for(let i=0;i<4000&&d<b;i++){ const k=bucketKey(d,by); if(!seen.has(k)){ seen.add(k); out.push(k); }
    if(by==="day"||by==="week") d=new Date(+d+step*DAY); else if(by==="month") d=new Date(d.getFullYear(),d.getMonth()+1,1); else d=new Date(d.getFullYear()+1,0,1); }
  return out;
}
function bucketLabel(k,by){
  if(by==="day") return new Date(k+"T12:00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric"});
  if(by==="week") return "Wk of "+new Date(k+"T12:00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric"});
  if(by==="month") return new Date(k+"-01T12:00:00").toLocaleDateString("en-PH",{month:"short",year:"numeric"});
  if(by==="year") return k;
  if(by==="hour"){ const h=Number(k); return `${(h%12)||12}${h<12?"am":"pm"}`; }
  if(by==="weekday") return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][Number(k)];
}
// how many days of each weekday (or days in total) fall in [a,b) — for averages
function dayCounts(a,b){ const wd=[0,0,0,0,0,0,0]; let n=0; for(let d=new Date(a); d<b && n<4000; d=new Date(+d+DAY)){ wd[(d.getDay()+6)%7]++; n++; } return {wd, n:Math.max(n,1)}; }
/* Group rows into the chosen timeline.
   tsFn: full timestamp (used for time of day); dayFn: business day (used for everything else). */
function timelineGroup(rows, dayFn, tsFn, valFn, a, b, by){
  const keys=bucketList(a,b,by), m={}; keys.forEach(k=>m[k]=0);
  rows.forEach(r=>{ const d = by==="hour" ? (tsFn?toDate(tsFn(r)):null) : toDate(dayFn(r)); if(!d) return; const k=bucketKey(d,by); if(k in m) m[k]+=valFn(r); });
  let data=keys.map(k=>m[k]);
  if(by==="weekday"){ const c=dayCounts(a,b); data=data.map((v,i)=>c.wd[i]?v/c.wd[i]:0); }
  if(by==="hour"){ const c=dayCounts(a,b); data=data.map(v=>v/c.n); }
  // trim empty hours at the edges (the café isn't open at 3am)
  let lo=0, hi=keys.length-1;
  if(by==="hour"){ while(lo<hi&&!data[lo]) lo++; while(hi>lo&&!data[hi]) hi--; }
  return {keys:keys.slice(lo,hi+1), data:data.slice(lo,hi+1), all:data};
}
/* Build a chart spec for the reports.
   parts: [{label, rows, dayFn, tsFn, valFn, color, kind, noHour}] (first part is the one compared) */
function timelineSpec(st, parts){
  const allRows=parts.flatMap(p=>p.rows);
  const [a,b]=spanOf(st, parts[0].rowsAll||allRows, parts[0].dayFn);
  if(!a) return {labels:[],series:[],note:""};
  const by=TL.by;
  const g=parts.map(p=>(by==="hour"&&p.noHour)?null:timelineGroup(p.rows,p.dayFn,p.tsFn,p.valFn,a,b,by));
  const ref=g.find(Boolean); if(!ref) return {labels:[],series:[],note:"Expenses don't have a time of day."};
  let keys=ref.keys;
  if(by==="hour"){ // keep the same hour window across all series
    const idx=k=>bucketList(a,b,"hour").indexOf(k); const lo=Math.min(...g.filter(Boolean).map(x=>idx(x.keys[0]))), hi=Math.max(...g.filter(Boolean).map(x=>idx(x.keys[x.keys.length-1])));
    keys=bucketList(a,b,"hour").slice(lo,hi+1); g.forEach((x,i)=>{ if(x) x.data=keys.map(k=>x.all[Number(k)]); }); }
  const series=parts.map((p,i)=>g[i]?{label:p.label,data:g[i].data,color:p.color,kind:p.kind,derived:p.derived}:null).filter(Boolean);
  let note = by==="weekday"?"Average per day of the week in this period.": by==="hour"?"Average per day, by the hour the sale was rung up.":"";
  const cs=compareSpan(st,a,b,TL.compare);
  if(cs){
    const p=parts[0], src=p.rowsAll||p.rows;
    const prevRows=src.filter(r=>inSpanD(toDate(p.dayFn(r)),cs[0],cs[1]));
    const pg=timelineGroup(prevRows,p.dayFn,p.tsFn,p.valFn,cs[0],cs[1],by);
    let pd;
    if(by==="hour") pd=keys.map(k=>pg.all[Number(k)]);
    else if(by==="weekday") pd=pg.data;
    else pd=keys.map((_,i)=>pg.data[i]??0);    // line up 1st with 1st, 2nd with 2nd…
    series.splice(1,0,{label:`${p.label} · ${cs[2]}`,data:pd,color:"#9aa3ad",kind:"line",dash:true,derived:true});
    const now=series[0].data.reduce((x,y)=>x+y,0), was=pd.reduce((x,y)=>x+y,0);
    if(was>0) note=(note?note+" ":"")+`${p.label}: ${now>=was?"▲":"▼"} ${pct(Math.abs(now-was)/was*100)} vs ${cs[2]} (${peso(was)} → ${peso(now)}).`;
  }
  return {labels:keys.map(k=>bucketLabel(k,by)), labelName:TL_BY.find(x=>x[0]===by)[1].replace("By ",""), series, note};
}
// "▲ 12% vs same days last month" for a KPI
function timelineDelta(st, rows, dayFn, valFn){
  if(TL.compare==="none") return "";
  const [a,b]=spanOf(st, rows, dayFn); const cs=compareSpan(st,a,b,TL.compare); if(!cs) return "";
  const now=rows.filter(r=>inSpanD(toDate(dayFn(r)),a,b)).reduce((x,r)=>x+valFn(r),0);
  const was=rows.filter(r=>inSpanD(toDate(dayFn(r)),cs[0],cs[1])).reduce((x,r)=>x+valFn(r),0);
  if(!was) return `nothing ${cs[2]} to compare`;
  return `${now>=was?"▲":"▼"} ${pct(Math.abs(now-was)/was*100)} vs ${cs[2]}`;
}
function timelineChart(title,id,spec,def){
  const card=reportChart(title,id,spec,def);
  if(spec.note) card.append(el("p",{class:"help",style:"margin:8px 0 0"},spec.note));
  return card;
}

async function copyLastWeek(){

    for(const s of prev.staff){ for(const dd of s.days){

const isFree = () => !!(State.plan && State.plan.tier==="free");
const featureOf = id => PLAN_FEATURES.find(f=>f.sections.includes(id));
function featureLocked(key){ return isFree() && ((State.plan.features||{})[key]||"free")==="pro"; }

function histCutoff(t){
  if(!isFree() || !State.plan.history_days || !HIST_TABLES.includes(t)) return null;
  return new Date(Date.now()-State.plan.history_days*864e5).toISOString();
}
// reads every row (Supabase sends at most 1000 per request), oldest rows cut off on the Free plan
async function fetchTable(t){
  const cut=histCutoff(t), out=[], PAGE=1000;
  for(let from=0; from<200000; from+=PAGE){
    let q=scoped(sb.from(t).select("*")); if(cut) q=q.gte("created_at",cut);
    const {data,error}=await q.order("created_at",{ascending:false}).order("id",{ascending:true}).range(from, from+PAGE-1);
    if(error) return {data:null,error};
    out.push(...(data||[])); if(!data || data.length<PAGE) break;
  }
  return {data:out,error:null};
}

  const ads=(State.plan&&State.plan.ads)||[]; if(!ads.length) return null;

  const tot=ads.reduce((a,x)=>a+(x.weight||1),0); let r=Math.random()*tot;

function softRerender(){
  const busy = $(".modal-back") || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.closest("#screen"));
  if(State.section==="pos"){ drawSalesTable(); drawReminder(); drawShiftBar(); return; }

    const y=window.scrollY; go(State.section); window.scrollTo(0,y);
  }
}

/* ============================================================
   SIGN-IN (v10: buhat multi-café)
   Order on load:
     1. Database older than v10  → the old Mugnâ login (unchanged)
     2. Saved session still valid → straight back in
     3. Device linked to a café  → that café's staff list
     4. Owner already logged in   → owner's café
     5. Otherwise                 → buhat Log in / Create account
   ============================================================ */
function hideAllViews(){
  ["#authView","#buhatView","#loadingView"].forEach(s=>$(s)&&$(s).classList.add("hide"));
  $("#appView").style.display="none";
}

async function boot(){
  if(!CONFIGURED){
    $("#loadingView").classList.add("hide");
    $("#cfgWarn").classList.remove("hide");
    $("#cfgWarn").innerHTML="⚙️ Not connected. Please check Supabase credentials.";
    return;
  }
  try{ await Promise.all([acctInit(), schemaInit()]); }catch(_){}
  if(State.v < 10) return legacyBoot();

  if(BUHAT.device) await openDevice();
  if(BUHAT.paused) return showPaused();
  if(await restoreSession()) return;
  if(State.peek) return ownerViewEnded("This owner view has expired.");
  if(BUHAT.deviceInfo) return showStaffList();
  let sess=null; try{ ({data:{session:sess}} = await sb.auth.getSession()); }catch(_){}
  if(sess && await afterOwnerLogin()) return;
  showBuhatLogin();
}

// Database not upgraded yet: behave exactly like before
async function legacyBoot(){
  $("#loadingView").classList.add("hide");
  $("#authView").classList.remove("hide");
  try { await loadAll(); } catch(_) {}
  renderUserSelection();
  restoreSession();
}

async function openDevice(){
  try{
    const d=await rpc("rpc_device_open",{p_device:BUHAT.device});
    if(d && d.ok){ BUHAT.deviceInfo=d; BUHAT.cafe={id:d.cafe.id, name:d.cafe.name, logo_url:d.cafe.logo_url||""}; return true; }
    if(d && d.paused){ BUHAT.paused={name:d.cafe_name, msg:d.error}; return false; }
    forgetDevice();
  }catch(_){ /* offline: keep the token and try again next time */ }
  return false;
}
function forgetDevice(){
  try{ localStorage.removeItem(DEVICE_KEY); }catch(_){}
  BUHAT.device=null; BUHAT.deviceInfo=null;
}

async function bhLogin(e){
  e.preventDefault();
  const b=$("#bhLoginBtn"), err=$("#bhLoginErr"); err.textContent="";
  const email=$("#bhEmail").value.trim(), password=$("#bhPass").value;
  if(!email||!password){ err.textContent="Enter your email and password."; return; }
  b.disabled=true; b.textContent="Logging in…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  b.disabled=false; b.textContent="Log in";
  if(error){ err.textContent = /invalid/i.test(error.message) ? "That email and password don't match." : error.message; return; }
  $("#bhPass").value="";
  if(!(await afterOwnerLogin())) err.textContent="Couldn't open your café. Please try again.";
}
