  e.preventDefault();
  const b=$("#bhSignupBtn"), err=$("#bhSignupErr"); err.textContent="";
  const cafe=$("#bhCafe").value.trim(), email=$("#bhSEmail").value.trim(), password=$("#bhSPass").value, code=$("#bhCode").value.trim();
  if(!cafe) return err.textContent="Give your café a name.";
  if(!code) return err.textContent="Enter your invite code.";
  if(password.length<8) return err.textContent="Use a password of at least 8 characters.";
  const reset=()=>{ b.disabled=false; b.textContent="Create account"; };
  b.disabled=true; b.textContent="Checking code…";
  try{
    const chk=await rpc("rpc_check_invite",{p_code:code});
    if(!chk||!chk.ok){ reset(); return err.textContent="That invite code isn't valid or has been used up. Check it, or ask buhat for a new one."; }
  }catch(ex){ reset(); return err.textContent=ex.message; }
  b.textContent="Creating…";
  try{ localStorage.setItem("buhat_pending_signup", JSON.stringify({cafe,code})); }catch(_){}
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname, data:{cafe_name:cafe}}});
  reset();
  if(error) return err.textContent=error.message;
  if(!data.session){
    return showBhMessage("Check your email", `We sent a link to ${email}. Open it to confirm your account, then log in here.`,
      [el("button",{class:"bh-btn ghost",type:"button",onclick:()=>showBuhatLogin()},"Back to log in")]);
  }
  await createCafeFlow(cafe, code);
}

async function createCafeFlow(name, code){
  try{
    const r=await rpc("rpc_create_cafe",{p_name:name, p_code:code||null});
    if(r && r.ok){ try{ localStorage.removeItem("buhat_pending_signup"); }catch(_){} return afterOwnerLogin(); }
    if(r && r.closed) return showNoCafe({}, r.error);
    return showBhMessage("Not yet", (r&&r.error)||"The café could not be created.",
      [el("button",{class:"bh-btn ghost",type:"button",onclick:bhSignOut},"Sign out")]);
  }catch(ex){
    showBhMessage("Not yet", ex.message, [el("button",{class:"bh-btn ghost",type:"button",onclick:bhSignOut},"Sign out")]);
  }
}

function showPaused(){
  const p=BUHAT.paused||{};
  hideAllViews(); $("#loadingView").classList.add("hide"); $("#buhatView").classList.remove("hide");
  const acts=[el("button",{class:"bh-btn",type:"button",onclick:()=>location.reload()},"Try again")];
  if(BUHAT.authUser) acts.push(el("div",{class:"bh-row",style:"justify-content:center"}, el("button",{class:"bh-link",type:"button",onclick:bhSignOut},"Sign out")));
  showBhMessage(`${p.name||"This café"} is paused`, p.msg||"This café's buhat account is paused. Please message buhat to turn it back on.", acts);
}

function showNoCafe(me, notice){
  let pend={}; try{ pend=JSON.parse(localStorage.getItem("buhat_pending_signup")||"{}")||{}; }catch(_){}
  const nm=el("input",{class:"bh-in",placeholder:"e.g. Kape Uno",value:pend.cafe||""});
  const cd=el("input",{class:"bh-in",placeholder:"e.g. 7F3A-91C2-B04E",value:pend.code||"",autocapitalize:"characters",autocomplete:"off"});
  hideAllViews(); $("#buhatView").classList.remove("hide");
  showBhMessage("Your account is ready", notice || `Signed in as ${me.email||"you"}. This login isn't linked to a café yet. Enter your café name and invite code to set it up.`, [
    el("label",{}, el("span",{},"Café name"), nm),
    el("label",{}, el("span",{},"Invite code"), cd),
    el("button",{class:"bh-btn",type:"button",onclick:()=>{
      if(!nm.value.trim()) return toast("Give your café a name","bad");
      if(!cd.value.trim()) return toast("Enter your invite code","bad");
      createCafeFlow(nm.value.trim(), cd.value.trim()); }},"Set up my café"),
    el("div",{class:"bh-row",style:"justify-content:center"}, el("button",{class:"bh-link",type:"button",onclick:bhSignOut},"Sign out"))]);
}

// Owner logged in by email → their café, with an owner session for the books and settings
async function afterOwnerLogin(){
  let me=null;
  try{ me=await rpc("rpc_buhat_me"); }catch(ex){ showBuhatLogin(ex.message); return false; }
  if(!me || !me.ok) return false;
  BUHAT.authUser={id:me.user_id, email:me.email};
  if(!me.cafes.length && me.paused && me.paused.length){ BUHAT.paused={name:me.paused[0].name, msg:me.paused_msg}; showPaused(); return true; }
  if(!me.cafes.length){ showNoCafe(me); return true; }
  let cafe=me.cafes[0];
  if(BUHAT.deviceInfo){
    const m=me.cafes.find(c=>c.id===BUHAT.deviceInfo.cafe.id);
    if(!m){ showBuhatLogin("This login isn't an owner of the café this device is linked to."); try{ await sb.auth.signOut({scope:"local"}); }catch(_){} return true; }
    cafe=m;
  }
  let s;
  try{ s=await rpc("rpc_owner_session",{p_cafe:cafe.id}); }catch(ex){ showBuhatLogin(ex.message); return false; }
  BUHAT.cafe={id:cafe.id, name:cafe.name};
  State.currentUser={id:"owner_main", name:"Owner", role:"owner", email:me.email};
  State.unlocked=true; State.acct.token=s.token; State.acct.role="owner"; State.acct.ownerToken=s.token;
  await enterApp();
  if(!BUHAT.device) offerLinkDevice();
  return true;
}

/* ---------- "Use this device for staff" ---------- */
function guessDeviceName(){
  const ua=navigator.userAgent||"";
  if(/iPad|Tablet|SM-T|Tab/i.test(ua)) return "Counter tablet";
  if(/Android|iPhone/i.test(ua)) return "Phone";
  return "Counter computer";
}
function offerLinkDevice(){
  try{ if(sessionStorage.getItem("buhat_link_asked")) return; sessionStorage.setItem("buhat_link_asked","1"); }catch(_){}
  linkDeviceModal();
}
function linkDeviceModal(){
  const nameIn=el("input",{class:"input",value:guessDeviceName(),placeholder:"e.g. Counter tablet"});
  const needPin = State.v>=17 && !State.acct.owner_pin_set;
  const pi = needPin ? ownerPinInputs() : null;
  openModal({title:"Use this device for staff?", body:el("div",{},
      el("p",{class:"muted",style:"margin-top:0"},`Linking this device means it opens to ${BUHAT.cafe?.name||"your café"}'s staff list. Staff tap their name and enter their PIN. Your email login is then signed out of this device, so staff can't reach it.`),
      field("Name this device", nameIn, "Shown in My Account, where you can unlink it any time."),
      needPin ? el("div",{class:"notice",style:"margin:6px 0 10px"},"Create your owner PIN too. After linking, you open the owner screens on this device by tapping “Owner / Mgmt” and entering it.") : null,
      needPin ? pi.row : null),
    footer:bk=>[el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Not now"),
      el("button",{class:"btn btn-brass",onclick:async ev=>{
        let pin=null; if(needPin){ pin=pi.check(); if(!pin) return; }
        ev.target.disabled=true;
        if(pin && !(await saveFirstOwnerPin(pin))){ ev.target.disabled=false; return; }
        const ok=await linkThisDevice(nameIn.value.trim()); if(ok) bk.remove(); else ev.target.disabled=false; }},"Use this device for staff")]});
}
async function linkThisDevice(name){
  if(!BUHAT.authUser||!BUHAT.cafe){ toast("Log in with your email first","bad"); return false; }
  try{
    const r=await rpc("rpc_link_device",{p_cafe:BUHAT.cafe.id, p_name:name||guessDeviceName()});
    try{ localStorage.setItem(DEVICE_KEY, r.device_token); }catch(_){}
    BUHAT.device=r.device_token;
    await openDevice();
    try{ await sb.auth.signOut({scope:"local"}); }catch(_){}
    BUHAT.authUser=null;
    saveSession(); updateSwitchLabel();
    toast("This device is linked. Tap Switch User to show the staff list.","ok");
    if(State.section==="account") go("account");
    return true;
  }catch(ex){ toast(ex.message,"bad"); return false; }
}

// My Account: this device, linked devices, password
function renderDeviceAccount(){
  const wrap=el("div",{class:"card setup",style:"margin-top:16px"});
  wrap.append(el("h3",{},"This device"));
  if(BUHAT.deviceInfo){
    wrap.append(el("p",{class:"muted"},`Linked to ${BUHAT.deviceInfo.cafe.name}${BUHAT.deviceInfo.device_name?` as “${BUHAT.deviceInfo.device_name}”`:""}. It opens to the staff list.`));
    if(isOwner()) wrap.append(el("button",{class:"btn btn-danger",onclick:()=>{
      openModal({title:"Sign out of this device?", body:el("p",{class:"muted"},"This device will stop opening to the staff list. To use it for staff again, log in with your email here and link it."),
        footer:bk=>[el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Cancel"),
          el("button",{class:"btn btn-danger",onclick:async()=>{ bk.remove();
            try{ await rpc("rpc_unlink_device",{p_device:BUHAT.device}); }catch(_){}
            forgetDevice(); clearSession(); await acctLogoutAll(); State.unlocked=false; State.currentUser=null; State.section=null;
            try{ await sb.auth.signOut({scope:"local"}); }catch(_){}
            showBuhatLogin(); }},"Sign out of this device")]});
    }},"Sign out of this device"));
  } else if(isOwner() && BUHAT.authUser){
    wrap.append(el("p",{class:"muted"},"Not linked. Link it if staff will use this tablet or phone at the counter."),
      el("button",{class:"btn btn-brass",onclick:linkDeviceModal},"Use this device for staff"));
  } else {
    wrap.append(el("p",{class:"muted"},"Not linked to a café."));
  }

  if(isOwner() && ownerTok()){
    const list=el("div",{}, el("div",{class:"muted"},"Loading…"));
    wrap.append(el("div",{class:"tear",style:"margin:14px 0"}), el("h3",{},"Linked devices"), list);
    rpc("rpc_list_devices",{p_token:ownerTok()}).then(rows=>{
      list.innerHTML="";
      if(!rows.length) return list.append(el("div",{class:"muted"},"No devices linked yet."));
      rows.forEach(d=>list.append(el("div",{class:"device-card"},
        el("div",{}, el("strong",{},d.name||"Device"), el("div",{class:"muted",style:"font-size:12.5px"},
          `Linked ${fmtDate(d.created_at)}${d.last_seen?` · last used ${new Date(d.last_seen).toLocaleString("en-PH",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`:""}`)),
        BUHAT.deviceInfo&&BUHAT.deviceInfo.device_id===d.id ? el("span",{class:"tag cash"},"This device")
          : el("button",{class:"btn btn-ghost btn-sm",onclick:async()=>{ if(!confirm(`Unlink ${d.name||"this device"}? It will stop opening to the staff list.`)) return;
              try{ await rpc("rpc_revoke_device",{p_token:ownerTok(),p_id:d.id}); toast("Device unlinked","ok"); go("account"); }catch(e){ toast(e.message,"bad"); } }},"Unlink"))));
    }).catch(e=>{ list.innerHTML=""; list.append(el("div",{class:"muted"},e.message)); });
  }

  if(isOwner() && BUHAT.authUser){
    const p1=el("input",{class:"input",type:"password",autocomplete:"new-password"}), p2=el("input",{class:"input",type:"password",autocomplete:"new-password"});
    wrap.append(el("div",{class:"tear",style:"margin:14px 0"}), el("h3",{},"Login password"),
      el("p",{class:"muted",style:"margin-top:0"},`For ${BUHAT.authUser.email||"your email login"}.`),
      el("div",{class:"form-row"}, field("New password",p1), field("Repeat new password",p2)),
      el("div",{style:"text-align:right;margin-top:12px"}, el("button",{class:"btn btn-brass",onclick:async()=>{
        if(p1.value.length<8) return toast("Use at least 8 characters","bad");
        if(p1.value!==p2.value) return toast("The passwords don't match","bad");
        const {error}=await sb.auth.updateUser({password:p1.value});
        if(error) return toast(error.message,"bad");
        p1.value=p2.value=""; toast("Password changed","ok");
      }},"Change password")));
  }
  return wrap;
}

function updateSwitchLabel(){
  const b=$("#switchUserBtn"); if(!b) return;
  b.textContent = State.peek ? "Close owner view" : (State.v>=10 && !BUHAT.device) ? "Sign out" : "Switch User";
  document.body.classList.toggle("is-peek", !!State.peek);
  let bar=$("#peekBar");
  if(State.peek && !bar){
    bar=el("div",{id:"peekBar",class:"peek-bar",role:"status"},
      el("span",{},"👁 Owner view · separate tab. The staff screen is still open in the other tab."),
      el("button",{class:"btn btn-sm",onclick:closeOwnerView},"Close owner view"));
    $("#appView").prepend(bar);
  }
}
function canOwnerView(){
  return !State.peek && State.v>=10 && serverPins() && State.currentUser && State.currentUser.role!=="owner"
    && (!BUHAT.deviceInfo || BUHAT.deviceInfo.owner_pin_set!==false);
}
function openOwnerView(){
  promptPIN(tok=>{
    if(!tok) return toast("Owner view needs the owner PIN set up in Settings","bad");
    const owner=getActiveProfiles().find(u=>u.role==="owner")||{id:"owner_main",name:"Owner / Mgmt",role:"owner"};
    const s={user:owner, token:tok, role:"owner", ownerToken:tok, unlocked:true, section:null, cafe:BUHAT.cafe};
    const url=location.pathname+location.search+"#ownerview="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(s)))));
    let w=null; try{ w=window.open(url,"_blank"); }catch(_){}
    if(w){ toast("Owner view opened in a new tab","ok"); return; }
    // pop-up blocked: let them tap a real link instead
    const back=openModal({title:"Open owner view", body:el("div",{},
      el("p",{class:"muted",style:"margin-top:0"},"Tap the button to open the owner screens in a new tab. This staff screen stays as it is."),
      el("a",{class:"btn btn-brass btn-block",href:url,target:"_blank",rel:"opener",onclick:()=>setTimeout(()=>back.remove(),300)},"👁 Open owner view"))});
  }, {title:"Owner view", sub:"Enter the owner PIN. The owner screens open in a new tab; this staff screen stays signed in."});
}
async function closeOwnerView(){
  try{ await acctLogoutAll(); }catch(_){}
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(_){}
  State.currentUser=null; State.unlocked=false;
  try{ window.close(); }catch(_){}
  setTimeout(()=>ownerViewEnded("Owner view closed."),250);
}
function ownerViewEnded(msg){
  hideAllViews(); $("#loadingView").classList.add("hide");
  let v=$("#peekEnded");
  if(!v){ v=el("div",{id:"peekEnded",class:"peek-ended"}); document.body.append(v); }
  v.innerHTML=""; v.append(el("div",{class:"card",style:"max-width:420px;margin:15vh auto;text-align:center"},
    el("h3",{},msg),
    el("p",{class:"muted"},"You can close this tab. The staff screen is in the other tab, still signed in."),
    el("button",{class:"btn btn-ghost",onclick:()=>window.close()},"Close this tab")));
}

async function enterApp(){
  hideAllViews();
  $("#loadingView").classList.remove("hide");
  try{ await Promise.all([loadAll(), acctInit(), schemaInit()]); }catch(_){}
  if(State.v>=10 && BUHAT.cafe && !BUHAT.cafe.name) BUHAT.cafe.name = State.data.settings?.business_name || "";
  // staff picked from the device list: fill in their schedule, role title and bonus share from the roster
  if(State.v>=10 && State.currentUser && State.currentUser.role!=="owner"){
    const row=(State.data.staff_roster||[]).find(r=>r.id===State.currentUser.id);
    if(row) State.currentUser={...State.currentUser, ...row, role:"staff"};
  }
  $("#loadingView").classList.add("hide");
  $("#appView").style.display="block";
  if (!State.wired) {
  State.wired = true;
  $("#backBtn").addEventListener("click", backHome);
  $("#homeBtn").addEventListener("click", backHome);
  $("#navToggle").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  $("#switchUserBtn").addEventListener("click", switchUser);
  }
  updateSwitchLabel();
  renderHome();
  planAfterEnter();
}

// Ends this person's session. A linked device goes back to its staff list;
// an owner on their own phone or computer is signed out.
async function switchUser(){
  if(State.peek) return closeOwnerView();
     applyTheme(null);
  clearSession(); await acctLogoutAll(); State.unlocked = false; State.section = null; State.currentUser = null;
  closeFlyouts && closeFlyouts(); document.body.classList.remove("nav-open","cart-open");
  if(State.v < 10){
    $("#appView").style.display="none";
    $("#authView").classList.remove("hide");
    $("#userSelectScreen").classList.remove("hide");
    $("#emailAuthScreen").classList.add("hide");
    renderUserSelection();
    return;
  }
  if(BUHAT.device){ await openDevice(); if(BUHAT.deviceInfo) return showStaffList(); }
  try{ await sb.auth.signOut({scope:"local"}); }catch(_){}
  BUHAT.authUser=null; BUHAT.cafe=null;
  showBuhatLogin();
}

// Old email login screen (database older than v10)
async function doLogin(){
  const email=$("#email").value.trim(), password=$("#pass").value;
  $("#authErr").textContent=""; const b=$("#loginBtn"); b.disabled=true; b.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ $("#authErr").textContent=error.message; b.disabled=false; b.textContent="Sign in"; return; }
  State.currentUser = { id:"owner_main", name: email.split("@")[0], role: "owner" };
  State.acct.token = null; State.acct.role = null;
  State.unlocked = true;
  await enterApp();
}

function setNewPasswordModal(){
  const p1=el("input",{class:"input",type:"password",autocomplete:"new-password"}), p2=el("input",{class:"input",type:"password",autocomplete:"new-password"});
  openModal({title:"Set a new password", body:el("div",{}, field("New password",p1), field("Repeat new password",p2)),
    footer:bk=>[el("button",{class:"btn btn-brass",onclick:async()=>{
      if(p1.value.length<8) return toast("Use at least 8 characters","bad");
      if(p1.value!==p2.value) return toast("The passwords don't match","bad");
      const {error}=await sb.auth.updateUser({password:p1.value});
      if(error) return toast(error.message,"bad");
      bk.remove(); toast("Password saved","ok"); afterOwnerLogin();
    }},"Save password")]});
}

function wireAuth(){
  $("#loginBtn").addEventListener("click", doLogin);
  $("#pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

  $("#showEmailAuthBtn").addEventListener("click", () => {
    if(State.v >= 10) return showBuhatLogin();
    $("#userSelectScreen").classList.add("hide");
    $("#emailAuthScreen").classList.remove("hide");
  });
  $("#backToUsersBtn").addEventListener("click", () => {
    $("#emailAuthScreen").classList.add("hide");
    $("#userSelectScreen").classList.remove("hide");
  });

  // buhat page
  $("#bhTabLogin").addEventListener("click", ()=>setBhTab("login"));
  $("#bhTabSignup").addEventListener("click", ()=>setBhTab("signup"));
  $("#bhLogin").addEventListener("submit", bhLogin);
  $("#bhSignup").addEventListener("submit", bhSignup);
  $("#bhBackToStaff").addEventListener("click", ()=>showStaffList());
  $("#bhForgot").addEventListener("click", async ()=>{
    const email=$("#bhEmail").value.trim(), err=$("#bhLoginErr");
    if(!email){ err.textContent="Type your email above first, then tap Forgot password."; return; }
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    err.textContent="";
    if(error) err.textContent=error.message;
    else showBhMessage("Check your email", `If ${email} has an account, a link to set a new password is on its way.`,
      [el("button",{class:"bh-btn ghost",type:"button",onclick:()=>showBuhatLogin()},"Back to log in")]);
  });
  if(sb) sb.auth.onAuthStateChange((event)=>{ if(event==="PASSWORD_RECOVERY") setTimeout(setNewPasswordModal, 50); });
}

wireAuth();
boot();
</script>
