<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#241a15" />
<title>Café Ledger & POS</title>

<!-- Fonts: Fraunces (display) · Hanken Grotesk (UI) · Spline Sans Mono (figures) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Supabase + Chart.js + Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --paper:#f3ede1;         /* kraft paper */
  --paper-2:#e9dfca;      /* deeper paper / wells */
  --card:#fffdf8;          /* card surface */
  --ink:#241a15;           /* espresso, near-black */
  --bean:#6b4a35;          /* mid coffee — secondary text */
  --bean-soft:#a98a73;    /* muted */
  --brass:#d35e2a;        /* Mugnâ sun — burnt orange */
  --brass-deep:#b54a1c;
  --sage:#5e7350;          /* money in */
  --sage-soft:#e7eede;
  --clay:#9e3a2b;          /* money out — deep brick */
  --clay-soft:#f1ddd5;
  --line:#e2d4bd;          /* hairline on paper */
  --line-soft:#efe5d2;
  --ok:#5e7350; --warn:#b97e2a; --bad:#b0543c;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(36,26,21,.06), 0 8px 24px rgba(36,26,21,.06);
  --mono:'Spline Sans Mono',ui-monospace,Menlo,monospace;
  --ui:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100vh}
body{
  font-family:var(--ui); color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; line-height:1.45; font-size:15px;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:15px}
h1,h2,h3{font-family:var(--disp); font-weight:500; letter-spacing:-.01em; margin:0}
a{color:var(--brass-deep)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- Receipt-tear divider ---------- */
.tear{height:8px;background-image:radial-gradient(circle at 6px -2px, transparent 5px, var(--line) 5px);
  background-size:12px 8px; background-repeat:repeat-x; opacity:.7; margin:2px 0}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100dvh; display:grid; place-items:center; padding:1cm;
  background:radial-gradient(120% 90% at 50% -10%, #2f221b 0%, #241a15 55%, #1b130f 100%); color:var(--paper)}
.auth-card{width:min(480px,100%); background:var(--card); color:var(--ink); border-radius:18px;
  padding:34px 30px; box-shadow:0 30px 60px rgba(0,0,0,.35)}
.brand-mark{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.brand-cup{width:48px;height:48px;border-radius:12px;background:var(--paper);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(36,26,21,.12);overflow:hidden}
.brand-cup svg, .brand-cup img{width:82%;height:82%;object-fit:contain;display:block}
#authView .brand-cup{width:64px;height:64px;border-radius:15px}
.brand-name{font-family:var(--disp); font-size:30px; line-height:1}
.brand-sub{color:var(--bean); font-size:13px; letter-spacing:.16em; text-transform:uppercase; margin-top:2px}
.auth-card h2{font-size:20px; margin:22px 0 4px}
.auth-card p.muted{color:var(--bean); font-size:13.5px; margin:0 0 18px}
label.fld{display:block; margin:14px 0 0}
label.fld>span{display:block; font-size:12.5px; font-weight:600; color:var(--bean); margin-bottom:6px; letter-spacing:.02em}
.input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--paper); color:var(--ink); outline:none}
.input:focus{border-color:var(--brass); box-shadow:0 0 0 3px rgba(211,94,42,.2)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent;
  padding:11px 16px; border-radius:var(--radius-sm); font-weight:600; font-size:14.5px; background:var(--paper-2); color:var(--ink)}
.btn:hover{filter:brightness(.98)}
.btn-primary{background:var(--ink); color:var(--paper)}
.btn-primary:hover{background:#34261d}
.btn-brass{background:var(--brass); color:#fff}
.btn-brass:hover{background:var(--brass-deep)}
.btn-ghost{background:transparent; border-color:var(--line)}
.btn-danger{background:var(--clay-soft); color:var(--clay); border-color:#eccabe}
.btn-block{width:100%}
.btn-sm{padding:7px 11px; font-size:13px; border-radius:99px}
.err{color:var(--clay); font-size:13px; margin-top:10px; min-height:1em}
.seg{display:flex; gap:6px; background:var(--paper-2); padding:4px; border-radius:11px; margin-top:6px}
.seg button{flex:1; border:none; background:transparent; padding:8px; border-radius:8px; font-weight:600; color:var(--bean); font-size:13.5px}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}

/* User Grid on Auth Screen */
.user-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px; margin-top:16px}
.user-card{background:var(--paper-2); border:2px solid var(--line); border-radius:14px; padding:16px 8px; text-align:center; cursor:pointer; transition:all .15s ease}
.user-card:hover{border-color:var(--brass); transform:translateY(-2px)}
.user-avatar{width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-weight:700; font-size:18px; margin:0 auto 8px}
.user-card.owner-card .user-avatar{background:var(--brass); color:#fff}
.user-card .user-name{font-weight:600; font-size:13.5px; word-break:break-word}
.user-card .user-role{font-size:11px; color:var(--bean); text-transform:uppercase; font-weight:700; margin-top:2px}

/* ---------- App shell ---------- */
.app{display:none; min-height:100dvh}
.main{min-width:0; padding:1cm; max-width:100%; margin:0}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.topbar .eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--bean); font-weight:600}
.topbar h1{font-size:30px; margin-top:2px}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:880px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}.cols-4.kpis{grid-template-columns:1fr 1fr}}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow)}
.card h3{font-size:17px; margin-bottom:4px}
.card .sub{color:var(--bean); font-size:13px; margin-bottom:14px}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 14px; flex-wrap:wrap}
.section-head h2{font-size:21px}

.kpi{display:flex; flex-direction:column; gap:6px}
.kpi .label{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--bean); font-weight:600}
.kpi .val{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.02em}
.kpi .val.in{color:var(--sage)} .kpi .val.out{color:var(--clay)}
.kpi .delta{font-size:12.5px; color:var(--bean)}

table{width:100%; border-collapse:collapse}
th,td{text-align:left; padding:10px 10px; border-bottom:1px solid var(--line-soft); font-size:14px; vertical-align:middle}
th{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--bean); font-weight:700; cursor:pointer; user-select:none}
th:hover{color:var(--ink)}
td.num,th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px}
.tag.business{background:var(--paper-2); color:var(--bean)}
.tag.personal{background:#e6e9f2; color:#46506b}
.tag.investor{background:var(--sage-soft); color:var(--sage)}
.tag.partner{background:var(--clay-soft); color:var(--clay)}
.tag.cash{background:var(--sage-soft); color:var(--sage)}
.tag.card{background:#e6e9f2; color:#46506b}
.tag.gcash,.tag.ewallet{background:#e3eefb; color:#1d6fb8}
.tag.bank{background:var(--paper-2); color:var(--bean)}
.tag.consumables{background:var(--sage-soft); color:var(--sage)}
.tag.recurring{background:#e3eefb; color:#1d6fb8}
.tag.fixed{background:#ece6f5; color:#6b4a9e}
.tag.onetime{background:var(--clay-soft); color:var(--clay)}
.tag.duplicate{background:var(--clay); color:#fff}
.tag.match{background:var(--sage-soft); color:var(--sage)}
.tag.mismatch{background:var(--clay-soft); color:var(--clay)}
.muted{color:var(--bean)}
.right{text-align:right}
.row-actions{display:flex; gap:6px; justify-content:flex-end}
.iconbtn{border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 8px; font-size:13px}
.iconbtn:hover{border-color:var(--brass)}
.empty{text-align:center; color:var(--bean); padding:28px 12px}
.empty .big{font-size:30px; opacity:.5}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--line); border-radius:999px;
  background:var(--card); font-size:13px; font-weight:600; color:var(--bean); cursor:pointer}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

/* Custom Date Filter Component */
.date-picker-wrap{display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); padding:4px 8px; border-radius:999px}
.date-picker-wrap input[type="date"]{border:none; background:transparent; font-size:12.5px; color:var(--ink); outline:none; font-family:var(--mono)}

/* ---------- POS ---------- */
.pos-grid{display:grid; grid-template-columns:1fr 380px; gap:18px; align-items:start}
@media (max-width:980px){.pos-grid{grid-template-columns:1fr}}
.menu-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:12px}
.prod{position:relative; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:0; overflow:hidden; box-shadow:0 1px 2px rgba(36,26,21,.05); transition:transform .07s, box-shadow .1s, border-color .1s; cursor:pointer}
.prod:hover{border-color:var(--brass); box-shadow:0 6px 16px rgba(36,26,21,.10)}
.prod:active{transform:scale(.96)}
.prod .ph{height:96px; background:var(--paper-2); background-size:cover; background-position:center; display:grid; place-items:center; color:var(--bean-soft); font-size:30px}
.prod .pd{padding:11px 12px 13px}
.prod .pn{font-weight:600; font-size:14.5px; line-height:1.25; min-height:2.5em}
.prod .pp{font-family:var(--mono); font-size:14.5px; color:var(--brass-deep); font-weight:600; margin-top:5px}
.prod .lowtag{position:absolute; top:8px; right:8px; background:var(--clay); color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px}
.prod .bestsellertag{position:absolute; top:8px; left:8px; background:var(--brass); color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px}

.cart{position:sticky; top:14px}
.cart .lines{max-height:none; margin:8px 0}
.cline{display:flex; flex-direction:column; gap:6px; padding:8px 0; border-bottom:1px dashed var(--line)}
.cline-top{display:flex; align-items:center; gap:8px}
.cline-addons{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding-left:34px; margin-top:2px}
.addon-sel{font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); width:100%}
.cline .nm{flex:1; font-size:13.5px; font-weight:600}
.qtybtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line); background:var(--card); font-weight:700; line-height:1}
.cline .lt{font-family:var(--mono); font-size:13px; width:78px; text-align:right}
.totrow{display:flex; justify-content:space-between; padding:5px 0; font-size:14px}
.totrow.grand{font-size:18px; font-weight:700; border-top:1px solid var(--line); margin-top:6px; padding-top:10px}
.totrow.grand .mono{font-size:20px}
.pay-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin:8px 0}
.pay-grid .chip{justify-content:center; cursor:pointer}

/* Schedule Grid Inputs */
.sched-grid { display: grid; gap: 8px; margin-top: 8px; }
.sched-row { display: grid; grid-template-columns: 30px 90px 1fr 20px 1fr; align-items: center; gap: 8px; background: var(--paper); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
.sched-row input[type="time"] { padding: 4px; font-size: 13px; font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; }
.sched-row.disabled { opacity: 0.5; }
.sched-row.disabled input[type="time"] { pointer-events: none; }

/* Bigger Category Chips in POS */
.pos-cat-bar .chip{font-size:15px; padding:10px 18px; border-width:2px; font-weight:700}

/* Bigger Shift Header Bar */
.big-shift-bar{background:var(--card); border:2px solid var(--brass); border-radius:18px; padding:16px 20px; margin-bottom:16px; box-shadow:var(--shadow)}
.big-shift-bar .title{font-size:18px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px}
.big-shift-bar .sub-reminder{font-size:13.5px; color:var(--brass-deep); font-weight:600; margin-top:2px}

/* Self-Service Kiosk Mode Overlay */
.kiosk-overlay{position:fixed; inset:0; z-index:999; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; padding:1cm}
.kiosk-header{background:var(--ink); color:var(--paper); padding:20px 28px; display:flex; align-items:center; justify-content:space-between}
.kiosk-header h1{font-family:var(--disp); font-size:28px}
.kiosk-body{flex:1; display:grid; grid-template-columns:1fr 400px; gap:20px; padding:20px 0 0 0; overflow:hidden}
.kiosk-menu-wrap{overflow-y:auto; padding-right:10px; display:flex; flex-direction:column; gap:16px}
.kiosk-cart-wrap{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; flex-direction:column}

/* ---------- forms / modal ---------- */
.modal-back{position:fixed; inset:0; background:rgba(27,19,15,.5); backdrop-filter:blur(3px); z-index:100;
  display:grid; place-items:center; padding:1cm}
.modal{background:var(--card); width:min(640px,100%); max-height:92dvh; overflow:auto; border-radius:18px; box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px}
.modal-head h3{font-size:20px}
.modal-body{padding:6px 20px 20px}
.modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:14px 20px 20px; position:sticky; bottom:0; background:var(--card)}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
.x{border:none; background:var(--paper-2); width:32px; height:32px; border-radius:999px; font-size:16px; color:var(--bean)}
textarea.input{min-height:64px; resize:vertical}
.help{font-size:12.5px; color:var(--bean); margin-top:6px}

/* toast */
.toasts{position:fixed; z-index:200; left:50%; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:10px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); font-weight:500}
.toast.bad{background:var(--clay)} .toast.ok{background:var(--sage)}

/* misc */
.kbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.spinner{width:18px;height:18px;border:2px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite; display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100dvh; display:grid; place-items:center; gap:14px; color:var(--bean)}
.model-card{border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; background:var(--card)}
.model-card.on{border-color:var(--brass); box-shadow:0 0 0 2px rgba(185,126,42,.2)}
.model-card h4{margin:0 0 4px; font-family:var(--disp); font-weight:600; font-size:16px}
.model-card p{margin:0; font-size:13px; color:var(--bean)}
.bar{height:8px; background:var(--paper-2); border-radius:999px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--brass)}
.notice{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13.5px; color:var(--bean)}
.config-warn{background:var(--clay-soft); border:1px solid #eccabe; color:var(--clay); border-radius:12px; padding:14px 16px; margin:0 0 16px; font-size:14px}

/* shell components */
.apphead{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ink);color:var(--paper);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.homebtn{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--paper);cursor:pointer;padding:0}
.homebtn .brand-cup{width:34px;height:34px;border-radius:999px;background:var(--paper);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(36,26,21,.12)}
.homebtn .brand-cup svg, .homebtn .brand-cup img{width:80%;height:80%;object-fit:contain}
.homebtn .brand-name{font-family:var(--disp);color:var(--paper)}
.user-pill{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.12); color:var(--paper); padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600}
.lockbtn{background:var(--brass);color:#fff;border:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;cursor:pointer}
.lockbtn:active{transform:scale(.97)}
@media(max-width:880px){.main{padding:1cm}}

/* Big Category Tiles for Home Screen */
.main-cats{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-bottom:24px}
@media(max-width:768px){.main-cats{grid-template-columns:1fr}}
.cat-tile{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:28px 20px; text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:all .2s ease}
.cat-tile:hover{border-color:var(--brass); transform:translateY(-3px); box-shadow:0 12px 28px rgba(36,26,21,.12)}
.cat-tile .cico{font-size:48px; line-height:1; margin-bottom:12px}
.cat-tile .clabel{font-family:var(--disp); font-size:22px; font-weight:600}
.cat-tile .csub{font-size:13px; color:var(--bean); margin-top:4px}

.group-section{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:24px; box-shadow:var(--shadow)}
.group-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bean);margin-bottom:16px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;transition:transform .07s,box-shadow .07s}
.tile:hover{box-shadow:0 6px 18px rgba(36,26,21,.10); border-color:var(--brass)}
.tile:active{transform:scale(.96)}
.tile .tico{font-size:32px;line-height:1;margin-bottom:8px}
.tile .tlabel{font-weight:600;font-size:13.5px}

.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--bean);font-weight:600;font-size:14.5px;margin-bottom:12px;cursor:pointer;padding:6px 2px}
.back:hover{color:var(--ink)}
.pindots{display:flex;gap:12px;justify-content:center;margin:16px 0 18px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.pindots i.on{background:var(--brass);border-color:var(--brass)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pinpad button{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:20px;font-weight:600;font-family:var(--mono);cursor:pointer}
.pinpad button:active{background:var(--paper-2)}
.table-filter-bar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}

/* Daily Reconciliation Grid */
.recon-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media(max-width:768px){.recon-grid{grid-template-columns:1fr}}
.recon-box{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:20px}
.recon-box.gcash-box{border-color:#1d6fb8}
.recon-box.cash-box{border-color:#5e7350}
.recon-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line-soft)}
.recon-row.total{border-top:2px solid var(--line); border-bottom:none; font-weight:700; font-size:16px; padding-top:14px}

/* ============ v2: sidebar shell, POS, dashboard, books ============ */
:root{ --head-h:64px }
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100dvh - var(--head-h));background:linear-gradient(to right,var(--paper-2) 232px,transparent 232px)}
.sidenav{position:sticky;top:var(--head-h);align-self:start;height:calc(100dvh - var(--head-h));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--paper-2);padding:18px 12px 28px}
.nav-group{margin-bottom:18px}
.nav-group-name{font-family:var(--disp);font-size:14px;color:var(--bean);padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
  padding:9px 10px;border-radius:var(--radius-sm);font-size:14.5px}
.nav-item:hover{background:var(--card)}
.nav-item.on{background:var(--ink);color:var(--paper)}
.nav-item:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.nav-ico{width:20px;text-align:center}
.navtoggle{display:none;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:6px 10px;font-size:18px}
@media(max-width:640px){
  .shell{grid-template-columns:1fr;background:none}
  .sidenav{position:fixed;top:0;left:0;bottom:0;width:270px;height:100dvh;z-index:60;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  body.nav-open .sidenav{transform:none}
  .navtoggle{display:inline-flex}
}
@media (prefers-reduced-motion: reduce){ .sidenav{transition:none} }

.reminder{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:var(--radius);margin-bottom:14px;border:2px solid}
.reminder.is-in{background:var(--clay-soft);border-color:var(--clay);color:var(--clay)}
.reminder.is-out{background:#fbf0dc;border-color:var(--warn);color:#7a5418}
.reminder-text{font-family:var(--disp);font-size:24px;line-height:1.2;max-width:40ch}
.pos-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pos-actions-gap{flex:1}
.btn-med{padding:12px 20px;font-size:15px;min-height:46px}
.pay-grid.two{grid-template-columns:1fr 1fr}
.chip.addon{font-size:12.5px;padding:5px 10px}
.btn-pay{margin-top:14px;padding:16px;font-size:19px}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;font-family:var(--mono);margin-bottom:14px}
.pay-total .muted{font-family:var(--ui);font-size:14px}
.big-input{font-size:22px;font-family:var(--mono);padding:12px}
.change-out{margin-top:14px;min-height:44px}
.change-out strong{display:block;font-size:32px;color:var(--sage)}
.bad-text{color:var(--clay);font-weight:600}
.count-result{min-height:40px;margin:10px 0;display:flex;align-items:center;gap:8px;font-size:18px}
.result-tag{font-weight:700;padding:6px 16px;border-radius:999px;font-size:17px}
.result-tag.match{background:var(--sage-soft);color:var(--sage)}
.result-tag.over{background:#fbf0dc;color:#7a5418}
.result-tag.short{background:var(--clay-soft);color:var(--clay)}
.recon-mini{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.recon-mini>div{display:flex;justify-content:space-between;padding:3px 0}
.recon-mini .total{font-weight:700;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}

.dash-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.flags-panel{position:sticky;top:calc(var(--head-h) + 16px);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--clay);border-radius:var(--radius);padding:16px}
.flags{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.flag{padding:10px 12px;border-radius:var(--radius-sm);background:var(--paper);border-left:3px solid var(--line)}
.flag.bad{border-left-color:var(--clay);background:var(--clay-soft)}
.flag.warn{border-left-color:var(--warn)}
.flag.info{border-left-color:#1d6fb8}
.flag-title{font-weight:600;font-size:14px}
.flag-detail{font-size:12.5px;color:var(--bean);margin:2px 0 6px}
@media(max-width:1100px){.dash-layout{grid-template-columns:1fr}.flags-panel{position:static;order:-1}}
.section-head.filters{flex-wrap:wrap;gap:10px}

.bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.bs-col{margin-bottom:16px}.bs-col h3{margin-bottom:8px}
.bs-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.bs-row.total{font-weight:700;border-bottom:1px solid var(--line)}
.bs-row.grand{border-top:2px solid var(--ink);border-bottom:0;margin-top:6px}
@media(max-width:760px){.bs-grid{grid-template-columns:1fr}}
.jlines{font-size:12.5px;line-height:1.5}
.check{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.setup{max-width:760px}

/* ============ v3: white sidebar with pop-out tabs (per mockup) ============ */
:root{ --paper:#f8f7f5; --paper-2:#efede9; --card:#ffffff; --line:#e7e3dc; --line-soft:#f1eee9; --side-w:248px; --side-muted:#8b857f }
body{background:var(--paper)}
@media(min-width:641px){ .apphead{display:none} }
.shell{grid-template-columns:var(--side-w) minmax(0,1fr);background:linear-gradient(to right,#fff var(--side-w),transparent var(--side-w))}
.sidenav{background:#fff;border-right:1px solid var(--line);padding:30px 0 22px;display:flex;flex-direction:column;overflow:visible;z-index:40}
.side-brand{display:flex;align-items:center;gap:12px;padding:0 30px 36px;border:0;background:none;text-align:left}
.side-logo{width:38px!important;height:38px!important;flex:none}
.side-name{font-family:var(--disp);font-weight:600;font-size:24px;letter-spacing:.03em;color:var(--brass);text-transform:uppercase}
.side-main{display:flex;flex-direction:column;gap:4px}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:0;padding-top:24px}
.side-tab{position:relative}
.side-btn{display:flex;align-items:center;gap:16px;width:100%;padding:14px 30px;border:0;background:none;color:var(--side-muted);
  font-family:var(--ui);font-size:16.5px;font-weight:600;text-align:left;border-radius:0 999px 999px 0;line-height:1.25}
.side-bottom .side-btn{padding:9px 30px;font-size:15.5px}
.side-btn:hover,.side-tab.open .side-btn{color:var(--ink)}
.side-tab.active .side-btn{background:var(--brass);color:#fff}
.side-btn:focus-visible,.fly-item:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.side-ico{width:20px;height:20px;flex:none;display:inline-grid}
.side-ico svg{width:20px;height:20px}
.side-label small{display:block;font-size:12px;font-weight:500;color:var(--side-muted);opacity:.85}
.side-tab.active .side-label small{color:#fff}
.flyout{display:none;position:absolute;left:calc(100% - 6px);top:0;min-width:230px;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 14px 36px rgba(36,26,21,.14);padding:8px;z-index:80}
.flyout::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:14px}
.side-bottom .flyout{top:auto;bottom:0}
.side-tab.open .flyout,.side-tab:focus-within .flyout{display:block}
@media (hover:hover) and (min-width:1200px){ .side-tab:hover .flyout{display:block} }
.fly-item{display:block;width:100%;padding:10px 14px;border:0;background:none;border-radius:10px;text-align:left;font-size:15px;color:var(--ink)}
.fly-item:hover{background:var(--paper)}
.fly-item.on{background:#fbece4;color:var(--brass-deep);font-weight:700}
@media(max-width:640px){
  .shell{grid-template-columns:1fr;background:none}
  .sidenav{width:280px}
  .flyout{position:static;box-shadow:none;border:0;padding:2px 0 8px 56px;min-width:0}
  .flyout::before{display:none}
  .side-tab:focus-within .flyout{display:none}
  .side-tab.open .flyout{display:block}
}

/* Menu list, recipe builder, add-ons */
.menu-table .cat-row td{background:var(--paper);font-family:var(--disp);font-size:15px;padding:10px 14px}
.cat-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.sub-h{font-family:var(--disp);font-size:16px;margin:18px 0 6px}
.recipe-rows{display:flex;flex-direction:column;gap:8px}
.recipe-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 90px 34px;gap:8px;align-items:center}
.recipe-row.swap{grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 34px}
.qty-unit{display:flex;align-items:center;gap:6px}
.recipe-sum{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:var(--paper);border-radius:var(--radius-sm)}
.recipe-sum>div{display:flex;flex-direction:column;gap:2px;font-size:13px}
.recipe-sum strong{font-size:17px}
@media(max-width:560px){.recipe-row{grid-template-columns:1fr 1fr}.recipe-row.swap{grid-template-columns:1fr 18px 1fr}}
.owner-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.owner-strip>div{display:flex;flex-wrap:wrap;gap:4px;align-items:baseline}

.side-ico{--ico-cut:#fff}
.side-tab.active .side-ico{--ico-cut:var(--brass)}

/* ============ v4: phone · tablet · computer ============ */
.side-short,.fly-title,.phone-title,.avatar-btn,.cart-bar,.sheet-close,#scrim{display:none}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ---- Tablet: 641–1199px — icon rail, POS side by side ---- */
@media (min-width:641px) and (max-width:1199px){
  :root{--side-w:88px}
  .main{padding:24px}
  .sidenav{padding:22px 0 16px;align-items:center}
  .side-brand{padding:0 0 22px;justify-content:center}
  .side-name,.side-label{display:none}
  .side-short{display:block;font-size:11px;font-weight:600;line-height:1.15;text-align:center}
  .side-main,.side-bottom{width:100%;align-items:center}
  .side-btn,.side-bottom .side-btn{flex-direction:column;justify-content:center;gap:5px;width:72px;padding:10px 4px;border-radius:14px;font-size:11px}
  .side-tab.active .side-btn{border-radius:14px}
  .side-ico,.side-ico svg{width:22px;height:22px}
  .flyout{left:calc(100% + 2px)}
  .flyout::before{left:-10px;width:10px}
  .fly-title{display:block;font-family:var(--disp);font-size:15px;color:var(--bean);padding:6px 14px 6px}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .cols-3.kpis{grid-template-columns:repeat(3,1fr)}
  .cols-4.kpis{grid-template-columns:repeat(2,1fr)}
  .pos-grid{grid-template-columns:minmax(0,1fr) 320px}
  .menu-cards{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .chip,.btn-sm{min-height:38px}
}
@media (min-width:641px) and (max-width:900px){
  .cols-3.kpis{grid-template-columns:repeat(2,1fr)}
  .bs-grid{grid-template-columns:1fr}
}

/* ---- Phone: up to 640px — top bar + drawer, cards instead of wide tables, order sheet ---- */
@media (max-width:640px){
  :root{--side-w:0px}
  body{font-size:15px}
  input,select,textarea{font-size:16px!important}
  .main{padding:16px 14px 28px}
  body.on-pos .main{padding-bottom:110px}

  /* top bar */
  .apphead{padding:10px 14px;gap:10px}
  .apphead .homebtn .brand-name,.apphead .user-pill{display:none}
  .phone-title{display:block;flex:1;min-width:0;font-family:var(--disp);font-size:19px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .avatar-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--brass);color:#fff;font-weight:700;font-size:16px}
  .navtoggle{min-width:40px;min-height:40px;justify-content:center}
  .apphead>div:last-child{flex:1;min-width:0;justify-content:space-between}
  #scrim{position:fixed;inset:0;background:rgba(27,19,15,.42)}
  body.nav-open #scrim{display:block;z-index:58}
  body.cart-open #scrim{display:block;z-index:88}
  .sidenav{width:min(300px,86vw);z-index:60}
  .side-btn{padding:13px 24px}
  .fly-item{padding:12px 14px;font-size:15.5px}

  /* page heading */
  .topbar{display:block;margin-bottom:14px}
  .topbar .eyebrow{display:none}
  .topbar h1{font-size:24px}
  .topbar>.muted{text-align:left!important;max-width:none!important;margin-top:4px;font-size:13px!important}

  /* filters and toolbars */
  .section-head{align-items:stretch}
  .section-head>*{width:100%}
  .section-head .kbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .section-head .kbar>.kbar{display:contents}
  .section-head .kbar>.kbar.hide{display:none!important}
  .section-head .period-custom{grid-column:1/-1;display:flex!important;align-items:center;gap:8px}
  .section-head .period-custom.hide{display:none!important}
  .section-head .period-custom input{flex:1}
  .toasts{bottom:auto;top:72px;width:calc(100% - 28px)}
  .section-head .kbar select,.section-head .kbar input,.section-head .kbar .btn{width:100%!important}
  .section-head>.btn,.section-head>button{width:100%}
  .section-head h2{font-size:19px}

  /* grids and KPIs */
  .grid{gap:10px}
  .kpis,.cols-4.kpis,.cols-3.kpis,.cols-2.kpis{grid-template-columns:1fr 1fr!important}
  .kpi .val{font-size:19px}
  .kpi .label{font-size:10.5px;letter-spacing:.06em}
  .card{padding:14px;border-radius:14px}

  /* tables -> stacked cards */
  #screen table.stack thead{display:none}
  #screen table.stack,#screen table.stack tbody,#screen table.stack tfoot,#screen table.stack tr,#screen table.stack td{display:block;width:100%}
  #screen table.stack tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  #screen table.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;border:0;text-align:right;font-size:14px;max-width:none!important}
  #screen table.stack td::before{content:attr(data-label);flex:none;text-align:left;color:var(--bean);font-size:12px;font-weight:600;font-family:var(--ui)}
  #screen table.stack td[data-label=""]::before{display:none}
  #screen table.stack td:first-child{display:block;text-align:left;font-weight:600;font-size:15px;padding-bottom:4px}
  #screen table.stack td:first-child::before{display:none}
  #screen table.stack td:last-child:empty{display:none}
  #screen table.stack .row-actions{justify-content:flex-end;width:100%;gap:8px}
  #screen table.stack .iconbtn{min-width:40px;min-height:40px}
  #screen table.stack tfoot tr{background:var(--paper)}
  #screen table.stack .cat-row td{display:block;text-align:left}
  .tbl-wrap{overflow-x:visible}

  /* POS */
  .reminder{padding:14px 16px}
  .reminder-text{font-size:19px}
  .reminder .btn{width:100%}
  .pos-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pos-actions .btn-med{padding:10px 6px;font-size:14px;min-height:48px}
  .pos-actions-gap,.pos-actions [title="Customer-facing menu"]{display:none}
  .pos-actions>.muted{grid-column:1/-1;order:-1}
  .pos-cat-bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .pos-cat-bar .chip{flex:none;min-height:40px}
  .pos-grid{display:block}
  .menu-cards,.menu-cards.big{grid-template-columns:1fr 1fr;gap:10px}
  .prod .ph{height:70px}
  .prod .pd{padding:9px 10px 11px}
  #cartCard{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:90;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;
    transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -12px 40px rgba(0,0,0,.25);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  body.cart-open #cartCard{transform:none}
  .sheet-close{display:inline-flex}
  .cart-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:85;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
  .cart-bar>div{display:flex;flex-direction:column;line-height:1.25}
  .cart-bar .mono{font-size:17px}
  .cart-bar.empty .mono{font-family:var(--ui);font-size:13px;opacity:.75}
  .cart-bar .btn{min-height:46px;padding:0 20px}
  .cline-addons .chip.addon{min-height:36px}

  /* modals become bottom sheets */
  .modal-back{align-items:flex-end!important;place-items:end center!important;padding:0!important}
  .modal{width:100%;max-height:94dvh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal-foot{flex-wrap:wrap}
  .modal-foot .btn{flex:1}
  .pinpad button{padding:18px}

  /* dashboard */
  .flags-panel{padding:14px}
  .owner-strip{flex-direction:column;align-items:stretch}
  .recipe-sum{gap:14px}
}
@media (prefers-reduced-motion: reduce){ #cartCard{transition:none} }

.receipt-link{white-space:nowrap;font-weight:600;font-size:13px;text-decoration:none}
.receipt-preview{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px;border:1px solid var(--line);border-radius:var(--radius-sm);text-decoration:none;font-weight:600}
.receipt-preview img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--paper-2)}

</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div id="loadingView" class="loading-screen"><span class="spinner"></span><div>Loading Ledger & POS…</div></div>
<div id="cfgWarn" class="config-warn hide" style="margin:16px"></div>

<!-- ============ LOGIN ============ -->
<div id="authView" class="auth-wrap hide">
  <div class="auth-card">
    <div class="brand-mark"><div class="brand-cup"></div><div><div class="brand-name" id="authBrandTitle">Café Ledger</div><div class="brand-sub">Management Portal</div></div></div>
    
    <div id="userSelectScreen">
      <h2>Select User</h2>
      <p class="muted">Tap your profile to sign in with your PIN.</p>
      
      <div class="user-grid" id="userListGrid"></div>

      <div style="margin-top:20px; text-align:center;">
        <button id="showEmailAuthBtn" class="btn btn-ghost btn-sm">Sign in with Email/Pass (Owner)</button>
      </div>
    </div>

    <div id="emailAuthScreen" class="hide">
      <h2>Email Login</h2>
      <p class="muted">Sign in with Supabase account credentials.</p>
      <label class="fld"><span>Email</span><input id="email" class="input" type="email" autocomplete="username" placeholder="owner@cafe.com"></label>
      <label class="fld"><span>Password</span><input id="pass" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <div class="err" id="authErr"></div>
      <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:16px">Sign in</button>
      <button id="backToUsersBtn" class="btn btn-ghost btn-block" style="margin-top:8px">← Back to User Select</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" style="display:none">
  <header class="apphead">
    <button class="navtoggle" id="navToggle" aria-label="Open menu">☰</button>
    <button class="homebtn" id="homeBtn" title="Home"><span class="brand-cup"></span><span class="brand-name" id="headerBrandName" style="font-size:22px">Café Ledger</span></button>
    <div style="display:flex; align-items:center; gap:10px">
      <div class="phone-title" id="phoneTitle"></div>
      <button class="avatar-btn" id="avatarBtn" aria-label="My account">?</button>
      <div class="user-pill">
        <span id="activeUserName">Staff</span>
        <button class="lockbtn" id="switchUserBtn">Switch User</button>
      </div>
    </div>
  </header>
  <div class="shell">
  <nav class="sidenav" id="sideNav" aria-label="Sections"></nav>
  <main class="main">
    <div id="home"></div>
    <div id="section" class="hide">
      <button class="back" id="backBtn">‹ Home</button>
      <div id="screen"></div>
    </div>
  </main>
  </div>
</div>

<!-- Self-Service Customer Kiosk Overlay -->
<div id="kioskOverlay" class="kiosk-overlay hide">
  <div class="kiosk-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="brand-cup" style="width:40px; height:40px;"></div>
      <h1 id="kioskTitle">Select Your Drinks</h1>
    </div>
    <button class="btn btn-brass" id="closeKioskBtn">Done / Exit Self-Serve</button>
  </div>

/* ---------- Global Table Sorting & Filtering ---------- */
const TableSortState = {}; 
function getSortState(key, defaultCol="date", defaultAsc=false) {
  if (!TableSortState[key]) {
    TableSortState[key] = { col: defaultCol, asc: defaultAsc, filter: "" };
  }
  return TableSortState[key];
}

function renderTableControls(key, placeholder="Search entries...", onUpdate=()=>{}) {
  const state = getSortState(key);
  const input = el("input", {
    class: "input",
    style: "max-width:300px; padding:6px 12px; font-size:13.5px;",
    placeholder: placeholder,
    value: state.filter || "",
    oninput: (e) => {
      state.filter = e.target.value.toLowerCase();
      onUpdate();
    }
  });
  return el("div", { class: "table-filter-bar" }, input);
}

function applySortAndFilter(data, key, filterFields=[], defaultCol="date") {
  const state = getSortState(key, defaultCol);
  let result = [...data];

  if (state.filter) {
    result = result.filter(item => {
      return filterFields.some(f => {
        let val = item[f];
        if (val === null || val === undefined) return false;
        if (typeof val === "object") val = JSON.stringify(val);
        return String(val).toLowerCase().includes(state.filter);
      });
    });
  }

  if (state.col) {
    result.sort((a, b) => {
      let va = a[state.col], vb = b[state.col];
      if (va === undefined || va === null) va = "";
      if (vb === undefined || vb === null) vb = "";
      
      if (typeof va === "string" && !isNaN(Date.parse(va))) va = new Date(va).getTime();
      if (typeof vb === "string" && !isNaN(Date.parse(vb))) vb = new Date(vb).getTime();

      if (va < vb) return state.asc ? -1 : 1;
      if (va > vb) return state.asc ? 1 : -1;
      return 0;
    });
  }

  return result;
}

function makeSortableTh(label, colName, stateKey, onUpdate=()=>{}) {
  const state = getSortState(stateKey);
  const isCurrent = state.col === colName;
  const arrow = isCurrent ? (state.asc ? " ▲" : " ▼") : "";
  return el("th", {
    onclick: () => {
      if (state.col === colName) {
        state.asc = !state.asc;
      } else {
        state.col = colName;
        state.asc = true;
      }
      onUpdate();
    }
  }, label + arrow);
}

/* Custom Date Filter Component */
const DateRanges = {
  sales: { mode: "today", start: "", end: "" },
  staff: { mode: "7", start: "", end: "" },
  expenses: { mode: "all", start: "", end: "" }
};

function renderCustomDateFilter(key, onUpdate) {
  const state = DateRanges[key];
  const wrap = el("div", { class: "kbar" });
  
  const sel = el("select", {
    class: "input",
    style: "width:auto; font-size:13px; padding:6px 10px;",
    onchange: (e) => {
      state.mode = e.target.value;
      if (state.mode !== "custom") {
        customBox.classList.add("hide");
        onUpdate();
      } else {
        customBox.classList.remove("hide");
      }
    }
  },
    el("option", { value: "today", selected: state.mode === "today" }, "Today"),
    el("option", { value: "7", selected: state.mode === "7" }, "Last 7 Days"),
    el("option", { value: "30", selected: state.mode === "30" }, "Last 30 Days"),
    el("option", { value: "month", selected: state.mode === "month" }, "This Month"),
    el("option", { value: "all", selected: state.mode === "all" }, "All Time"),
    el("option", { value: "custom", selected: state.mode === "custom" }, "📅 Custom Range...")
  );

  const startIn = el("input", { type: "date", value: state.start, onchange: (e) => { state.start = e.target.value; if (state.end) onUpdate(); } });
  const endIn = el("input", { type: "date", value: state.end, onchange: (e) => { state.end = e.target.value; if (state.start) onUpdate(); } });

  const customBox = el("div", { class: "date-picker-wrap " + (state.mode === "custom" ? "" : "hide") },
    startIn, el("span", { style: "font-size:12px; color:var(--bean)" }, "to"), endIn
  );

  wrap.append(sel, customBox);
  return wrap;
}

function filterByDateRange(items, dateField, rangeState) {
  if (!items || !items.length) return [];
  const mode = rangeState.mode;
  const now = new Date();

  return items.filter(item => {
    const rawD = item[dateField] || item.created_at;
    if (!rawD) return true;
    const d = new Date(rawD);

    if (mode === "all") return true;
    if (mode === "today") return d.toDateString() === now.toDateString();
    if (mode === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (mode === "7") return (now - d) <= 7 * 864e5;
    if (mode === "30") return (now - d) <= 30 * 864e5;
    if (mode === "custom") {
      if (!rangeState.start || !rangeState.end) return true;
      const start = new Date(rangeState.start + "T00:00:00");
      const end = new Date(rangeState.end + "T23:59:59");
      return d >= start && d <= end;
    }
    return true;
  });
}

function renderStaffHome(home) {
  const isMarketing = (State.currentUser.role_title || "").toLowerCase().includes("marketing");
  
  // Calculate Weekly Store Sales (Starting Monday)
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1); 
  const startDate = new Date(now.setDate(diff));
  startDate.setHours(0,0,0,0);

  const periodSales = State.data.sales.filter(s => isActiveSale(s) && new Date(s.sold_at || s.created_at) >= startDate);
  const totalStoreVol = periodSales.reduce((acc, s) => acc + saleNet(s), 0);

  // Bonus Pool Calculations
  const target = Number(State.data.settings?.config?.sales_target || 0);
  const poolPct = Number(State.data.settings?.config?.bonus_pool_pct || 0);
  
  let calculatedBonus = 0;
  if (totalStoreVol >= target) {
    calculatedBonus = totalStoreVol * (poolPct / 100);
  }
  
  const mySharePct = Number(State.currentUser.bonus_share_pct || 0);
  const myBonus = calculatedBonus * (mySharePct / 100);

  const kpiGrid = el("div", { class: "grid cols-3", style: "margin-bottom:24px" },
    kpiCard(`Weekly Store Sales`, peso(totalStoreVol), totalStoreVol >= target ? "in" : "", `Target: ${peso(target)}`),
    kpiCard("Current Bonus Pool", peso(calculatedBonus), calculatedBonus > 0 ? "in" : "", poolPct > 0 ? `${poolPct}% of total sales` : "Waiting to hit target..."),
    kpiCard("Expected Bonus Share", peso(myBonus), myBonus > 0 ? "in" : "", `${mySharePct}% cut`)
  );
  home.append(kpiGrid);

  // --- Marketing Staff Specific View ---
  if (isMarketing) {
    // Calculate Time Tracked Today
    const todayStr = todayISO();
    const myShiftsToday = (State.data.shifts || []).filter(s => s.name === State.currentUser.name && (s.shift_date === todayStr || (s.time_in && s.time_in.startsWith(todayStr))));
    let trackedMs = 0;
    myShiftsToday.forEach(s => {
      const inTime = new Date(s.time_in);
      const outTime = s.time_out ? new Date(s.time_out) : new Date(); // If currently clocked in, count up to now
      trackedMs += (outTime - inTime);
    });
    const trackedHrs = trackedMs / 3.6e6;

    // Calculate Scheduled Hours
    const dayOfWeek = new Date().toLocaleDateString('en-US', {weekday: 'long'}).toLowerCase();
    const sched = (State.currentUser.work_schedule || {})[dayOfWeek];
    let schedHrs = 0;
    if (sched && sched.enabled) {
      let [sh, sm] = (sched.start || "00:00").split(':').map(Number);
      let [eh, em] = (sched.end || "00:00").split(':').map(Number);
      let sDec = sh + sm/60; let eDec = eh + em/60;
      if (eDec <= sDec) eDec += 24;
      schedHrs = eDec - sDec;
    }
    
    const exceeded = schedHrs > 0 && trackedHrs > schedHrs;
    const activeShift = myShiftsToday.find(s => !s.time_out);

    // Overtime Warning Banner
    if (exceeded) {
      home.append(el("div", { class: "config-warn", style: "margin-bottom:16px; background:#fff3f3; color:#d32f2f; border-color:#ffcdd2;" }, 
        "⚠️ WARNING: You have exceeded your scheduled hours for today."
      ));
    }

    const timeGrid = el("div", { class: "grid cols-2", style: "margin-bottom:24px" },
      kpiCard("Time Tracked Today", `${trackedHrs.toFixed(2)} hrs`, exceeded ? "out" : "in", `Scheduled: ${schedHrs > 0 ? schedHrs.toFixed(2) + ' hrs' : 'Rest Day'}`),
      el("div", { class: "card", style: "display:flex; align-items:center; justify-content:center;" },
        activeShift 
          ? el("button", { class: "btn btn-danger", style: "font-size:16px; padding:12px 24px;", onclick: () => clockOut(activeShift.id, activeShift.name) }, "Stop Time (Clock Out)")
          : el("button", { class: "btn btn-brass", style: "font-size:16px; padding:12px 24px;", onclick: clockIn }, "Start Time (Clock In)")
      )
    );
    home.append(timeGrid);
    
    // Return early so Marketing staff do not see the Sales table or the POS/Inventory buttons
    return;
  }

  // --- Regular Barista / Floor Staff View ---
  const actionRow = el("div", { class: "kbar", style: "margin-bottom:20px" },
    el("button", { class: "btn btn-brass", onclick: () => openSection("pos") }, "🧾 Open POS Terminal"),
    el("button", { class: "btn btn-ghost", onclick: () => openSection("reconciliation") }, "⚖️ Daily Reconciliation"),
    el("button", { class: "btn btn-ghost", onclick: () => openSection("shifts") }, "⏱️ Clock In / Shifts"),
    el("button", { class: "btn btn-ghost", onclick: () => openSection("inventory") }, "📦 Stock & Servings")
  );

  const tableHead = el("div", { class: "section-head" }, el("h2", {}, "Weekly Store Sales Log"));
  const tblWrap = el("div", { class: "tbl-wrap card", style: "padding:0;overflow:hidden" });
  
  if (!periodSales.length) {
    tblWrap.append(el("div", { class: "empty" }, el("div", { class: "big" }, "🧾"), "No sales logged by the store yet this week."));
  } else {
    const t = el("table");
    t.append(el("thead",{},el("tr",{}, el("th",{}, "Time"), el("th",{}, "Items"), el("th",{}, "Server"), el("th", { class: "num" }, "Total"))));
    const tb = el("tbody");
    [...periodSales].sort((a,b) => new Date(b.sold_at||b.created_at) - new Date(a.sold_at||a.created_at)).forEach(s => {
      const itemTxt = (s.items||[]).map(i => `${i.qty}× ${i.name}`).join(", ");
      tb.append(el("tr", {},
        el("td", { class: "muted" }, new Date(s.sold_at||s.created_at).toLocaleString("en-PH", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" })),
        el("td", {}, itemTxt),
        el("td", { class: "muted" }, s.note?.split("(Server: ")[1]?.replace(")","") || "Unknown"),
        el("td", { class: "num", style: "font-weight:600" }, peso(s.total))
      ));
    });
    t.append(tb); tblWrap.append(t);
  }

  home.append(actionRow, tableHead, tblWrap);
}

async function refresh(table){const {data,error}=await sb.from(table).select("*").order("created_at",{ascending:false}); if(!error)State.data[table]=data||[];}

/* Storage File Upload */
async function uploadFile(file, folder){
  const path = `${folder}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,"_")}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false});
  if(error)throw error;
  const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
  return {url:data.publicUrl, path};
}

/* ---------- COGS & Recipe Helpers ---------- */
function ingMap(){const m={}; State.data.ingredients.forEach(i=>m[i.id]=i); return m;}
function cogsOf(item){
  const m=ingMap(); let c=0;
  (item.recipe||[]).forEach(r=>{const ing=m[r.ingredient_id]; if(ing)c+=(Number(r.qty)||0)*(Number(ing.cost_per_unit)||0);});
  return c;
}

function isMilkIng(ing){ return !!(ing && /milk/i.test(ing.name||"")); }
function isCupIng(ing){ return !!(ing && /cup/i.test(ing.name||"")); }
function milkLineOf(item,m){ m=m||ingMap(); return (item.recipe||[]).find(r=>isMilkIng(m[r.ingredient_id])); }
function cupLineOf(item,m){ m=m||ingMap(); return (item.recipe||[]).find(r=>isCupIng(m[r.ingredient_id])); }

function modsLabel(mods, m){
  if(!mods) return "";
  const parts = [];
  if(mods.upsize && mods.upsize !== "std") parts.push(`Upsize to 16oz (+₱${mods.upsizePrice||0})`);
  if(mods.milk && mods.milk !== "std") parts.push(`Sub Oat Milk (+₱${mods.milkPrice||0})`);
  if(mods.cup && mods.cup !== "std") parts.push(`8oz Hot Cup (+₱${mods.cupPrice||0})`);
  return parts.length ? ` (${parts.join(", ")})` : "";
}

function effectiveRecipe(item, mods, m){
  m=m||ingMap();
  const isUpsized = !!(mods && mods.upsize && mods.upsize !== "std");
  const scale = isUpsized ? (16/12) : 1;
  return (item.recipe||[]).map(r=>{
    let ingId=r.ingredient_id, qty=Number(r.qty)||0;
    const baseIsCup=isCupIng(m[r.ingredient_id]);
    if(isUpsized && !baseIsCup) qty=qty*scale;
    return {ingredient_id:ingId, qty};
  });
}

/* ============================================================
   OCR SCANNER HELPER
   ============================================================ */
function createOcrScannerModal(targetType="sales") {
  const isSales = targetType === "sales";
  const dateIn = el("input", {class:"input", type:"datetime-local", value: nowLocalISO()});
  const fileIn = el("input", {type:"file", accept:"image/*", style:"display:none;"});
  const fileBtn = el("button", {class:"btn btn-brass btn-block", onclick:()=>fileIn.click()}, "📷 Take Photo or Select Image");
  const statusDiv = el("div", {class:"help", style:"margin-top:10px; text-align:center; font-weight:600;"});
  const previewImg = el("img", {style:"max-width:100%; max-height:200px; border-radius:10px; margin-top:10px; display:none;"});
  const resultsBox = el("div", {style:"margin-top:14px;"});

  let scannedItems = [];

  fileIn.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    previewImg.src = URL.createObjectURL(file);
    previewImg.style.display = "block";
    statusDiv.textContent = "Scanning document for numbers and line items... Please wait.";
    resultsBox.innerHTML = "";

    try {
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(file);
      await worker.terminate();

      const lines = ret.data.text.split('\n').filter(l => l.trim().length > 0);
      scannedItems = [];

      lines.forEach(line => {
        const matches = line.match(/(.*?)(?:₱|\$)?\s*(\d+(?:\.\d{2})?)\s*$/);
        if (matches) {
          const desc = matches[1].replace(/[^a-zA-Z0-9\s]/g, "").trim() || "Scanned Item";
          const amount = parseFloat(matches[2]);
          if (amount > 0) {
            scannedItems.push({ desc, amount });
          }
        }
      });

      statusDiv.textContent = `Scan Complete! Found ${scannedItems.length} potential entry/entries.`;
      renderDetectedItems();
    } catch (err) {
      statusDiv.textContent = "Error scanning image. " + err.message;
    }
  };

  function renderDetectedItems() {
    resultsBox.innerHTML = "";
    if(!scannedItems.length){
      resultsBox.append(el("div", {class:"notice"}, "Could not parse line items clearly. You can add items manually below or try a clearer photo."));
    }

    scannedItems.forEach((item, idx) => {
      const descIn = el("input", {class:"input", style:"flex:2", value: item.desc});
      const amtIn = el("input", {class:"input", type:"number", step:"0.01", style:"width:90px", value: item.amount});
      
      const row = el("div", {style:"display:flex; gap:6px; margin-bottom:6px; align-items:center;"},
        descIn, amtIn,
        el("button", {class:"iconbtn", onclick:()=>{ scannedItems.splice(idx,1); renderDetectedItems(); }}, "✕")
      );
      descIn.oninput = (e) => item.desc = e.target.value;
      amtIn.oninput = (e) => item.amount = parseFloat(e.target.value) || 0;
      resultsBox.append(row);
    });

    resultsBox.append(el("button", {class:"btn btn-ghost btn-sm", style:"margin-top:6px;", onclick:()=>{
      scannedItems.push({ desc:"Custom Item", amount: 0 });
      renderDetectedItems();
    }}, "+ Add Item Line"));
  }

  const supplierIn = el("input", {class:"input", placeholder:"Vendor / Store Name"});

  const body = el("div", {},
    field(isSales ? "Date & Time for Scanned Sales" : "Expense Date", dateIn),
    !isSales ? field("Supplier / Store Name", supplierIn) : null,
    el("div", {style:"margin-top:10px;"}, fileBtn, fileIn),
    previewImg,
    statusDiv,
    resultsBox
  );

  openModal({
    title: isSales ? "Scan Sales Receipt or Logbook" : "Scan Expense Receipt or Invoice",
    body,
    footer: bk => [
      el("button", {class:"btn btn-ghost", onclick:()=>bk.remove()}, "Cancel"),
      el("button", {class:"btn btn-brass", onclick:async()=>{
        if(!scannedItems.length) return toast("No line items to save", "bad");
        const targetDate = new Date(dateIn.value).toISOString();

        if (isSales) {
          for (const s of scannedItems) {
            if (s.amount > 0) {
              await ins("sales", {
                items: [{ name: s.desc, qty: 1, price: s.amount }],
                subtotal: s.amount,
                total: s.amount,
                payment_method: "Cash",
                payment_status: "paid",
                note: `Imported via Scanner (${State.currentUser.name})`,
                sold_at: targetDate
              });
            }
          }
          await refresh("sales");
          bk.remove();
          drawSalesTable();
          if($("#salesKpis")) drawSummaryKpis();
          toast("Scanned sales logged successfully!", "ok");
        } else {
          const totalAmt = scannedItems.reduce((acc, i) => acc + (i.amount || 0), 0);
          const validItems = scannedItems.map(i => ({ name: i.desc, qty: 1, price: i.amount }));
          
          await ins("expenses", {
            spent_at: dateIn.value.slice(0, 10),
            supplier: supplierIn.value.trim() || "Scanned Receipt",
            description: `Imported via Scanner (${State.currentUser.name})`,
            items: validItems,
            category: "Supplies",
            amount: totalAmt,
            expense_type: "Consumables",
            source: "Business",
            has_receipt: "Yes",
            status: isOwner() ? "approved" : "pending"
          });

          await refresh("expenses");
          bk.remove();
          go("expenses");
          toast("Scanned expense logged!", "ok");
        }
      }}, isSales ? "Save All Scanned Sales" : "Save as Expense")
    ]
  });
}

let CART={};
let CART_PAY="Cash", CART_TIP=0, CART_NOTE="", CART_DISC=0, CART_DISC_TYPE="amount", CART_DATE=nowLocalISO();
function clearCart(){CART={};CART_TIP=0;CART_DISC=0;CART_DISC_TYPE="amount";CART_NOTE="";CART_DATE=nowLocalISO();}

function getBestSellers() {
  const sales = State.data.sales || [];
  const counts = {};
  sales.forEach(s => {
    (s.items || []).forEach(i => {
      counts[i.menu_id] = (counts[i.menu_id] || 0) + (i.qty || 1);
    });
  });
  return counts;
}

function lowStock(item){
  const m=ingMap();
  return (item.recipe||[]).some(r=>{const ing=m[r.ingredient_id]; return ing && ing.stock_qty!=null && Number(ing.stock_qty) < Number(r.qty);});
}

function cartSubtotal(){
  let t=0;
  for(const k in CART) t += CART[k].qty * lineUnitPrice(CART[k]);
  return t;
}

function calculatedDiscount() {
  const sub = cartSubtotal();
  if (CART_DISC_TYPE === "percent") {
    return sub * (Math.min(100, Math.max(0, CART_DISC)) / 100);
  }
  return Math.min(sub, Math.max(0, CART_DISC));
}

  menuGrid.append(catBar, cardsContainer);

  function drawKioskCategoryProducts(){
    cardsContainer.innerHTML = "";

    const displayCats = activeKioskCat === "all" ? cats : [activeKioskCat];

    displayCats.forEach(cat => {
      const catItems = rawMenu.filter(m => (m.category || "Uncategorized") === cat);

      const cards = el("div", { class: "menu-cards", style: "grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px;" });

        cards.append(card);
      });

      cardsContainer.append(catHeader, cards);
    });

  drawKioskCategoryProducts();

  function drawKioskCart() {
    cartWrap.innerHTML = "";
    cartWrap.append(el("h2", { style: "font-family:var(--disp); margin-bottom:14px;" }, "Your Order"));
    const lines = el("div", { style: "flex:1; overflow-y:auto; margin-bottom:14px;" });
    const keys = Object.keys(CART);

    if (!keys.length) {
      lines.append(el("div", { class: "empty" }, "Tap drinks on the left to build your order!"));
    }

    keys.forEach(k => {
      const line = CART[k];
      const uPrice = lineUnitPrice(line);
      lines.append(el("div", { class: "cline", style: "padding:10px 0;" },
        el("div", { class: "cline-top" },
          el("button", { class: "qtybtn", onclick: () => { CART[k].qty--; if (CART[k].qty <= 0) delete CART[k]; drawKioskCart(); } }, "−"),
          el("span", { class: "mono", style: "font-weight:700; font-size:16px;" }, line.qty),

      overlay.classList.add("hide");
      drawCart();
      toast("Customer order selected! Complete payment at register.", "ok");
    }}, "Confirm & Pay at Counter");
    cartWrap.append(completeBtn);
  }

  drawKioskCart();
}

/* ============================================================
   DAILY SALES TRACKER RECONCILIATION
   ============================================================ */
function renderReconciliation(root){
  root.append(topbar("Daily Sales Tracker Reconciliation","Compare register & GCash expected totals against physical count"));

  const targetDateIn = el("input", { class: "input", type: "date", value: todayISO(), style: "max-width:200px;", onchange: () => renderReconciliation(root) });
  
  const head = el("div", { class: "section-head" },
    el("div", { style: "display:flex; align-items:center; gap:10px;" }, el("span", { style: "font-weight:600;" }, "Reconciliation Date:"), targetDateIn),
    el("button", { class: "btn btn-brass btn-sm", onclick: () => renderReconciliation(root) }, "↻ Recalculate")
  );
  root.append(head);

  const targetDate = targetDateIn.value;

  const floatObj = (State.data.daily_floats || []).find(f => f.float_date === targetDate);
  const floatCash = floatObj ? Number(floatObj.amount != null ? floatObj.amount : (floatObj.amount_today || 0)) : 0;

  const salesOnDate = (State.data.sales || []).filter(s => isActiveSale(s) && (s.sold_at || s.created_at || "").slice(0,10) === targetDate);
  const cashSales = salesOnDate.filter(s => (s.payment_method || "Cash").toLowerCase() === "cash").reduce((a,s) => a + saleNet(s), 0);
  const gcashSales = salesOnDate.filter(s => (s.payment_method || "").toLowerCase() === "gcash").reduce((a,s) => a + saleNet(s), 0);

  const expsOnDate = (State.data.expenses || []).filter(e => (e.spent_at || e.created_at || "").slice(0,10) === targetDate && (e.status || "approved") !== "pending");
  const cashExps = expsOnDate.filter(e => (e.source || "Business").toLowerCase() === "business").reduce((a,e) => a + Number(e.amount || 0), 0);
  const gcashExps = expsOnDate.filter(e => (e.source || "").toLowerCase() === "gcash").reduce((a,e) => a + Number(e.amount || 0), 0);

  const expectedCashInRegister = (cashSales + floatCash) - cashExps;

  let actualCashInRegister = expectedCashInRegister;
  let gcashYesterday = 0;
  let gcashTodayActual = (gcashYesterday + gcashSales) - gcashExps;

  const actualCashInput = el("input", { class: "input", type: "number", step: "0.01", value: actualCashInRegister, oninput: (e) => updateReconResults() });
  const gcashYesterdayInput = el("input", { class: "input", type: "number", step: "0.01", value: 0, oninput: (e) => updateReconResults() });
  const gcashActualInput = el("input", { class: "input", type: "number", step: "0.01", value: gcashTodayActual, oninput: (e) => updateReconResults() });

  const grid = el("div", { class: "recon-grid" });

  const cashBox = el("div", { class: "recon-box cash-box" },
    el("h3", { style: "color:var(--sage); margin-bottom:14px;" }, "💵 CASH RECONCILIATION"),
    el("div", { class: "recon-row" }, el("span", {}, "a. Cash Float of the Day"), el("span", { class: "mono" }, peso(floatCash))),
    el("div", { class: "recon-row" }, el("span", {}, "b. Total Cash Sales Logged"), el("span", { class: "mono", style: "color:var(--sage)" }, "+" + peso(cashSales))),
    el("div", { class: "recon-row" }, el("span", {}, "c. Total Cash Expenses Logged"), el("span", { class: "mono", style: "color:var(--clay)" }, "−" + peso(cashExps))),
    el("div", { class: "recon-row total" }, el("span", {}, "Expected Cash in Till"), el("span", { class: "mono", id: "expCashVal" }, peso(expectedCashInRegister))),
    el("div", { style: "margin-top:14px;" }, field("d. Actual Cash Count in Register (Manual)", actualCashInput)),
    el("div", { id: "cashMatchTag", style: "margin-top:10px;" })
  );

  const gcashBox = el("div", { class: "recon-box gcash-box" },
    el("h3", { style: "color:#1d6fb8; margin-bottom:14px;" }, "📱 GCASH RECONCILIATION"),
    el("div", {}, field("a. Money in GCash Opening", gcashYesterdayInput)),
    el("div", { class: "recon-row" }, el("span", {}, "b. Total GCash Sales Logged"), el("span", { class: "mono", style: "color:var(--sage)" }, "+" + peso(gcashSales))),
    el("div", { class: "recon-row" }, el("span", {}, "c. Total GCash Expenses Logged"), el("span", { class: "mono", style: "color:var(--clay)" }, "−" + peso(gcashExps))),
    el("div", { class: "recon-row total" }, el("span", {}, "Expected GCash Balance"), el("span", { class: "mono", id: "expGCashVal" }, peso(gcashSales - gcashExps))),
    el("div", { style: "margin-top:14px;" }, field("d. Actual GCash Balance Today", gcashActualInput)),
    el("div", { id: "gcashMatchTag", style: "margin-top:10px;" })
  );

  grid.append(cashBox, gcashBox);
  root.append(grid);

  function updateReconResults() {
    const actCash = parseFloat(actualCashInput.value) || 0;
    const expCash = expectedCashInRegister;
    const diffCash = actCash - expCash;

    const cashTag = $("#cashMatchTag");
    cashTag.innerHTML = "";
    if (Math.abs(diffCash) < 0.01) {
      cashTag.append(el("span", { class: "tag match" }, "✓ MATCHES PERFECTLY"));
    } else if (diffCash > 0) {
      cashTag.append(el("span", { class: "tag mismatch" }, `OVER BY ${peso(diffCash)}`));
    } else {
      cashTag.append(el("span", { class: "tag mismatch" }, `SHORT BY ${peso(Math.abs(diffCash))}`));
    }

    const gYest = parseFloat(gcashYesterdayInput.value) || 0;
    const expGCash = (gYest + gcashSales) - gcashExps;
    $("#expGCashVal").textContent = peso(expGCash);

    const actGCash = parseFloat(gcashActualInput.value) || 0;
    const diffGCash = actGCash - expGCash;

    const gcashTag = $("#gcashMatchTag");
    gcashTag.innerHTML = "";
    if (Math.abs(diffGCash) < 0.01) {
      gcashTag.append(el("span", { class: "tag match" }, "✓ MATCHES PERFECTLY"));
    } else if (diffGCash > 0) {
      gcashTag.append(el("span", { class: "tag mismatch" }, `OVER BY ${peso(diffGCash)}`));
    } else {
      gcashTag.append(el("span", { class: "tag mismatch" }, `SHORT BY ${peso(Math.abs(diffGCash))}`));
    }
  }

  updateReconResults();
}

   PAYROLL & SCHEDULE SHEET (With "PAID" Confirmation & Dispute Edits)
   ============================================================ */
let ACTIVE_PAY_PERIOD_ID = null;

function renderPayrollSheet(root) {
  if (!isOwner()) {
    root.append(el("div", { class: "notice" }, "🔒 Owner PIN Required to view Payroll & Pay Schedule."));
    return;
  }

  root.append(topbar("Payroll & Pay Schedule Sheet", "Calculate regular hours, dispute corrections, and confirm payroll payout as Salary expense"));

  const periods = State.data.pay_periods || [];
  const roster = State.data.staff_roster || [];
  const shifts = State.data.shifts || [];
  const payrollRuns = State.data.payroll_runs || [];

  if (!periods.length && !ACTIVE_PAY_PERIOD_ID) {
    ACTIVE_PAY_PERIOD_ID = "custom";
  } else if (!ACTIVE_PAY_PERIOD_ID && periods.length) {
    ACTIVE_PAY_PERIOD_ID = periods[0].id;
  }

  const periodSel = el("select", { class: "input", style: "max-width:280px;", onchange: (e) => { ACTIVE_PAY_PERIOD_ID = e.target.value; go("payroll"); }});
  periods.forEach(p => {
    periodSel.append(el("option", { value: p.id, selected: ACTIVE_PAY_PERIOD_ID === p.id }, `${p.period_name} (${p.start_date} to ${p.end_date})`));
  });
  periodSel.append(el("option", { value: "custom", selected: ACTIVE_PAY_PERIOD_ID === "custom" }, "Create New Pay Period..."));

  const head = el("div", { class: "section-head" },
    el("div", { style: "display:flex; align-items:center; gap:10px;" }, el("span", { style: "font-weight:600;" }, "Active Pay Period:"), periodSel),
    el("button", { class: "btn btn-ghost btn-sm", onclick: () => createPayPeriodModal() }, "＋ Add Period")
  );
  root.append(head);

  if (ACTIVE_PAY_PERIOD_ID === "custom") {
    root.append(el("div", { class: "empty" }, "Select or create a Pay Period to generate the payroll run."));
    return;
  }

  const activePeriod = periods.find(p => p.id === ACTIVE_PAY_PERIOD_ID);
  if (!activePeriod) return;

  const tw = el("div", { class: "tbl-wrap card", style: "padding:0; overflow:hidden;" });
  const t = el("table");
  t.append(el("thead", {}, el("tr", {},
    el("th", {}, "Employee"),
    el("th", { class: "num" }, "Reg Hrs"),
    el("th", { class: "num" }, "Late/Undertime"),
    el("th", { class: "num" }, "OT Hrs"),
    el("th", { class: "num" }, "Gross Pay"),
    el("th", {}, "Status / Payout")
  )));

  const tb = el("tbody");
  let totalPayrollOut = 0;

  const pStart = new Date(activePeriod.start_date + "T00:00:00");
  const pEnd = new Date(activePeriod.end_date + "T23:59:59");

  roster.forEach(emp => {
    const empShifts = shifts.filter(s => {
      if (s.name !== emp.name || !s.time_out) return false;
      const d = new Date(s.time_in);
      return d >= pStart && d <= pEnd;
    });

    let calcRegHrs = 0;
    let calcLateHrs = 0;
    let calcOtHrs = 0;

    empShifts.forEach(s => {
      const tIn = new Date(s.time_in);
      const tOut = new Date(s.time_out);
      const actualHrs = (tOut - tIn) / 3.6e6;

      const dayOfWeek = tIn.toLocaleDateString('en-US', {weekday: 'long'}).toLowerCase();
      const schedState = (emp.work_schedule || {})[dayOfWeek];

      let schedHrs = 0;
      let isRestDay = true;

      if (schedState && schedState.enabled) {
        isRestDay = false;
        let [sh, sm] = (schedState.start || "00:00").split(':').map(Number);
        let [eh, em] = (schedState.end || "00:00").split(':').map(Number);
        let sDec = sh + sm/60;
        let eDec = eh + em/60;
        if (eDec <= sDec) eDec += 24; 
        schedHrs = eDec - sDec;
      }

      if (isRestDay) {
        calcOtHrs += actualHrs;
      } else {
        if (actualHrs >= schedHrs) {
          calcRegHrs += schedHrs;
          calcOtHrs += (actualHrs - schedHrs);
        } else {
          calcRegHrs += actualHrs;
          calcLateHrs += (schedHrs - actualHrs);
        }
      }
    });

    // Check if payroll run exists for this period & employee
    const existingRun = payrollRuns.find(pr => pr.period_id === activePeriod.id && pr.employee_id === emp.id);
    
    const regHrs = existingRun != null && existingRun.reg_hrs != null ? Number(existingRun.reg_hrs) : calcRegHrs;
    const otHrs = existingRun != null && existingRun.ot_hrs != null ? Number(existingRun.ot_hrs) : calcOtHrs;

    const dailyRate = Number(emp.daily_rate || 0);
    const hourlyRate = dailyRate / 8;
    const otRate = hourlyRate * 1.25;

    const basePay = regHrs * hourlyRate;
    const otPay = otHrs * otRate;
    const grossPay = basePay + otPay;
    
    if (existingRun && existingRun.status === "paid") {
      totalPayrollOut += Number(existingRun.amount_paid || grossPay);
    }

    const payStatusCell = el("td", {});
    if (existingRun && existingRun.status === "paid") {
      payStatusCell.append(el("span", { class: "tag match" }, `✓ PAID (${peso(existingRun.amount_paid)} via ${existingRun.payment_method})`),
        el("button", { class: "iconbtn", style: "margin-left:6px;", title: "Edit / Dispute", onclick: () => openPayrollPayModal(activePeriod, emp, { reg_hrs: regHrs, ot_hrs: otHrs, gross_pay: grossPay }, existingRun) }, "✎")
      );
    } else {
      payStatusCell.append(el("button", { class: "btn btn-brass btn-sm", onclick: () => openPayrollPayModal(activePeriod, emp, { reg_hrs: regHrs, ot_hrs: otHrs, gross_pay: grossPay }, null) }, "💵 Mark Paid / Review"));
    }

    tb.append(el("tr", {},
      el("td", { style: "font-weight:600;" }, emp.name),
      el("td", { class: "num", style: "color:var(--sage);" }, regHrs.toFixed(1) + "h"),
      el("td", { class: "num", style: "color:var(--clay);" }, calcLateHrs > 0 ? calcLateHrs.toFixed(1) + "h" : "—"),
      el("td", { class: "num", style: "color:var(--brass-deep);" }, otHrs > 0 ? otHrs.toFixed(1) + "h" : "—"),
      el("td", { class: "num", style: "font-weight:700;" }, peso(grossPay)),
      payStatusCell
    ));
  });

  t.append(tb);
  t.append(el("tfoot", {}, el("tr", {},
    el("td", { colspan: "5", style: "font-weight:700;" }, "Total Paid Payroll Outlay"),
    el("td", { class: "num", style: "font-weight:700; font-size:16px;" }, peso(totalPayrollOut))
  )));

  tw.append(t);
  root.append(tw);
}

function openPayrollPayModal(period, emp, computed, existingRun) {
  const regHrsIn = el("input", { class: "input", type: "number", step: "0.1", value: existingRun ? existingRun.reg_hrs : computed.reg_hrs });
  const otHrsIn = el("input", { class: "input", type: "number", step: "0.1", value: existingRun ? existingRun.ot_hrs : computed.ot_hrs });
  
  const dailyRate = Number(emp.daily_rate || 0);
  const hourlyRate = dailyRate / 8;
  const otRate = hourlyRate * 1.25;

  const defaultAmt = existingRun ? existingRun.amount_paid : computed.gross_pay;
  const amountIn = el("input", { class: "input", type: "number", step: "0.01", value: defaultAmt });

  let method = existingRun ? existingRun.payment_method : "Cash";
  const payMethodSel = el("select", { class: "input" },
    el("option", { value: "Cash", selected: method === "Cash" }, "Cash"),
    el("option", { value: "GCash", selected: method === "GCash" }, "GCash")
  );

  const dateIn = el("input", { class: "input", type: "date", value: existingRun ? existingRun.payout_date : todayISO() });

  // Recalculate suggested amount when hours change
  regHrsIn.oninput = () => {
    const rh = parseFloat(regHrsIn.value) || 0;
    const oh = parseFloat(otHrsIn.value) || 0;
    amountIn.value = ((rh * hourlyRate) + (oh * otRate)).toFixed(2);
  };
  otHrsIn.oninput = () => {
    const rh = parseFloat(regHrsIn.value) || 0;
    const oh = parseFloat(otHrsIn.value) || 0;
    amountIn.value = ((rh * hourlyRate) + (oh * otRate)).toFixed(2);
  };

  const body = el("div", {},
    el("div", { class: "notice", style: "margin-bottom:12px;" }, `Confirming payout for <b>${emp.name}</b> (${period.period_name}). You can correct hours here if there's a dispute (e.g. changing 80h to 40h).`),
    el("div", { class: "form-row" }, field("Corrected Regular Hours", regHrsIn), field("Corrected OT Hours", otHrsIn)),
    el("div", { class: "form-row" }, field("Amount to Pay (₱)", amountIn), field("Payment Method", payMethodSel)),
    field("Payout Date (Logs as expense on this day)", dateIn)
  );

  openModal({
    title: `Payroll Payout: ${emp.name}`,
    body,
    footer: bk => [
      el("button", { class: "btn btn-ghost", onclick: () => bk.remove() }, "Cancel"),
      el("button", { class: "btn btn-brass", onclick: async () => {
        const amt = parseFloat(amountIn.value) || 0;
        if (amt <= 0) return toast("Enter valid amount", "bad");

        const rh = parseFloat(regHrsIn.value) || 0;
        const oh = parseFloat(otHrsIn.value) || 0;
        const selectedMethod = payMethodSel.value;
        const payoutDate = dateIn.value || todayISO();

        try {
          const runRow = {
            period_id: period.id,
            employee_id: emp.id,
            reg_hrs: rh,
            ot_hrs: oh,
            amount_paid: amt,
            payment_method: selectedMethod,
            payout_date: payoutDate,
            status: "paid"
          };

          if (existingRun) {
            await upd("payroll_runs", existingRun.id, runRow);
          } else {
            await ins("payroll_runs", runRow);
          }

          // Salary expense for reports (the books post salary from payroll_runs, never twice)
          const expenseSource = selectedMethod === "Cash" ? "Business" : "GCash";
          if (!existingRun) await ins("expenses", {
            spent_at: payoutDate,
            supplier: emp.name,
            description: `Salary Payout: ${emp.name} (${period.period_name})`,
            category: "Salary",
            amount: amt,
            expense_type: "Recurring",
            source: expenseSource,
            status: "approved",
            has_receipt: "Yes"
          });

          await Promise.all([refresh("payroll_runs"), refresh("expenses")]);
          bk.remove();
          go("payroll");
          toast("Payroll marked as PAID and logged as Salary expense!", "ok");
        } catch (e) {
          toast(e.message, "bad");
        }
      }}, "Confirm Paid & Log Expense")
    ]
  });
}

async function deductInventory(items, sign){
  const m=ingMap(); const deltas={};
  items.forEach(li=>{const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi)return;
    recipeForLine(mi, li, m).forEach(r=>{
      deltas[r.ingredient_id]=(deltas[r.ingredient_id]||0)+ r.qty*li.qty*sign;
    });});
  for(const id in deltas){const ing=m[id]; if(!ing||ing.stock_qty==null)continue;
    const next=Number(ing.stock_qty)-deltas[id];
    try{await upd("ingredients",id,{stock_qty:next});}catch(_){}}
}

function inRange(dateStr, range){
  const d=new Date(dateStr); const now=new Date();
  if(range==="all")return true;
  if(range==="today")return d.toDateString()===now.toDateString();
  const days=parseInt(range); return (now-d) <= days*864e5;
}
