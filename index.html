<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>buhat Admin</title>
<meta name="theme-color" content="#121314">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --onyx:#121314; --bg:#161719; --card:#1f2022; --card2:#26272a; --smoke:#36373a; --line:#2c2d30;
  --ivory:#F4F1EA; --muted:#B9B4AA; --dim:#8f8b83;
  --brass:#B8955B; --brass-hi:#cfae76; --good:#6ee59b; --warn:#e8b65c; --bad:#ef8a73; --info:#8fb8e8;
  --disp:'Fraunces',Georgia,serif; --ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Spline Sans Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ivory);font:15.5px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hide{display:none!important}
h1,h2,h3{font-family:var(--disp);font-weight:500;margin:0;letter-spacing:-.01em;color:var(--ivory)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .mono{font-family:var(--mono)}

/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--smoke);background:var(--card2);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;color:var(--ivory)}
.btn:hover{border-color:var(--brass)}
.btn.btn-brass{background:var(--brass);border-color:var(--brass);color:var(--onyx)}
.btn-brass:hover{background:var(--brass-hi)}
.btn-danger{color:var(--bad)} .btn-danger:hover{border-color:var(--bad)}
.btn-sm{min-height:32px;padding:4px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--smoke);background:var(--onyx);min-height:42px}
.in:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,149,91,.22)}
label.f{display:block} label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(110% 70% at 50% -10%,#1f2022 0%,var(--onyx) 60%)}
.login .box{width:min(400px,100%);background:var(--card);border:1px solid var(--smoke);border-radius:20px;padding:30px 26px}
.login .logo{display:flex;justify-content:center;margin-bottom:4px} .login .logo svg{height:52px;width:auto}
.login p.tag{text-align:center;color:var(--muted);margin:0 0 20px;font-size:14px}
.login .f{margin-top:12px}
.login .btn{width:100%;margin-top:18px;min-height:46px}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin-top:10px}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100dvh}
aside{background:var(--onyx);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100dvh}
aside .logo svg{height:38px;width:auto}
.side-label{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 8px 6px;font-weight:600}
.app-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;cursor:pointer}
.app-btn .ai{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--card2);font-size:17px;flex:none}
.app-btn b{display:block;font-weight:600;font-size:14.5px} .app-btn small{color:var(--dim);font-size:12.5px}
.app-btn.on{background:var(--card);border-color:var(--smoke)}
.app-btn:disabled{cursor:default;opacity:.6}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs button{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;font-weight:500}
.tabs button:hover{color:var(--ivory);background:var(--card)}
.tabs button.on{background:var(--brass);color:var(--onyx);font-weight:600}
.tabs .count{font-size:12px;background:rgba(239,138,115,.18);color:var(--bad);border-radius:999px;padding:1px 8px;font-weight:700}
.tabs button.on .count{background:rgba(18,19,20,.2);color:var(--onyx)}
.side-foot{margin-top:auto;font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:8px}
.side-foot .btn{width:100%}
main{padding:28px 32px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:32px}
.top .crumb{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:4px}
.mtop{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card+.card{margin-top:16px}
.kpis .card,.two .card{margin-top:0}
.two{margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:26px;margin-top:6px}
.kpi .s{font-size:13px;color:var(--dim);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--card2)}
.name b{display:block;font-weight:600} .name small{color:var(--dim)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-good{background:rgba(110,229,155,.13);color:var(--good)} .p-warn{background:rgba(232,182,92,.15);color:var(--warn)}
.p-bad{background:rgba(239,138,115,.15);color:var(--bad)} .p-info{background:rgba(143,184,232,.14);color:var(--info)} .p-dim{background:var(--card2);color:var(--muted)}
.empty{color:var(--dim);padding:18px 4px;text-align:center}
.row-act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.code{font-family:var(--mono);font-size:15px;letter-spacing:.04em;background:var(--onyx);border:1px solid var(--smoke);padding:3px 9px;border-radius:7px}

/* toggle */
.seg{display:inline-flex;background:var(--onyx);border:1px solid var(--smoke);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--card2);color:var(--ivory);box-shadow:inset 0 0 0 1px var(--smoke)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--smoke);z-index:41;overflow-y:auto;padding:22px 22px 40px}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.drawer h2{font-size:26px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border:1px solid var(--smoke);border-radius:18px;padding:22px;z-index:51}
.modal h3{font-size:21px;margin-bottom:10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-scrim{z-index:50}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ivory);color:var(--onyx);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad)}
.newcode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(184,149,91,.1);border:1px solid rgba(184,149,91,.4);border-radius:12px;padding:12px 14px;margin-top:14px}
.newcode .code{font-size:20px}
.sec{margin-top:22px} .sec>h3{font-size:18px;margin-bottom:10px}
.note{font-size:13.5px;color:var(--dim);margin-top:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--smoke);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* support + feedback + plans */
.sup{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.threads .th{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer}
.threads .th:hover{background:var(--card2)} .threads .th.on{background:var(--card2);border-color:var(--smoke)}
.threads .th b{display:flex;justify-content:space-between;gap:8px} .threads .th small{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:10px;height:min(60vh,560px);overflow-y:auto;padding:4px 2px 10px}
.bub{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.bub.cafe{align-self:flex-start;background:var(--card2);border:1px solid var(--smoke);border-bottom-left-radius:4px}
.bub.buhat{align-self:flex-end;background:var(--brass);color:var(--onyx);border-bottom-right-radius:4px}
.bub .m{font-size:11.5px;opacity:.75;margin-top:3px}
.compose{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.compose textarea{flex:1;resize:vertical;min-height:44px}
.fb{padding:14px 0;border-bottom:1px solid var(--line)} .fb:last-child{border-bottom:0}
.fb .top-l{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.fb p{margin:8px 0 0;white-space:pre-wrap}
.st{color:#e0a526;letter-spacing:1px}
.feat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.feat-row:last-child{border-bottom:0}
.feat-row small{display:block;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--smoke);background:var(--onyx);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chipb.on{background:var(--ivory);color:var(--onyx);border-color:var(--ivory)}
@media(max-width:860px){.sup{grid-template-columns:1fr}}
@media(max-width:1000px){ .kpis{grid-template-columns:1fr 1fr} .two{grid-template-columns:1fr} }
@media(max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{min-width:0}
  .side-foot .btn{width:auto;flex:1}
  aside{position:static;height:auto;padding:12px 14px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  aside .apps,aside .side-label,.side-foot .who{display:none}
  aside .logo{display:none}
  .tabs{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .tabs button{white-space:nowrap;gap:6px}
  .side-foot{margin-top:0;flex-direction:row}
  .mtop{display:flex;justify-content:space-between;align-items:center}
  .mtop svg{height:30px;width:auto}
  main{padding:18px 16px 48px}
  .top h1{font-size:26px}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpi .v{font-size:21px}
  .hide-m{display:none}
}
</style>
</head>
<body>

<div id="loginView" class="login hide">
  <form class="box" id="loginForm">
    <div class="logo" data-logo></div>
    <p class="tag">Admin</p>
    <label class="f"><span>Email</span><input class="in" id="lEmail" type="email" autocomplete="username" required></label>
    <label class="f"><span>Password</span><input class="in" id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-brass" id="lBtn" type="submit">Log in</button>
    <div class="err" id="lErr" role="alert"></div>
  </form>
</div>

<div id="loadingView" class="login"><span class="spin" aria-label="Loading"></span></div>

<div id="appView" class="shell hide">
  <aside>
    <div class="mtop"><span data-logo></span><button class="btn btn-sm" id="mSignOut">Sign out</button></div>
    <div class="logo" data-logo></div>
    <div class="apps">
      <p class="side-label">Systems</p>
      <button class="app-btn on" type="button"><span class="ai">☕</span><span><b>buhat Café</b><small>cafe.buhat.co</small></span></button>
      <button class="app-btn" type="button" disabled title="Your next system will show up here"><span class="ai">＋</span><span><b>Next system</b><small>Coming later</small></span></button>
    </div>
    <div>
      <p class="side-label">Café system</p>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="side-foot">
      <span class="who" id="who"></span>
      <a class="btn btn-sm" href="https://cafe.buhat.co" target="_blank" rel="noopener">Open café app ↗</a>
      <button class="btn btn-sm hide-m" id="signOut">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

function el(tag, attrs={}, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") n.className=v; else if(k==="style") n.style.cssText=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(k==="html") n.innerHTML=v; else n.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}
async function rpc(name, args){ const {data,error}=await sb.rpc(name, args||{}); if(error) throw new Error(error.message); return data; }

const fmtDT = d => d ? new Date(d).toLocaleString("en-PH",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
function ago(d){ if(!d) return "never"; const s=(Date.now()-new Date(d))/1000; if(s<90) return "just now"; if(s<3600) return Math.round(s/60)+" min ago"; if(s<86400) return Math.round(s/3600)+" h ago"; const dd=Math.round(s/86400); return dd===1?"yesterday":dd+" days ago"; }
const todayISO = () => new Date().toLocaleDateString("en-CA",{timeZone:TZ});
function daysUntil(iso){ if(!iso) return null; return Math.round((new Date(iso+"T00:00:00+08:00") - new Date(todayISO()+"T00:00:00+08:00"))/86400000); }

function planPill(c){
  if(c.is_mugna) return el("span",{class:"pill p-info"},"Pro · yours");
  const b=c.billing||{};
  if(b.plan==="beta"){ const d=daysUntil(b.beta_until); return el("span",{class:"pill "+(d!=null&&d<=30?"p-warn":"p-info")}, d==null?"Beta":d<0?"Beta ended":`Beta · ${d}d left`); }

  return el("span",{class:"pill p-dim"},"Free");
}
function dueState(c){
  if(!paying(c)) return null;
  const d=daysUntil(c.billing.next_due);
  if(d==null) return {cls:"p-dim",txt:"No due date",d:null};
  if(d<0) return {cls:"p-bad",txt:`Overdue ${-d}d`,d};
  if(d<=7) return {cls:"p-warn",txt:d===0?"Due today":`Due in ${d}d`,d};
  return {cls:"p-good",txt:`Due ${fmtDate(c.billing.next_due)}`,d};
}

function paymentModal(c){
  const b=c.billing||{};
  const kind=el("select",{class:"in"}, el("option",{value:"monthly"},"Monthly fee"), el("option",{value:"setup"},"Setup fee"), el("option",{value:"other"},"Other"));
  const months=el("input",{class:"in",type:"number",min:"1",max:"24",value:"1"});
  const amount=el("input",{class:"in",type:"number",min:"0",step:"1",value:b.monthly_fee||""});
  const paid=el("input",{class:"in",type:"date",value:todayISO()});
  const method=el("select",{class:"in"}, ...["GCash","Bank transfer","Cash","Maya","Other"].map(m=>el("option",{},m)));
  const note=el("input",{class:"in",placeholder:"Reference no. or note (optional)"});
  const mWrap=el("label",{class:"f"},el("span",{},"Months covered"),months);
  const sync=()=>{ mWrap.classList.toggle("hide",kind.value!=="monthly");
    if(kind.value==="monthly") amount.value=Number(b.monthly_fee||0)*Number(months.value||1)||amount.value;
    if(kind.value==="setup") amount.value=b.setup_fee||amount.value; };
  kind.onchange=sync; months.oninput=sync;
  const preview=el("p",{class:"note"});
  const pv=()=>{ if(kind.value!=="monthly"){ preview.textContent=""; return; }
    const base=b.next_due||paid.value; if(!base){ preview.textContent=""; return; }
    const d=new Date(base+"T00:00:00+08:00"); d.setMonth(d.getMonth()+Number(months.value||1));
    preview.textContent="Next due date becomes "+d.toLocaleDateString("en-PH",{timeZone:TZ,month:"short",day:"numeric",year:"numeric"})+"."; };
  [kind,months,paid].forEach(i=>i.addEventListener("input",pv)); kind.addEventListener("change",pv); pv();
  openModal(`Payment from ${c.display_name}`, el("div",{style:"display:grid;gap:12px"},
    el("div",{class:"grid2"}, el("label",{class:"f"},el("span",{},"For"),kind), mWrap),
    el("div",{class:"grid2"}, el("label",{class:"f"},el("span",{},"Amount (₱)"),amount), el("label",{class:"f"},el("span",{},"Paid on"),paid)),
    el("div",{class:"grid2"}, el("label",{class:"f"},el("span",{},"Paid via"),method), el("label",{class:"f"},el("span",{},"Note"),note)), preview),
    close=>[el("button",{class:"btn",onclick:close},"Cancel"), el("button",{class:"btn btn-brass",onclick:async e=>{
      if(amount.value==="" || Number(amount.value)<0) return toast("Enter the amount","bad");
      e.target.disabled=true;
      const r=await act("admin_payment_add",{p_cafe:c.id,p_kind:kind.value,p_amount:Number(amount.value),p_months:Number(months.value||1),
        p_paid_on:paid.value||null,p_method:method.value,p_note:note.value||null},"Payment recorded");
      if(r) close(); else e.target.disabled=false; }},"Record payment")]);
}

    el("b",{}, el("span",{},t.cafe), t.unread?el("span",{class:"pill p-bad"},t.unread):el("span",{class:"dim",style:"font-weight:400;font-size:12.5px"},ago(t.last_at))),
    el("small",{}, (t.last_sender==="buhat"?"You: ":"")+t.last))));

    const send=el("button",{class:"btn btn-brass",onclick:async()=>{ const v=box.value.trim(); if(!v) return; send.disabled=true;
      try{ const r=await rpc("admin_support_reply",{p_cafe:c.id,p_body:v}); if(r&&r.ok){ box.value=""; await drawThread(); } else toast((r&&r.error)||"Couldn't send","bad"); }
      catch(e){ toast(e.message,"bad"); } send.disabled=false; box.focus(); }},"Send");
    box.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send.click(); } });
    right.append(chat, el("div",{class:"compose"}, box, send), el("p",{class:"note"},"They see your reply in the app (Help → Chat with buhat). You can also reply from Telegram by replying to their message."));
    async function drawThread(){
