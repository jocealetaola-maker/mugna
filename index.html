<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#241a15" />
  <title>Mugnâ · Café Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --paper: #f3ede1;
      --paper-2: #e9dfca;
      --card: #fffdf8;
      --ink: #241a15;
      --bean: #6b4a35;
      --bean-soft: #a98a73;
      --brass: #d35e2a;
      --brass-deep: #b54a1c;
      --sage: #5e7350;
      --sage-soft: #e7eede;
      --clay: #9e3a2b;
      --clay-soft: #f1ddd5;
      --line: #e2d4bd;
      --line-soft: #efe5d2;
      --radius: 16px;
      --radius-sm: 10px;
      --mono: 'Spline Sans Mono', ui-monospace, Menlo, monospace;
      --ui: 'Hanken Grotesk', system-ui, -apple-system, Segoe UI, sans-serif;
      --disp: 'Fraunces', Georgia, serif;
      --shadow: 0 1px 2px rgba(36,26,21,.06), 0 10px 24px rgba(36,26,21,.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--ui);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
      font-size: 15px;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, h4 { margin: 0; font-family: var(--disp); font-weight: 500; letter-spacing: -0.02em; }
    a { color: var(--brass-deep); }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .hide { display: none !important; }
    .muted { color: var(--bean); }

    .auth-wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(120% 90% at 50% -10%, #2f221b 0%, #241a15 55%, #1b130f 100%);
      color: var(--paper);
    }

    .auth-card {
      width: min(460px, 100%);
      background: var(--card);
      color: var(--ink);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 28px 60px rgba(0,0,0,.35);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand-cup {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(36,26,21,.12);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .brand-cup svg {
      width: 78%;
      height: 78%;
      display: block;
    }

    .brand-name {
      font-family: var(--disp);
      font-size: 30px;
      line-height: 1;
    }

    .brand-sub {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--bean);
      margin-top: 2px;
    }

    .auth-card h2 { font-size: 22px; margin: 18px 0 6px; }
    .auth-card p { margin: 0 0 14px; color: var(--bean); }

    .access-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      outline: none;
    }

    .input:focus {
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(211,94,42,.2);
    }

    label.fld { display: block; margin: 14px 0 0; }
    label.fld > span {
      display: block;
      margin-bottom: 6px;
      color: var(--bean);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 11px 16px;
      background: var(--paper-2);
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
      transition: filter .12s ease;
    }
    .btn:hover { filter: brightness(.98); }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--ink); color: var(--paper); }
    .btn-brass { background: var(--brass); color: #fff; }
    .btn-ghost { background: transparent; border-color: var(--line); }
    .btn-danger { background: var(--clay-soft); color: var(--clay); border-color: #eccabe; }
    .btn-sm { padding: 8px 10px; font-size: 12.5px; border-radius: 999px; }

    .err { color: var(--clay); font-size: 13px; min-height: 1em; margin-top: 10px; }

    .app-shell {
      display: none;
    }
    .app-shell.show { display: block; }

    .topbar {
      background: var(--ink);
      color: var(--paper);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .topbar .brand-name {
      color: var(--paper);
      font-size: 20px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: var(--paper);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 22px 72px;
    }

    .group-card {
      margin-bottom: 18px;
      background: transparent;
      border: none;
      padding: 0;
    }

    .category-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .category-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 14px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
    }
    .category-head:hover { background: rgba(36,26,21,.015); }
    .category-head .big-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 30px;
      background: var(--paper-2);
    }
    .category-head h2 {
      flex: 1;
      font-size: 24px;
    }
    .category-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 14px;
      padding: 0 18px 18px;
    }

    .tile {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
      padding: 16px 12px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      min-height: 134px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .tile:hover { box-shadow: 0 8px 18px rgba(36,26,21,.10); }
    .tile .ico { font-size: 28px; }
    .tile .label {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.2;
    }

    .staff-home {
      display: grid;
      gap: 18px;
    }

    .staff-banner {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .staff-banner h2 { font-size: 26px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .card h3 { font-size: 18px; margin-bottom: 10px; }

    .stack { display: grid; gap: 18px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .kpi {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .kpi .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--bean);
      font-weight: 700;
    }
    .kpi .val {
      font-family: var(--mono);
      font-size: 28px;
      margin-top: 6px;
      font-weight: 600;
    }
    .kpi .val.in { color: var(--sage); }
    .kpi .val.out { color: var(--clay); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 10px 10px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: middle;
    }
    th {
      color: var(--bean);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--ink); }
    td.num, th.num { text-align: right; font-family: var(--mono); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .segmented {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .segmented button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--bean);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 13px;
    }
    .segmented button.on {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .mini {
      font-size: 12.5px;
      color: var(--bean);
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--paper-2);
      border: 1px solid var(--line);
    }

    .recon-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 16px;
    }
    @media (max-width: 800px) {
      .recon-grid { grid-template-columns: 1fr; }
      .access-grid { grid-template-columns: 1fr; }
      .main { padding: 18px 14px 72px; }
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid transparent;
    }
    .status-tag.match { background: var(--sage-soft); color: var(--sage); border-color: rgba(94,115,80,.18); }
    .status-tag.short { background: var(--clay-soft); color: var(--clay); border-color: rgba(158,58,43,.14); }
    .status-tag.over { background: #fff1d8; color: #8b5b14; border-color: rgba(185,126,42,.2); }

    .notice {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--bean);
      font-size: 13px;
    }

    .modals { position: fixed; inset: 0; z-index: 100; display: none; }
    .modals.show { display: block; }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(27,19,15,.55);
      backdrop-filter: blur(2px);
    }
    .modal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(640px, calc(100% - 24px));
      max-height: 90vh;
      overflow: auto;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 20px 65px rgba(0,0,0,.35);
      border: 1px solid var(--line);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 8px;
    }
    .modal-body { padding: 8px 20px 20px; }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 20px 18px;
      background: rgba(255,255,255,.15);
    }
    .modal-close {
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--paper-2);
      color: var(--bean);
      font-size: 17px;
    }

    .toasts {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
      pointer-events: none;
    }
    .toast {
      min-width: 180px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13.5px;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      opacity: 1;
      transition: opacity .2s ease;
    }
    .toast.ok { background: var(--sage); }
    .toast.bad { background: var(--clay); }

    .hidden-input { display: none; }
  </style>
</head>
<body>
  <div id="authView" class="auth-wrap">
    <div class="auth-card">
      <div class="brand-mark">
        <div class="brand-cup">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 17h24v16c0 5.5-4.5 10-10 10H22c-5.5 0-10-4.5-10-10V17zm3 0V11c0-1.7 1.3-3 3-3h10c1.7 0 3 1.3 3 3v6M16 24h16" fill="none" stroke="#241a15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 17h22c.6 0 1 .4 1 1v2H12v-2c0-.6.4-1 1-1Z" fill="#d35e2a" opacity=".9"/>
          </svg>
        </div>
        <div>
          <div id="brandName" class="brand-name">Mugnâ</div>
          <div class="brand-sub">Café</div>
        </div>
      </div>
      <div id="authContent"></div>
    </div>
  </div>

  <div id="appView" class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-cup" style="width:34px;height:34px;border-radius:10px;">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 17h24v16c0 5.5-4.5 10-10 10H22c-5.5 0-10-4.5-10-10V17zm3 0V11c0-1.7 1.3-3 3-3h10c1.7 0 3 1.3 3 3v6M16 24h16" fill="none" stroke="#fffdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 17h22c.6 0 1 .4 1 1v2H12v-2c0-.6.4-1 1-1Z" fill="#d35e2a" opacity=".9"/>
          </svg>
        </div>
        <div id="appBrandName" class="brand-name">Mugnâ</div>
      </div>
      <div class="nav-actions">
        <button class="pill-btn" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <main class="main" id="mainContent"></main>
  </div>

  <div id="modalRoot" class="modals"></div>
  <div id="toasts" class="toasts"></div>

  <script>
    const SUPABASE_URL = 'https://vnztvasfojliizflrnix.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuenR2YXNmb2psaWl6Zmxybml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDQ4NjAsImV4cCI6MjA5NjkyMDg2MH0.ec2qhBYO58i9I5J0wF0M7Wm6ef_fEAP7LjzuvIApW7M';
    const CONFIGURED = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON.includes('YOUR-ANON');

    let sb = null;
    if (CONFIGURED) {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    }

    const State = {
      role: null,
      user: null,
      staff: null,
      settings: {
        business_name: 'Mugnâ Café',
        logo_url: '',
        bonus_pool_pct: 10,
        sales_timeframe: 'weekly',
      },
      data: {
        sales: [],
        expenses: [],
        staff_roster: [],
        daily_floats: [],
        daily_reconciliation: [],
        settings: [],
      },
      range: 'week',
      customStart: '',
      customEnd: '',
      categoryOpen: {
        sales: true,
        shop: false,
        owners: false,
      },
      shiftActive: false,
    };

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([key, value]) => {
        if (key === 'class') node.className = value;
        else if (key === 'html') node.innerHTML = value;
        else if (key.startsWith('on') && typeof value === 'function') node[key] = value;
        else if (key === 'style' && typeof value === 'object') Object.assign(node.style, value);
        else if (key === 'value') node.value = value;
        else node.setAttribute(key, value);
      });
      children.filter(Boolean).forEach(child => node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child));
      return node;
    }

    function money(n) {
      const val = Number(n || 0);
      return '₱' + val.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function num(n) {
      return Number(n || 0);
    }

    function fmtDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      if (Number.isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function firstDayOfWeek(date = new Date()) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      d.setDate(diff);
      d.setHours(0,0,0,0);
      return d;
    }

    function lastDayOfWeek(date = new Date()) {
      const d = firstDayOfWeek(date);
      d.setDate(d.getDate() + 6);
      d.setHours(23,59,59,999);
      return d;
    }

    function monthStart(date = new Date()) {
      const d = new Date(date);
      d.setDate(1); d.setHours(0,0,0,0);
      return d;
    }

    function toast(msg, kind = 'ok') {
      const wrap = $('#toasts');
      const t = el('div', { class: `toast ${kind}` }, msg);
      wrap.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; }, 2200);
      setTimeout(() => t.remove(), 2600);
    }

    function showAuthChoice() {
      const auth = $('#authContent');
      auth.innerHTML = '';
      auth.append(
        el('div', {},
          el('h2', {}, 'Welcome'),
          el('p', {}, 'Choose how you want to sign in.'),
          el('div', { class: 'access-grid' },
            el('button', { class: 'btn btn-primary btn-block', onClick: () => { State.role = 'owner'; renderOwnerLogin(); } }, 'Owner'),
            el('button', { class: 'btn btn-brass btn-block', onClick: () => { State.role = 'staff'; renderStaffLogin(); } }, 'Staff')
          )
        )
      );
    }

    function renderOwnerLogin() {
      const auth = $('#authContent');
      auth.innerHTML = '';
      const emailIn = el('input', { class: 'input', type: 'email', placeholder: 'owner@mugna.coffee' });
      const passIn = el('input', { class: 'input', type: 'password', placeholder: '••••••••' });
      const err = el('div', { class: 'err' });

      auth.append(
        el('div', {},
          el('h2', {}, 'Owner login'),
          el('p', {}, 'Access private reports, payroll, settings, and staff roster.'),
          el('label', { class: 'fld' }, el('span', {}, 'Email'), emailIn),
          el('label', { class: 'fld' }, el('span', {}, 'Password'), passIn),
          err,
          el('div', { style: { display: 'flex', gap: '10px', marginTop: '18px' } },
            el('button', { class: 'btn btn-ghost btn-block', onClick: () => { State.role = null; showAuthChoice(); } }, 'Back'),
            el('button', { class: 'btn btn-primary btn-block', onClick: async () => {
              err.textContent = '';
              try {
                if (!sb) throw new Error('Supabase is not configured.');
                const { data, error } = await sb.auth.signInWithPassword({
                  email: emailIn.value.trim(),
                  password: passIn.value,
                });
                if (error) throw error;
                State.user = data.user;
                State.role = 'owner';
                await loadAll();
                showApp();
              } catch (e) {
                err.textContent = e.message || 'Unable to sign in.';
              }
            } }, 'Sign in')
          )
        )
      );
    }

    async function loadStaffRoster() {
      if (!sb) return [];
      const { data, error } = await sb.from('staff_roster').select('*').order('name', { ascending: true });
      if (error) return [];
      return data || [];
    }

    async function loadSettings() {
      if (!sb) return State.settings;
      const { data } = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
      if (data && data.config) {
        State.settings = {
          business_name: data.business_name || 'Mugnâ Café',
          logo_url: data.config.logo_url || '',
          bonus_pool_pct: Number(data.config.bonus_pool_pct || 10),
          sales_timeframe: data.config.sales_timeframe || 'weekly',
        };
      }
      return State.settings;
    }

    async function loadAll() {
      State.data.staff_roster = await loadStaffRoster();
      await loadSettings();
      if (!sb) {
        State.data.sales = [

    function dayRangeLabel() {
      const today = new Date();
      if (State.range === 'today') return 'Today';
      if (State.range === 'week') return `Week of ${firstDayOfWeek(today).toLocaleDateString('en-PH', { month: 'short', day: 'numeric' })}`;
      if (State.range === 'month') return `Month of ${new Date(today.getFullYear(), today.getMonth(), 1).toLocaleDateString('en-PH', { month: 'short', year: 'numeric' })}`;
      if (State.range === 'custom') return `Custom range`;
      return 'All time';
    }

    function filterSalesForRange(list) {
      const now = new Date();
      let start = null;
      let end = null;
      if (State.range === 'today') {
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      } else if (State.range === 'week') {
        start = firstDayOfWeek(now);
        end = lastDayOfWeek(now);
      } else if (State.range === 'month') {
        start = monthStart(now);
        end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23,59,59,999);
      } else if (State.range === 'custom') {
        start = State.customStart ? new Date(`${State.customStart}T00:00:00`) : null;
        end = State.customEnd ? new Date(`${State.customEnd}T23:59:59`) : null;
      }

      return list.filter(item => {
        const d = item.sold_at ? new Date(item.sold_at) : new Date();
        if (start && d < start) return false;
        if (end && d > end) return false;
        return true;
      });
    }

    function filterExpensesForRange(list) {
      const now = new Date();
      let start = null;
      let end = null;
      if (State.range === 'today') {
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
      } else if (State.range === 'week') {
        start = firstDayOfWeek(now);
        end = lastDayOfWeek(now);
      } else if (State.range === 'month') {
        start = monthStart(now);
        end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23,59,59,999);
      } else if (State.range === 'custom') {
        start = State.customStart ? new Date(`${State.customStart}T00:00:00`) : null;
        end = State.customEnd ? new Date(`${State.customEnd}T23:59:59`) : null;
      }

      return list.filter(item => {
        const d = item.spent_at ? new Date(item.spent_at) : new Date();
        if (start && d < start) return false;
        if (end && d > end) return false;
        return true;
      });
    }

    function renderReconciliation(root) {
      const floats = State.data.daily_floats || [];
      const current = floats[0] || { float_date: todayISO(), cash_float_start: 500, cash_float_end: 500, gcash_float_start: 0, gcash_float_end: 0 };
      const cashSales = (State.data.sales || []).filter(row => row.payment_method === 'Cash' && row.sold_at && row.sold_at.slice(0, 10) === todayISO()).reduce((a, b) => a + num(b.total), 0);
      const cashExpenses = (State.data.expenses || []).filter(row => row.payment_method === 'Cash' && row.spent_at === todayISO()).reduce((a, b) => a + num(b.amount), 0);
      const gcashSales = (State.data.sales || []).filter(row => row.payment_method === 'GCash' && row.sold_at && row.sold_at.slice(0, 10) === todayISO()).reduce((a, b) => a + num(b.total), 0);
      const gcashExpenses = (State.data.expenses || []).filter(row => row.payment_method === 'GCash' && row.spent_at === todayISO()).reduce((a, b) => a + num(b.amount), 0);

      const cashExpected = current.cash_float_start + cashSales - cashExpenses;
      const gcashExpected = current.gcash_float_start + gcashSales - gcashExpenses;
      const cashVariance = num(current.cash_float_end) - cashExpected;
      const gcashVariance = num(current.gcash_float_end) - gcashExpected;
      const cashStatus = Math.abs(cashVariance) < 0.01 ? 'match' : cashVariance > 0 ? 'over' : 'short';
      const gcashStatus = Math.abs(gcashVariance) < 0.01 ? 'match' : gcashVariance > 0 ? 'over' : 'short';

      root.appendChild(el('div', { class: 'card' },
        el('h3', {}, 'Daily Sales Tracker Reconciliation'),
        el('div', { class: 'recon-grid', style: { marginTop: '10px' } },
          el('div', { class: 'card' },
            el('h3', {}, 'Cash'),
            el('table', {},
              el('tr', {}, el('td', {}, 'Money Float yesterday'), el('td', { class: 'num mono' }, money(current.cash_float_start))),
              el('tr', {}, el('td', {}, 'Total sales logged (Cash)'), el('td', { class: 'num mono' }, money(cashSales))),
              el('tr', {}, el('td', {}, 'Total expenses (Cash)'), el('td', { class: 'num mono' }, money(cashExpenses))),
              el('tr', {}, el('td', {}, 'Expected total cash in register'), el('td', { class: 'num mono' }, money(cashExpected))),
              el('tr', {}, el('td', {}, 'Actual cash in register'), el('td', { class: 'num mono' }, money(current.cash_float_end)))
            ),
            el('div', { class: 'notice', style: { marginTop: '12px' } },
              el('div', { class: `status-tag ${cashStatus}` }, cashStatus.toUpperCase() + ' / ' + money(Math.abs(cashVariance)))
            )
          ),
          el('div', { class: 'card' },
            el('h3', {}, 'GCash'),
            el('table', {},
              el('tr', {}, el('td', {}, 'Money in GCash yesterday'), el('td', { class: 'num mono' }, money(current.gcash_float_start))),
              el('tr', {}, el('td', {}, 'Total sales logged in GCash'), el('td', { class: 'num mono' }, money(gcashSales))),
              el('tr', {}, el('td', {}, 'Total expenses logged in GCash'), el('td', { class: 'num mono' }, money(gcashExpenses))),
              el('tr', {}, el('td', {}, 'Expected GCash total'), el('td', { class: 'num mono' }, money(gcashExpected))),
              el('tr', {}, el('td', {}, 'Actual GCash today'), el('td', { class: 'num mono' }, money(current.gcash_float_end)))
            ),
            el('div', { class: 'notice', style: { marginTop: '12px' } },
              el('div', { class: `status-tag ${gcashStatus}` }, gcashStatus.toUpperCase() + ' / ' + money(Math.abs(gcashVariance)))
            )
          )
        )
      ));
    }

      const bonusIn = el('input', { class: 'input', type: 'number', step: '0.1', value: State.settings.bonus_pool_pct || 10 });
      const periodIn = el('select', { class: 'input' },
        el('option', { value: 'weekly', selected: State.settings.sales_timeframe === 'weekly' }, 'Weekly'),
        el('option', { value: 'monthly', selected: State.settings.sales_timeframe === 'monthly' }, 'Monthly')
      );

      root.appendChild(el('div', { class: 'card' },
        el('h3', {}, 'Owner Settings'),
        el('label', { class: 'fld' }, el('span', {}, 'Business name'), nameIn),
        el('label', { class: 'fld' }, el('span', {}, 'Logo URL'), logoIn),
        el('label', { class: 'fld' }, el('span', {}, 'Bonus pool percentage'), bonusIn),
        el('label', { class: 'fld' }, el('span', {}, 'Sales timeframe'), periodIn),
        el('div', { style: { marginTop: '18px' } },
          el('button', { class: 'btn btn-brass btn-block', onClick: async () => {
            State.settings.business_name = nameIn.value || 'Mugnâ Café';
            State.settings.logo_url = logoIn.value;
            State.settings.bonus_pool_pct = Number(bonusIn.value || 0);
            State.settings.sales_timeframe = periodIn.value;
            if (sb) {
              const payload = {
                business_name: State.settings.business_name,
                config: {
                  bonus_pool: 0,
                  bonus_pool_pct: State.settings.bonus_pool_pct,
                  sales_timeframe: State.settings.sales_timeframe,
                  logo_url: State.settings.logo_url,
                },
              };
              await sb.from('settings').upsert({ id: 1, ...payload }).select();
            }
            $('#appBrandName').textContent = State.settings.business_name;
            toast('Settings saved.', 'ok');
          } }, 'Save settings')
        )
      ));
    }

    function renderDocuments(root) {
      root.appendChild(el('div', { class: 'card' },
        el('h3', {}, 'Files'),
        el('div', { class: 'notice' }, 'Upload and store receipts, invoices, and files here.')
      ));
    }

    function renderNotebook(root) {
      root.appendChild(el('div', { class: 'card' },
        el('h3', {}, 'Notebook'),
        el('div', { class: 'notice' }, 'Owner notes and ideas go here.')
      ));
    }

    function renderModal(title, body, footer) {
      const root = $('#modalRoot');
      root.classList.add('show');
      root.innerHTML = '';
      const backdrop = el('div', { class: 'modal-backdrop', onClick: () => { root.classList.remove('show'); root.innerHTML = ''; } });
      const modal = el('div', { class: 'modal' },
        el('div', { class: 'modal-head' },
          el('h3', {}, title),
          el('button', { class: 'modal-close', onClick: () => { root.classList.remove('show'); root.innerHTML = ''; } }, '✕')
        ),
        el('div', { class: 'modal-body' }, body),
        el('div', { class: 'modal-foot' }, ...footer)
      );
      root.append(backdrop, modal);
    }

    function init() {
      document.getElementById('logoutBtn').addEventListener('click', logout);
      showAuthChoice();
      if (!CONFIGURED) {
        toast('Supabase not configured. Demo mode enabled.', 'ok');
      }
    }

    init();
  </script>
</body>
</html>
