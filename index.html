function drawDashCharts(sales,exps){
  const brass=getCss("--brass"), sage=getCss("--sage"), clay=getCss("--clay"), bean=getCss("--bean");
  const byDay={};
  sales.forEach(s=>{const d=(s.sold_at||s.created_at||"").slice(0,10); byDay[d]=byDay[d]||{s:0,e:0}; byDay[d].s+=saleNet(s);});
  exps.forEach(e=>{if((e.expense_type||"")==="One-time")return; const d=(e.spent_at||e.created_at||"").slice(0,10); byDay[d]=byDay[d]||{s:0,e:0}; byDay[d].e+=Number(e.amount||0);});
  const days=Object.keys(byDay).sort();
  destroyChart("dashTrend");
  if($("#dashTrend"))State.charts.dashTrend=new Chart($("#dashTrend"),{type:"bar",
    data:{labels:days.map(d=>fmtDate(d)),datasets:[
      {label:"Sales",data:days.map(d=>byDay[d].s),backgroundColor:sage,borderRadius:4},
      {label:"Operating Expenses",data:days.map(d=>byDay[d].e),backgroundColor:clay,borderRadius:4}]},
    options:baseChartOpts()});
  
  const ty={}; exps.forEach(e=>{const k=e.category||"Supplies"; ty[k]=(ty[k]||0)+Number(e.amount||0);});
  destroyChart("dashExpType");
  if($("#dashExpType"))State.charts.dashExpType=new Chart($("#dashExpType"),{type:"doughnut",
    data:{labels:Object.keys(ty),datasets:[{data:Object.values(ty),backgroundColor:[sage,"#1d6fb8","#6b4a9e",clay,brass,bean],borderWidth:0}]},
    options:{...baseChartOpts(),cutout:"62%"}});
  
  const pay={}; sales.forEach(s=>{pay[s.payment_method||"—"]=(pay[s.payment_method||"—"]||0)+Number(s.total||0);});
  destroyChart("dashPay");
  if($("#dashPay"))State.charts.dashPay=new Chart($("#dashPay"),{type:"doughnut",
    data:{labels:Object.keys(pay),datasets:[{data:Object.values(pay),backgroundColor:[sage,"#1d6fb8",brass,bean],borderWidth:0}]},
    options:{...baseChartOpts(),cutout:"62%"}});
}

const CAT_PALETTE=["#B5714B","#6E8F63","#C99A3E","#7A6BA6","#4E8FA3","#B65C6C","#8C9E4E","#5C7AB6","#C77B45","#5E9E8A"];
function catColorMap(){ const c=State.data.settings&&State.data.settings.config&&State.data.settings.config.category_colors; return (c&&typeof c==="object")?c:{}; }
function catColor(cat){
  const map=catColorMap(); if(map[cat]) return map[cat];
  let h=0; for(let i=0;i<String(cat).length;i++) h=(h*31+String(cat).charCodeAt(i))>>>0;
  return CAT_PALETTE[h%CAT_PALETTE.length];
}

// Owner PIN. With migration 01 + acct_set_owner_pin(), the PIN is checked by the database
// (and the old PIN in this file stops working). onOk(token) receives an owner session token.
function promptPIN(onOk, opts={}){
  let entered="", busy=false;
  const dots=el("div",{class:"pindots"}, ...[0,1,2,3].map(()=>el("i",{})));
  const err=el("div",{class:"err",style:"text-align:center;min-height:1em"});
  function refreshDots(){ $$("i",dots).forEach((d,i)=>d.classList.toggle("on", i<entered.length)); }
  async function check(){
    busy=true;
    try{
      if(serverPins()){
        const r=await rpc("rpc_login",{p_who:"owner",p_pin:entered});
        if(r && r.ok){ back.remove(); onOk(r.token); return; }
        err.textContent=(r&&r.error)||"Wrong PIN";
      } else if(entered===String(OWNER_PIN)){ back.remove(); onOk(null); return; }
      else err.textContent="Wrong PIN";
    }catch(e){ err.textContent=e.message; }
    entered=""; busy=false; setTimeout(refreshDots,120);
  }
  function press(v){
    if(busy) return;
    if(v==="del"){ entered=entered.slice(0,-1); } else if(entered.length<4){ entered+=v; }
    refreshDots(); if(entered.length===4) check();
  }
  const pad=el("div",{class:"pinpad"});
  ["1","2","3","4","5","6","7","8","9"].forEach(n=>pad.append(el("button",{onclick:()=>press(n)},n)));
  pad.append(el("button",{onclick:()=>press("del"),style:"font-size:15px"},"⌫"), el("button",{onclick:()=>press("0")},"0"), el("button",{onclick:()=>back.remove(),style:"font-size:14px"},"Cancel"));
  const back=openModal({title:opts.title||"Owner PIN required", body:el("div",{}, el("p",{class:"muted",style:"text-align:center;margin-top:0"},opts.sub||"Enter the owner PIN to continue."), dots, err, pad)});
}

// Staff 6-digit PIN. Checked by the database once migration 01 is installed.
function promptStaffPIN(staffUser, onOk){
  let entered="", busy=false;

  const err=el("div",{class:"err",style:"text-align:center;min-height:1em"});

  async function check(){
    busy=true;
    try{
      if(State.acct.installed){
        const r=await rpc("rpc_login",{p_who:staffUser.id,p_pin:entered});
        if(r && r.ok){ back.remove(); onOk(r); return; }

  }
  const pad=el("div",{class:"pinpad"});

/* Clock-in / clock-out reminder for the signed-in staff member (wording + timing in Settings) */
function shiftReminderText(){
  if(isOwner()) return null;
  const u=State.currentUser, r=cfg().reminders||{};
  const wd=new Date().toLocaleDateString("en-US",{weekday:"long"}).toLowerCase();
  const sch=(u.work_schedule||{})[wd]; if(!sch||!sch.enabled||!sch.start||!sch.end) return null;
  const now=new Date(), start=new Date(), end=new Date();
  const [sh,sm]=sch.start.split(":").map(Number), [eh,em]=sch.end.split(":").map(Number);
  start.setHours(sh,sm,0,0); end.setHours(eh,em,0,0); if(end<=start) end.setDate(end.getDate()+1);
  const open=(State.data.shifts||[]).find(s=>!s.time_out && s.name===u.name);
  const before=Number(r.clockin_minutes_before ?? 0), outMins=Number(r.clockout_minutes_before ?? 10);
  const fill=t=>String(t).replaceAll("{name}", u.name);
  if(!open && now >= new Date(start - before*6e4) && now < end) return {kind:"in", text:fill(r.clockin_msg||"Hi {name}, please do not forget to clock in.")};
  if(open && now >= new Date(end - outMins*6e4)) return {kind:"out", text:fill(r.clockout_msg||"Hey {name}, don't forget to clock out.")};
  return null;
}
function drawReminder(){
  const box=$("#posReminder"); if(!box) return; box.innerHTML="";
  const r=shiftReminderText(); box.classList.toggle("hide", !r); if(!r) return;
  const open=(State.data.shifts||[]).find(s=>!s.time_out && s.name===State.currentUser.name);
  box.className="reminder "+(r.kind==="in"?"is-in":"is-out");
  box.append(el("div",{class:"reminder-text"}, r.text),
    r.kind==="in" ? el("button",{class:"btn btn-brass",onclick:clockIn},"Clock in now")
                  : el("button",{class:"btn btn-primary",onclick:()=>clockOut(open.id,open.name)},"Clock out"));
}

    quick.append(el("button",{class:"chip",onclick:()=>{amtIn.value=Number(v).toFixed(2); upd();}}, v===total?"Exact":peso(v))));
  function upd(){
    const paid=parseFloat(amtIn.value);

    changeOut.append(ch>=0 ? el("div",{},el("span",{class:"muted"},"Change"), el("strong",{class:"mono"},peso(ch)))
                           : el("div",{class:"bad-text"},`Short by ${peso(-ch)}`));

  const body=el("div",{},
    el("div",{class:"pay-total"}, el("span",{class:"muted"},`Total · ${CART_PAY}`), el("span",{class:"mono"},peso(total))),

      bk.remove(); await completeSale({unpaid:false, tendered:paid});
    }},"Complete Sale")]});
  setTimeout(()=>amtIn.focus(),50);
}

async function completeSale(opts={}){
  const m=ingMap();
  const items=cartToItems();
  if(!items.length) return;
  const subtotal=cartSubtotal(), discount=calculatedDiscount(), tip=CART_TIP||0, total=subtotal-discount+tip;

// Expected cash = float for the day + cash sales during this shift − cash expenses logged during this shift
function expectedCashForShift(sh){
  const tin=new Date(sh.time_in), now=new Date(), day=localISO(tin);
  const fl=(State.data.daily_floats||[]).find(f=>f.float_date===day);
  const flt=fl?Number(fl.amount??fl.amount_today??0):0;
  const sales=(State.data.sales||[]).filter(s=>isActiveSale(s)&&(s.payment_status||"paid")!=="unpaid"&&(s.payment_method||"Cash").toLowerCase()==="cash")
    .filter(s=>{const d=new Date(s.sold_at||s.created_at); return d>=tin&&d<=now;}).reduce((a,s)=>a+Number(s.total||0),0);
  const exps=(State.data.expenses||[]).filter(e=>(e.status||"approved")!=="rejected"&&["business","cash"].includes((e.source||"Business").toLowerCase()))
    .filter(e=>{const d=new Date(e.created_at); return d>=tin&&d<=now;}).reduce((a,e)=>a+Number(e.amount||0),0);
  return {float:flt, cash_sales:sales, cash_expenses:exps, expected:Math.round((flt+sales-exps)*100)/100};
}
const resultOf = v => Math.abs(v)<0.005 ? "match" : (v>0 ? "over" : "short");
const RESULT_LABEL = {match:"Match", over:"Over", short:"Short"};

async function clockOut(id,name){
  const sh=(State.data.shifts||[]).find(s=>s.id===id); if(!sh) return;
  await Promise.all([refresh("sales"),refresh("expenses"),refresh("daily_floats")]);
  const calc=expectedCashForShift(sh);
  const cashIn=el("input",{class:"input big-input",type:"number",step:"0.01",min:"0",inputmode:"decimal",placeholder:"₱ counted"});
  const out=el("div",{class:"count-result"});
  const breakdown=el("div",{class:"recon-mini"},
    el("div",{},el("span",{},"Float"),el("span",{class:"mono"},peso(calc.float))),
    el("div",{},el("span",{},"+ Cash sales this shift"),el("span",{class:"mono"},peso(calc.cash_sales))),
    el("div",{},el("span",{},"− Cash expenses this shift"),el("span",{class:"mono"},peso(calc.cash_expenses))),
    el("div",{class:"total"},el("span",{},"Expected in register"),el("span",{class:"mono"},peso(calc.expected))));
  function upd(){
    out.innerHTML=""; const v=parseFloat(cashIn.value); if(isNaN(v)) return;
    const diff=Math.round((v-calc.expected)*100)/100, r=resultOf(diff);
    out.append(el("span",{class:"result-tag "+r}, RESULT_LABEL[r]), r==="match"?null:el("span",{class:"mono"},` ${diff>0?"+":"−"}${peso(Math.abs(diff))}`));
  }
  cashIn.addEventListener("input",upd);
  openModal({title:`Clock out: ${name}`,body:el("div",{},
      el("p",{class:"muted",style:"margin-top:0"},"Count the money in the register before clocking out."),
      field("Total cash on register", cashIn), out, breakdown),
    footer:bk=>[
      el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Cancel"),
      isOwner()?el("button",{class:"btn btn-ghost",onclick:async()=>{bk.remove(); await finishClockOut(id,name);}},"Skip count"):null,
      el("button",{class:"btn btn-primary",onclick:async()=>{
        const v=parseFloat(cashIn.value); if(isNaN(v)||v<0) return toast("Enter the cash counted","bad");
        let res={...calc, counted:v, variance:Math.round((v-calc.expected)*100)/100};
        res.result=resultOf(res.variance);
        const tok=anyTok();
        if(State.acct.installed && tok){
          try{ res=await rpc("rpc_shift_count",{p_token:tok,p_shift_id:id,p_counted:v,p_notes:null}); }
          catch(e){ toast("Count saved on this device only: "+e.message,"bad"); }
        }
        if(res.result==="short") await notifyOwner(`${name} is SHORT by ${peso(Math.abs(res.variance))} at clock-out`, {staff:name, expected:res.expected, counted:res.counted, variance:res.variance});
        bk.remove(); await finishClockOut(id,name, res);
      }},"Confirm & clock out")]});
  setTimeout(()=>cashIn.focus(),50);
}
async function finishClockOut(id,name,res){
  try{ await upd("shifts",id,{time_out:new Date().toISOString()}); await refresh("shifts"); if(State.section) go(State.section);
    toast(res ? `${name} clocked out · ${RESULT_LABEL[res.result]}${res.result==="match"?"":" "+peso(Math.abs(res.variance))}` : `${name} clocked out`, res&&res.result==="short"?"bad":"ok");
  }catch(e){ toast(e.message,"bad"); }
}

/* ---------- Period filter: Today · Yesterday · This week (Sun) · This month · Custom ---------- */
function localISO(d){ d=new Date(d); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function weekStart(d=new Date()){ const s=new Date(d); s.setHours(0,0,0,0); s.setDate(s.getDate()-s.getDay()); return s; }
function periodBounds(st){
  const now=new Date(), t0=new Date(now); t0.setHours(0,0,0,0);
  const day=864e5;
  switch(st.mode){
    case "today": return [t0, new Date(+t0+day)];
    case "yesterday": return [new Date(+t0-day), t0];
    case "week": return [weekStart(now), new Date(+t0+day)];
    case "month": return [new Date(now.getFullYear(),now.getMonth(),1), new Date(+t0+day)];
    case "lastmonth": return [new Date(now.getFullYear(),now.getMonth()-1,1), new Date(now.getFullYear(),now.getMonth(),1)];
    case "custom": if(st.start&&st.end) return [new Date(st.start+"T00:00:00"), new Date(new Date(st.end+"T00:00:00").getTime()+day)]; return [null,null];
    default: return [null,null];
  }
}
function filterPeriod(items, dateFn, st){
  const [a,b]=periodBounds(st);
  return (items||[]).filter(r=>{ const v=dateFn(r); if(!v) return false;
    const d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v+"T12:00:00") : new Date(v);
    return (!a||d>=a)&&(!b||d<b); });
}
function periodFilter(st, onUpdate, extra){
  const opts=[["today","Today"],["yesterday","Yesterday"],["week","This week"],["month","This month"],...(extra||[]),["custom","Custom range"]];
  const s=el("input",{class:"input",type:"date",value:st.start,style:"width:auto"}), e=el("input",{class:"input",type:"date",value:st.end,style:"width:auto"});
  const box=el("div",{class:"kbar period-custom"+(st.mode==="custom"?"":" hide")}, s, el("span",{class:"muted"},"to"), e);
  s.onchange=()=>{st.start=s.value; if(st.end) onUpdate();}; e.onchange=()=>{st.end=e.value; if(st.start) onUpdate();};
  const sel=el("select",{class:"input",style:"width:auto;font-size:13px",onchange:ev=>{st.mode=ev.target.value; box.classList.toggle("hide",st.mode!=="custom"); if(st.mode!=="custom") onUpdate();}},
    ...opts.map(([v,l])=>el("option",{value:v,selected:st.mode===v},l)));
  return el("div",{class:"kbar"}, sel, box);
}
function addonTotal(s){ return (s.items||[]).reduce((a,li)=>{const m=li.mods||{}; const nw=(li.addons||[]).reduce((b,x)=>b+(Number(x.price)||0),0); return a+(nw+(Number(m.upsizePrice)||0)+(Number(m.milkPrice)||0)+(Number(m.cupPrice)||0))*(Number(li.qty)||1);},0); }
function cupsSold(sales){ const c={}; sales.forEach(s=>(s.items||[]).forEach(li=>{ const mi=State.data.menu.find(m=>m.id===li.menu_id); if(mi&&!isDrink(mi)) return; c[li.name]=(c[li.name]||0)+(Number(li.qty)||1); })); return c; }

function lowStockList(){
  const out=[];
  (State.data.ingredients||[]).forEach(i=>{
    if(i.stock_qty==null) return;
    const stock=Number(i.stock_qty);
    if(i.reorder_level!=null && i.reorder_level!==""){ if(stock<=Number(i.reorder_level)) out.push({i,why:`${stock} ${i.unit||""} left (reorder at ${i.reorder_level})`}); return; }
    const uses=State.data.menu.filter(mm=>mm.active!==false).map(mm=>(mm.recipe||[]).find(r=>r.ingredient_id===i.id)).filter(r=>r&&Number(r.qty)>0);
    if(!uses.length) return;
    const servings=Math.floor(stock/Math.max(...uses.map(r=>Number(r.qty))));
    if(servings<10) out.push({i,why:`about ${Math.max(servings,0)} serving(s) left`});
  });
  return out;
}

const PACKAGING_RX = /cup|lid|straw|sleeve|bag|napkin|stirrer/i;
function addonById(id){ return (State.data.addons||[]).find(a=>a.id===id); }
function addonsFor(item){
  const cat=item.category||"";
  return (State.data.addons||[]).filter(a=>a.active!==false && (a.categories||[]).includes(cat))
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||String(a.name).localeCompare(b.name));
}
function lineAddons(line){ return (line.addons||[]).map(addonById).filter(Boolean); }
function lineUnitPrice(line){ return (Number(line.item.price)||0) + lineAddons(line).reduce((a,x)=>a+(Number(x.price)||0),0); }
function cartToItems(){
  return Object.values(CART).map(c=>({ menu_id:c.item.id, name:c.item.name, price:lineUnitPrice(c), qty:c.qty,
    addons: lineAddons(c).map(a=>({id:a.id, name:a.name, price:Number(a.price)||0})) }));
}
function itemLabel(li){
  const extra = (li.addons&&li.addons.length) ? ` (${li.addons.map(a=>a.name).join(", ")})` : modsLabel(li.mods);
  return `${li.qty}× ${li.name}${extra}`;
}
function addonChips(k, redraw){
  const line=CART[k]; const list=addonsFor(line.item); if(!list.length) return null;
  const wrap=el("div",{class:"cline-addons"});
  list.forEach(a=>{
    const on=(line.addons||[]).includes(a.id);
    wrap.append(el("button",{class:"chip addon"+(on?" on":""),"aria-pressed":String(on),onclick:()=>{
      line.addons = on ? line.addons.filter(x=>x!==a.id) : [...(line.addons||[]), a.id]; redraw(); }},
      `${a.name}${Number(a.price)?` +₱${Number(a.price)}`:""}`));
  });
  return wrap;
}
// Recipe actually used for one sold line: swaps, then multiplier (not packaging), then extra ingredients.
function applyAddons(recipe, defs, m){
  let lines=(recipe||[]).map(r=>({ingredient_id:r.ingredient_id, qty:Number(r.qty)||0}));
  defs.forEach(d=>(d.swaps||[]).forEach(sw=>{ lines.forEach(l=>{ if(sw.from&&sw.to&&l.ingredient_id===sw.from) l.ingredient_id=sw.to; }); }));
  const mult=defs.reduce((a,d)=>a*(Number(d.multiplier)||1),1);
  if(mult!==1) lines.forEach(l=>{ const ing=m[l.ingredient_id]; if(!(ing&&PACKAGING_RX.test(ing.name||""))) l.qty*=mult; });
  defs.forEach(d=>(d.adds||[]).forEach(ad=>{ if(ad.ingredient_id&&Number(ad.qty)>0) lines.push({ingredient_id:ad.ingredient_id, qty:Number(ad.qty)}); }));
  return lines;
}
function recipeForLine(mi, li, m){
  m=m||ingMap();
  if(li.addons && li.addons.length) return applyAddons(mi.recipe, li.addons.map(a=>addonById(a.id)).filter(Boolean), m);
  return effectiveRecipe(mi, li.mods, m);
}
function costOfLines(lines, m){ return lines.reduce((a,r)=>{ const ing=m[r.ingredient_id]; return a+(ing?r.qty*(Number(ing.cost_per_unit)||0):0); },0); }
function cogsOfSaleLine(li,m){
  m=m||ingMap(); const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi) return 0;
  return costOfLines(recipeForLine(mi, li, m), m);
}
function computeSwapReport(sales){
  const m=ingMap(), rows={};
  const add=(name,count,extraCost,revenue)=>{ rows[name]=rows[name]||{name,count:0,extraCost:0,revenue:0};
    rows[name].count+=count; rows[name].extraCost+=extraCost; rows[name].revenue+=revenue; };
  sales.forEach(s=>(s.items||[]).forEach(li=>{
    const q=Number(li.qty)||1, mi=State.data.menu.find(x=>x.id===li.menu_id);
    (li.addons||[]).forEach(a=>{
      const d=addonById(a.id); let extra=0;
      if(mi&&d) extra=(costOfLines(applyAddons(mi.recipe,[d],m),m)-costOfLines(applyAddons(mi.recipe,[],m),m))*q;
      add(a.name,q,extra,(Number(a.price)||0)*q);
    });
    const md=li.mods; if(!md) return;
    if(md.milk&&md.milk!=="std") add("Sub Oat Milk (old)",q,0,(Number(md.milkPrice)||0)*q);
    if(md.upsize&&md.upsize!=="std") add("Upsize 16oz (old)",q,0,(Number(md.upsizePrice)||0)*q);
    if(md.cup&&md.cup!=="std") add("8oz Hot Cup (old)",q,0,(Number(md.cupPrice)||0)*q);
  }));
  return Object.values(rows);
}
function addonSummary(a){
  const m=ingMap(), nm=id=>m[id]?.name||"?", parts=[];
  (a.swaps||[]).filter(x=>x.from&&x.to).forEach(x=>parts.push(`${nm(x.from)} → ${nm(x.to)}`));
  if(a.multiplier&&Number(a.multiplier)!==1) parts.push(`recipe × ${Number(a.multiplier)}`);
  (a.adds||[]).filter(x=>x.ingredient_id).forEach(x=>parts.push(`+ ${x.qty} ${m[x.ingredient_id]?.unit||""} ${nm(x.ingredient_id)}`));
  return parts.join(" · ") || "Price only";
}

function drawOwnerStrip(box, st, profit){
  box.innerHTML="";
  const btn=el("button",{class:"btn btn-brass btn-sm",onclick:()=>openOwnerMoneyModal("in")},"＋ Add owner money");
  const info=el("div",{class:"muted"},"");
  box.append(el("div",{}, el("strong",{},"Owner money"), info), btn);
  if(!State.acct.installed||!State.acct.start_date){ info.textContent=" · switch on the books to track money you put in."; return; }
  const tok=ownerTok(); if(!tok){ info.textContent=" · sign in as owner to see it."; return; }
  const [a,b]=periodBounds(st);
  rpc("rpc_journal",{p_token:tok,p_from:a?localISO(a):null,p_to:b?localISO(new Date(+b-864e5)):null,p_limit:1000}).then(rows=>{
    const sum=t=>rows.filter(r=>r.type===t&&!String(r.description||"").startsWith("REVERSAL")&&r.status==="posted").reduce((x,r)=>x+Number(r.amount||0),0);
    const inn=sum("owner_contribution"), out=sum("owner_withdrawal");
    info.textContent=` · put in ${peso(inn)} · taken out ${peso(out)}`+(profit<0&&inn>0?` · covered ${pct(Math.min(inn,-profit)/(-profit)*100)} of the shortfall`:"");
  }).catch(()=>{ info.textContent=""; });
}

function renderAccount(root){
  root.append(topbar("My Account", State.currentUser.name));
  const owner=isOwner();
  const cur=el("input",{class:"input",type:"password",inputmode:"numeric",autocomplete:"current-password"});
  const nw=el("input",{class:"input",type:"password",inputmode:"numeric",autocomplete:"new-password"});
  const nw2=el("input",{class:"input",type:"password",inputmode:"numeric",autocomplete:"new-password"});
  const len=owner?4:6;
  root.append(el("div",{class:"card setup"},
    el("h3",{},`Signed in as ${State.currentUser.name}`),
    el("p",{class:"muted"}, owner?"Owner":(State.currentUser.role_title||"Staff")),
    el("div",{class:"tear",style:"margin:14px 0"}),
    el("h3",{},"Change my PIN"),
    el("div",{class:"form-row"}, field("Current PIN",cur), field(`New PIN (${len} digits)`,nw)),
    field("Repeat new PIN",nw2),
    el("div",{style:"display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap"},
      el("button",{class:"btn btn-ghost",onclick:()=>$("#switchUserBtn").click()},"Switch user"),
      el("button",{class:"btn btn-brass",onclick:async()=>{
        const n=nw.value.trim();
        if(!new RegExp(`^\\d{${len}}$`).test(n)) return toast(`New PIN must be ${len} digits`,"bad");
        if(n!==nw2.value.trim()) return toast("The new PINs don't match","bad");
        try{
          if(owner){
            if(!serverPins()) return toast("Run migrations 01 and 02 first; the owner PIN is still in the page file.","bad");
            let tok=ownerTok();
            if(!tok){ const r=await rpc("rpc_login",{p_who:"owner",p_pin:cur.value.trim()}); if(!r.ok) return toast(r.error,"bad"); tok=r.token; State.acct.ownerToken=tok; }
            const r=await rpc("rpc_change_owner_pin",{p_token:tok,p_old:cur.value.trim(),p_new:n});
            if(!r.ok) return toast(r.error,"bad");
            State.acct.ownerToken=null; State.acct.token=null;
            toast("Owner PIN changed. Use it next time you sign in.","ok");
          } else {
            const me=(State.data.staff_roster||[]).find(s=>s.id===State.currentUser.id);
            if(State.acct.installed){ const r=await rpc("rpc_login",{p_who:State.currentUser.id,p_pin:cur.value.trim()}); if(!r.ok) return toast("Current PIN is wrong","bad"); }
            else if(String(me?.pin||"")!==cur.value.trim()) return toast("Current PIN is wrong","bad");
            await upd("staff_roster",State.currentUser.id,{pin:n}); await refresh("staff_roster");
            toast("PIN changed","ok");
          }
          cur.value=nw.value=nw2.value="";
        }catch(e){ toast(e.message,"bad"); }
      }},"Change PIN"))));
}

/* ---------- Phone: tables become stacked cards (label on each value) ---------- */
function stackTables(root){
  if(!root) return;
  $$("table",root).forEach(t=>{
    const heads=[...t.querySelectorAll("thead th")].map(th=>th.textContent.replace(/[▲▼↑↓⇅]/g,"").trim());
    t.classList.add("stack");
    t.querySelectorAll("tbody tr, tfoot tr").forEach(tr=>{
      let i=0;
      [...tr.children].forEach(td=>{
        const span=Number(td.getAttribute("colspan"))||1;
        if(!td.hasAttribute("data-label")) td.setAttribute("data-label", span>1?"":(heads[i]||""));
        i+=span;
      });
    });
  });
}
(function(){
  let queued=false;
  const obs=new MutationObserver(()=>{ if(queued) return; queued=true; requestAnimationFrame(()=>{ queued=false; stackTables($("#screen")); }); });
  window.addEventListener("DOMContentLoaded",()=>{ const s=$("#screen"); if(s) obs.observe(s,{childList:true,subtree:true}); });
  const s=document.getElementById("screen"); if(s) obs.observe(s,{childList:true,subtree:true});
})();

// The partners table's column names vary; use what the rows already have.
function partnerCols(){
  const keys=new Set(); (State.data.partners||[]).forEach(p=>Object.keys(p).forEach(k=>keys.add(k)));
  const pick=(rx,fallback)=>[...keys].find(k=>rx.test(k)) || fallback;
  return { own: pick(/owner|share|pct|percent|equity/i,"ownership"), cap: pick(/capital|invest/i,"capital") };
}
function renderProfit(root){
  root.append(topbar("Profit Sharing","Partners, their ownership and the money they put in"));
  const parts=State.data.partners||[], col=partnerCols();
  const totalOwn=parts.reduce((a,p)=>a+(Number(p[col.own])||0),0);
  root.append(el("div",{class:"section-head"},
    el("div",{class:"muted"}, parts.length?`${parts.length} partner(s) · ownership adds up to ${pct(totalOwn)}`:"Add each partner so owner money and Telegram expenses are credited to the right person."),
    el("button",{class:"btn btn-brass btn-sm",onclick:()=>editPartner()},"+ Partner")));
  if(parts.length && Math.abs(totalOwn-100)>0.01)
    root.append(el("div",{class:"notice",style:"margin-bottom:12px"},`Ownership adds up to ${pct(totalOwn)}. It should be 100%.`));
  if(!parts.length){ root.append(el("div",{class:"card empty"},el("div",{class:"big"},"🤝"),"No partners yet.")); return; }
  const t=el("table"); t.append(el("thead",{},el("tr",{},el("th",{},"Partner"),el("th",{class:"num"},"Ownership"),el("th",{class:"num"},"Capital put in"),el("th",{},""))));
  const tb=el("tbody");
  parts.forEach(p=>tb.append(el("tr",{},
    el("td",{style:"font-weight:600"},p.name||"—"),
    el("td",{class:"num"}, p[col.own]!=null?pct(p[col.own]):"—"),
    el("td",{class:"num"}, p[col.cap]!=null?peso(p[col.cap]):"—"),
    el("td",{}, el("div",{class:"row-actions"},
      el("button",{class:"iconbtn",title:"Edit",onclick:()=>editPartner(p)},"✎"),
      el("button",{class:"iconbtn",title:"Delete",onclick:()=>confirmDel(p.name||"this partner",async()=>{await del("partners",p.id);await refresh("partners");go("profit");})},"🗑"))))));
  t.append(tb); root.append(el("div",{class:"card",style:"padding:0;overflow:hidden"},el("div",{class:"tbl-wrap"},t)));
  root.append(renderProfitSplit(parts, col));
  root.append(el("p",{class:"help",style:"margin-top:10px"},"The name must match exactly what you use in Telegram (acct_tg_allow) so his receipts paid from personal money are credited to him. Money each partner puts in or takes out is recorded in Owner Money & Books."));
}
function editPartner(p){
  const col=partnerCols();
  const name=el("input",{class:"input",value:p?.name||"",placeholder:"e.g. Bryan"});
  const own=el("input",{class:"input",type:"number",step:"0.01",min:"0",max:"100",value:p?.[col.own]??"",placeholder:"e.g. 50"});
  const cap=el("input",{class:"input",type:"number",step:"0.01",min:"0",value:p?.[col.cap]??"",placeholder:"₱ starting capital"});
  openModal({title:p?`Edit ${p.name}`:"New partner",body:el("div",{},
      field("Name",name),
      el("div",{class:"form-row"},field("Ownership (%)",own),field("Starting capital (₱)",cap,"What they put in to start the business"))),
    footer:bk=>[el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Cancel"),
      el("button",{class:"btn btn-brass",onclick:async()=>{
        if(!name.value.trim()) return toast("Add a name","bad");
        const row={name:name.value.trim()};
        if(own.value!=="") row[col.own]=parseFloat(own.value);
        if(cap.value!=="") row[col.cap]=parseFloat(cap.value);
        try{ p?await upd("partners",p.id,row):await ins("partners",row); }
        catch(e){
          // a column name guess was wrong: save the name only
          try{ p?await upd("partners",p.id,{name:row.name}):await ins("partners",{name:row.name}); toast("Saved the name. Ownership/capital columns weren't found in the partners table.","bad"); }
          catch(e2){ return toast(e2.message,"bad"); }
        }
        await refresh("partners"); bk.remove(); go("profit"); toast("Partner saved","ok");
      }},"Save partner")]});
}

/* Profit split by ownership % for a period */
const PS_F = { mode:"lastmonth", start:"", end:"" };
function renderProfitSplit(parts, col){
  const card=el("div",{class:"card",style:"margin-top:16px"});
  const body=el("div",{});
  card.append(el("div",{class:"section-head",style:"margin:0 0 10px"}, el("h3",{},"Profit split"),
    periodFilter(PS_F, ()=>draw(), [["lastmonth","Last month"],["all","All time"]])), body);
  async function draw(){
    body.innerHTML=""; body.append(el("div",{class:"muted"},"Working it out…"));
    const [a,b]=periodBounds(PS_F);
    const from=a?localISO(a):null, to=b?localISO(new Date(+b-864e5)):null;
    let profit=null, basis="", cash=null;
    const tok=ownerTok();
    if(State.acct.installed && State.acct.start_date && tok){
      try{
        const pl=await rpc("rpc_profit_loss",{p_token:tok,p_from:from,p_to:to});
        profit=Number(pl.net_profit); basis=`From the books: sales ${peso(pl.net_revenue)} − cost of goods ${peso(pl.total_cogs)} − expenses ${peso(pl.total_expenses)}`;
        const bs=await rpc("rpc_balance_sheet",{p_token:tok,p_as_of:todayISO()});
        cash=(bs.assets||[]).filter(x=>["1000","1010","1020"].includes(x.code)).reduce((s,x)=>s+Number(x.amount||0),0);
      }catch(_){ profit=null; }
    }
    if(profit==null){
      const sales=filterPeriod(State.data.sales, s=>s.sold_at||s.created_at, PS_F).filter(isActiveSale).reduce((s,x)=>s+saleNet(x),0);
      const exps=filterPeriod(State.data.expenses, e=>(e.spent_at||e.created_at||"").slice(0,10), PS_F).filter(approvedExpense).reduce((s,e)=>s+Number(e.amount||0),0);
      profit=sales-exps; basis=`Estimate from logged sales ${peso(sales)} − approved expenses ${peso(exps)}. Switch on the books for the exact figure.`;
    }
    body.innerHTML="";
    body.append(el("div",{class:"grid cols-2 kpis"},
      kpiCard("Net profit", (profit<0?"−":"")+peso(Math.abs(profit)), profit>=0?"in":"out", basis),
      cash!=null?kpiCard("Cash, GCash & bank now", peso(cash), cash>=0?"":"out", "Only pay out what the business can spare"):el("span",{})));
    if(!parts.length){ body.append(el("div",{class:"muted",style:"margin-top:10px"},"Add partners above to see each share.")); return; }
    if(profit<=0){ body.append(el("div",{class:"notice",style:"margin-top:12px"}, profit<0?`No profit to share for this period: a loss of ${peso(-profit)}.`:"No profit to share for this period.")); return; }
    const t=el("table"); t.append(el("thead",{},el("tr",{},el("th",{},"Partner"),el("th",{class:"num"},"Ownership"),el("th",{class:"num"},"Share of profit"),el("th",{},""))));
    const tb=el("tbody");
    parts.forEach(p=>{
      const o=Number(p[col.own])||0, share=Math.round(profit*o)/100;
      tb.append(el("tr",{}, el("td",{style:"font-weight:600"},p.name), el("td",{class:"num"},pct(o)), el("td",{class:"num",style:"font-weight:600"},peso(share)),
        el("td",{}, (share>0&&State.acct.installed&&State.acct.start_date)?el("button",{class:"btn btn-ghost btn-sm",onclick:()=>openOwnerMoneyModal("out",{amount:share,partner:p.id,note:`Profit share ${fmtDate(from)}${to?` to ${fmtDate(to)}`:""}`})},"Record payout"):null)));
    });
    t.append(tb); body.append(el("div",{class:"tbl-wrap",style:"margin-top:12px"},t));
    body.append(el("p",{class:"help"},"Record payout saves it as that partner's owner withdrawal in the books. It does not count as an expense, so profit stays the same."));
  }
  draw();
  return card;
}


/* ============================================================
   APPLICATION BOOTSTRAP
   ============================================================ */
async function boot(){
  if(!CONFIGURED){
    $("#loadingView").classList.add("hide");
    $("#cfgWarn").classList.remove("hide");
    $("#cfgWarn").innerHTML="⚙️ Not connected. Please check Supabase credentials.";
    return;
  }
  
  // Directly load data and show user selection without blocking on owner Supabase email session
  $("#loadingView").classList.add("hide");
  $("#authView").classList.remove("hide");
  try {
    await Promise.all([loadAll(), acctInit()]);
  } catch(_) {}
  renderUserSelection();
}

async function enterApp(){
  $("#authView").classList.add("hide");
  $("#loadingView").classList.remove("hide");
  try{ await Promise.all([loadAll(), acctInit()]); }catch(_){}
  $("#loadingView").classList.add("hide");
  $("#appView").style.display="block";
  if (!State.wired) {
  State.wired = true;
  $("#backBtn").addEventListener("click", backHome);
  $("#homeBtn").addEventListener("click", backHome);
  $("#navToggle").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  $("#switchUserBtn").addEventListener("click", async () => {
    await acctLogoutAll(); State.unlocked = false; State.section = null;
    $("#appView").style.display="none";
    $("#authView").classList.remove("hide");
    $("#userSelectScreen").classList.remove("hide");
    $("#emailAuthScreen").classList.add("hide");
    renderUserSelection();
  });
  }
  renderHome();
}

async function doLogin(){
  const email=$("#email").value.trim(), password=$("#pass").value;
  $("#authErr").textContent=""; const b=$("#loginBtn"); b.disabled=true; b.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ $("#authErr").textContent=error.message; b.disabled=false; b.textContent="Sign in"; return; }
  State.currentUser = { id:"owner_main", name: email.split("@")[0], role: "owner" };
  State.acct.token = null; State.acct.role = null;
  State.unlocked = true;
  await enterApp();
}

function wireAuth(){
  $("#loginBtn").addEventListener("click", doLogin);
  $("#pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  
  $("#showEmailAuthBtn").addEventListener("click", () => {
    $("#userSelectScreen").classList.add("hide");
    $("#emailAuthScreen").classList.remove("hide");
  });

  $("#backToUsersBtn").addEventListener("click", () => {
    $("#emailAuthScreen").classList.add("hide");
    $("#userSelectScreen").classList.remove("hide");
  });
}

wireAuth();
boot();
</script>
