<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LifeHub</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="LifeHub" />
<meta name="theme-color" content="#7c746a" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c746a'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3EL%3C/text%3E%3C/svg%3E" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --accent:#6b7280;
    --accent-soft:#eceef1;
    --bg:#f5f5f4;
    --card:#ffffff;
    --ink:#2b2b2e;
    --muted:#8b8b90;
    --line:#e6e6e8;
    --good:#3f9d6d;
    --warn:#d98324;
    --bad:#c4544f;
    --radius:16px;
    --font:'Quicksand', system-ui, -apple-system, sans-serif;
    --font-title:'Quicksand', system-ui, sans-serif;
    --font-label:'Quicksand', system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    font-size:15px;
    line-height:1.45;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-weight:700}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* Top bar */
  header.app{
    position:sticky;top:0;z-index:30;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header.app .brand{font-size:20px;font-weight:800;letter-spacing:-.4px}
  header.app .brand span{color:var(--accent)}
  header.app .sub{font-size:12px;color:var(--muted)}

  main{max-width:760px;margin:0 auto;padding:16px 14px 30px}
  .tab-panel{display:none;animation:fade .25s ease}
  .tab-panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
  .panel-head h2{font-size:22px;letter-spacing:-.5px}
  .panel-head .hint{font-size:12px;color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .card + .card{margin-top:12px}

  .btn{background:var(--accent);color:#fff;padding:9px 14px;border-radius:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:14px}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--accent-soft);color:var(--accent)}
  .btn.tiny{padding:5px 9px;font-size:12px;border-radius:8px}
  .btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}

  .row{display:flex;align-items:center;gap:10px}
  .spacer{flex:1}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .pill.gray{background:var(--line);color:var(--muted)}
  .pill.good{background:#e7f4ee;color:var(--good)}
  .pill.warn{background:#fbf0e1;color:var(--warn)}
  .pill.bad{background:#fae9e8;color:var(--bad)}

  .muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

  /* list items */
  .item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
  .item .check.on{background:var(--good);border-color:var(--good)}
  .item .body{flex:1;min-width:0}
  .item .title{font-weight:600}
  .item .meta{font-size:12px;color:var(--muted)}
  .item.done .title{text-decoration:line-through;color:var(--muted)}
  .item .acts{display:flex;gap:6px;flex:none}
  .icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:15px}
  .icon-btn.del{background:#fae9e8;color:var(--bad)}

  .group-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
  .group-title .count{background:var(--line);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px}

  /* budget columns */
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .colcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px}
  .colcard h4{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
  .colcard h4 .sum{color:var(--accent)}
  .exp{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:14px}
  .exp:last-child{border-bottom:none}
  .exp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp .amt{font-weight:700;font-variant-numeric:tabular-nums}

  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--accent-soft);border-radius:13px;padding:12px}
  .stat .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
  .stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:2px}
  .stat.big{grid-column:1/-1}
  .stat.good .v{color:var(--good)} .stat.bad .v{color:var(--bad)}

  .monthnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
  .monthnav .m{font-weight:800;font-size:16px;min-width:130px;text-align:center}
  .monthnav button{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:18px}

  .seg{display:flex;background:var(--accent-soft);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:13px;color:var(--accent)}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}

  table.pay{width:100%;border-collapse:collapse;font-size:13px}
  table.pay th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line)}
  table.pay td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.pay td.num{text-align:right;font-variant-numeric:tabular-nums}

  /* bottom nav */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
  .cal .day{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;padding:5px 0 0;font-size:13px;background:var(--card)}
  .cal .day.out{opacity:0;border:none;background:none}
  .cal .day.today{border-color:var(--accent);border-width:2px;font-weight:800}
  .cal .day.sel{background:var(--accent-soft)}
  .cal .day .dots{display:flex;gap:3px;margin-top:3px;min-height:6px}
  .cal .day .dot,.dot{width:6px;height:6px;border-radius:50%}
  .dot.pay{background:var(--bad)} .dot.note{background:var(--accent)}

  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;padding:4px 0}
  nav.tabs button .ic{font-size:20px;line-height:1}
  nav.tabs button.on{color:var(--accent)}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(20,18,28,.42);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .scrim.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s ease}
  @media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:20px;margin:20px}}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:18px;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}
  .field textarea{min-height:64px;resize:vertical}
  .field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field.two > div{display:flex;flex-direction:column}
  .sheet-acts{display:flex;gap:10px;margin-top:16px}
  .sheet-acts .btn{flex:1;justify-content:center;padding:12px}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--accent-soft);color:var(--accent);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .chip button{color:var(--accent);font-weight:800;opacity:.6}
  .swatch{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);padding:0}
  .swatch.on{border-color:var(--ink)}

  .fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:45;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}

  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}

  .setup{max-width:440px;margin:40px auto;padding:0 18px}

  /* calligraphy title + labels */
  header.app .brand{font-family:var(--font-title);font-weight:600;font-size:30px;line-height:1.05}
  .panel-head h2{font-family:var(--font-title);font-weight:600}
  .hdr-back{font-size:30px;color:var(--accent);width:30px;height:38px;line-height:1;margin-right:2px;display:none}

  /* home launcher */
  #home{max-width:760px;margin:0 auto;padding:4px 2px}
  .home-greet{display:flex;align-items:center;gap:11px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:6px 2px 18px}
  .home-greet .face{font-size:26px;line-height:1}
  .home-greet p{font-family:var(--font-label);font-weight:700;font-size:16px;color:var(--accent);margin:0}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .htile{border-radius:26px;padding:20px 12px 15px;text-align:center;transition:transform .12s;border:none;cursor:pointer;width:100%}
  .htile:active{transform:scale(.96)}
  .htile svg{width:52px;height:52px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.15))}
  .htile .lb{font-family:var(--font-label);font-weight:700;font-size:16px;margin-top:6px;display:block;line-height:1.1}
</style>

</head>
<body>

<header class="app">
  <button id="hdrBack" class="hdr-back" onclick="App.go('home')">‹</button>
  <div>
    <div class="brand" id="hdrTitle">LifeHub</div>
    <div class="sub" id="syncState">Connecting…</div>
  </div>
  <button class="btn ghost tiny" id="gearBtn" onclick="App.go('settings')">⚙︎</button>
</header>

<main>
  <div id="mascot" style="display:none"></div>

  <section id="auth" style="display:none;max-width:420px;margin:36px auto;padding:0 18px">
    <div class="card" style="padding:22px">
      <div class="brand" style="font-size:26px;margin-bottom:4px">Life<span style="color:var(--accent)">Hub</span></div>
      <p class="muted" id="authSub" style="font-size:13px;margin-bottom:18px">Log in to your account</p>
      <div class="field"><label>Email</label><input id="auEmail" type="email" autocomplete="email" placeholder="you@email.com" /></div>
      <div class="field"><label>Password</label><input id="auPass" type="password" autocomplete="current-password" placeholder="At least 6 characters" /></div>
      <button class="btn" id="auBtn" style="width:100%;justify-content:center;padding:12px" onclick="App.authSubmit()">Log in</button>
      <p style="text-align:center;margin-top:14px;font-size:13px" class="muted">
        <span id="authToggleTxt">New here?</span>
        <a href="#" id="authToggleLink" onclick="App.authToggle();return false" style="color:var(--accent);font-weight:600">Create an account</a></p>
    </div>
  </section>

  <section id="paywall" style="display:none;max-width:440px;margin:24px auto;padding:0 18px">
    <div id="paywallBody"></div>
  </section>

  <section id="home" style="display:none"></section>

  <section id="tab-shopping" class="tab-panel">
    <div class="panel-head"><h2>Shopping</h2><span class="hint">Tap circle = bought</span></div>
    <div id="shoppingList"></div>
  </section>

  <section id="tab-budget" class="tab-panel">
    <div class="panel-head"><h2>Budget</h2><span class="hint" id="budgetHint"></span></div>
    <div class="monthnav">
      <button onclick="App.shiftMonth(-1)">‹</button>
      <div class="m" id="monthLabel"></div>
      <button onclick="App.shiftMonth(1)">›</button>
    </div>
    <div id="budgetBody"></div>
  </section>

  <section id="tab-notes" class="tab-panel">
    <div class="panel-head"><h2>Notes</h2><span class="hint">Brain dump</span></div>
    <div id="notesBody"></div>
  </section>

  <section id="tab-calendar" class="tab-panel">
    <div class="panel-head"><h2>Calendar</h2><span class="hint">Payments & notes</span></div>
    <div class="monthnav">
      <button onclick="App.calShift(-1)">‹</button>
      <div class="m" id="calLabel"></div>
      <button onclick="App.calShift(1)">›</button>
    </div>
    <div id="calBody"></div>
    <div id="calDay"></div>
  </section>

  <section id="tab-loans" class="tab-panel">
    <div class="panel-head"><h2>Long-term payments</h2><span class="hint">Amortization & carryover</span></div>
    <div id="loanBody"></div>
  </section>

  <section id="tab-settings" class="tab-panel">
    <div class="panel-head"><h2>Settings</h2></div>
    <div id="settingsBody"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="App.fab()">+</button>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const App = (() => {
  let sb=null, tab='home', period='mid';
  let activeLoanId = null;
  let recurringView = false;
  let payoffView = false;
  let shopSubtab = 'list';
  let budgetPeriodOpen = null;
  let budgetTab = "mid";
  let ledgerShowHidden = false;
  let month = new Date().toISOString().slice(0,7); // YYYY-MM
  const LS = { url:'lh_url', key:'lh_key' };

  // default settings (stored in app_settings.data)
  const DEFAULTS = {
    theme:'plain',
    accent:'#7c746a', bg:'#faf7f2', font:'Manrope', currency:'₱',
    payMid:15, payEnd:30, savingsPct:20,
    debtMonthly:0, loanApr:{}, loanOverdue:{}, loanDues:{}, loanPayments:{}, loanEnd:{}, loanHorizon:6,
    stores:[], priceBook:{}, groceryLimit:0, shopStore:'', hiddenPeriods:{},
    cat_shopping:['Groceries','House things','Personal care','Pharmacy','Other'],
    cat_budget:['Bills','Food','Transport','Subscriptions','Health','Misc']
  };
  let S = {...DEFAULTS};

  const data = { shopping:[], incomes:[], expenses:[], recurring:[], notes:[], loans:[], payments:[], periods:[], submissions:[] };

  /* ---------- helpers ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = n => S.currency + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
  const todayStr = () => new Date().toISOString().slice(0,10);
  const monthName = ym => { const [y,m]=ym.split('-'); return new Date(y,m-1,1).toLocaleString(undefined,{month:'long',year:'numeric'}); };
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

  // ===== THEMES =====
  let curTiles=null, curMascot='🌿';
  const THEMES = {
    plain:{label:'Plain', calli:false, mascot:'🌿',
      v:{accent:'#6b7280',bg:'#f5f5f4',card:'#ffffff',ink:'#2b2b2e',muted:'#8b8b90',line:'#e6e6e8'},
      tiles:[['#f0f1f3','#e5e7ea','#4b5563'],['#eef0f2','#e3e6e9','#4b5563'],['#f0f1f3','#e5e7ea','#4b5563'],['#eef0f2','#e3e6e9','#4b5563'],['#f0f1f3','#e5e7ea','#4b5563'],['#eef0f2','#e3e6e9','#4b5563']]},
    cottagecore:{label:'CottageCore', calli:true, mascot:'🐢',
      v:{accent:'#b5654a',bg:'#f6efe4',card:'#fff8f0',ink:'#5b4a42',muted:'#9a8a7d',line:'#eaddcb'},
      tiles:[['#f2ddd9','#e6c3bd','#9a6660'],['#e0e8d2','#c9d6b6','#5f7050'],['#f4e9d5','#e8d6ba','#8a6d4a'],['#f4dccb','#e9bda3','#a5673f'],['#dde8e1','#c3d6cb','#4f7361'],['#f4e8c6','#e7d29e','#8a7422']]},
    girly:{label:'Girly', calli:true, mascot:'🎀',
      v:{accent:'#e07e97',bg:'#fdf0f4',card:'#ffffff',ink:'#6b3a4a',muted:'#b98a97',line:'#f6dbe3'},
      tiles:[['#ffe1ea','#ffc6d7','#c05576'],['#ffd8ec','#ffbde0','#c34a8f'],['#f2ddf7','#e4c2ef','#9350a6'],['#ffe3e0','#ffc7c2','#c15a54'],['#ffeaf3','#ffd0e2','#c96a92'],['#fbe0f0','#f4c3e2','#b3468f']]},
    manly:{label:'Manly', calli:false, mascot:'🧭',
      v:{accent:'#2f4858',bg:'#eceded',card:'#ffffff',ink:'#1f2933',muted:'#6b7680',line:'#d5dade'},
      tiles:[['#e6ebef','#d3dce3','#2f4858'],['#e5eae4','#d0dacb','#3d5a3f'],['#e8e8ea','#d6d7db','#333941'],['#e4ecef','#cfdee4','#2b5566'],['#ece8e2','#dcd5c9','#5a4632'],['#e7e9ec','#d4d8de','#3a4653']]},
    dark:{label:'Dark Mode', calli:false, mascot:'🌙',
      v:{accent:'#8aa0ff',bg:'#16181d',card:'#1f2229',ink:'#e7e8ec',muted:'#9296a1',line:'#2a2e37'},
      tiles:[['#232733','#2a2f3d','#a9b4e6'],['#26302b','#2c3832','#a7d0b3'],['#332a2e','#3d3138','#e6a9bd'],['#2e2b33','#37323d','#c9b0e0'],['#332f26','#3d382c','#e0c98f'],['#263033','#2d3a3d','#9fd0d0']]},
    cat:{label:'Cat', calli:true, mascot:'🐱',
      v:{accent:'#e0894a',bg:'#fdf6ee',card:'#ffffff',ink:'#4a3b30',muted:'#a3907f',line:'#f0e2d0'},
      tiles:[['#ffe6cf','#ffcfa3','#b0742e'],['#f6ece0','#eddcc6','#8a6d4a'],['#f0e2d4','#ddc7b0','#7a5a42'],['#ffe0e6','#ffc6d0','#b25f6e'],['#eceae6','#d9d6cf','#6b6660'],['#fbf0d6','#f2e0a8','#8a7422']]},

  function mix(hex,other,t){ // blend hex toward other by t
    const p=h=>{h=h.replace('#','').trim();return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
    const a=p(hex), b=p(other); const m=i=>Math.round(a[i]+(b[i]-a[i])*t);
    return `rgb(${m(0)},${m(1)},${m(2)})`;
  }

  function downloadICS(title, dateStr, timeStr, notes){
    if(!dateStr){ toast('Add a due date first'); return; }
    const dt = new Date(`${dateStr}T${timeStr||'09:00'}:00`);
    const stamp = d => d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
    const end = new Date(dt.getTime()+30*60000);
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LifeHub//EN','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT','UID:'+Date.now()+'@lifehub',
      'DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(dt),'DTEND:'+stamp(end),
      'SUMMARY:'+(title||'Reminder'), notes?('DESCRIPTION:'+String(notes).replace(/\n/g,'\\n')):'',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+(title||'Reminder'),'TRIGGER:-PT0M','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].filter(Boolean).join('\r\n');
    const dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    if(isiOS){
      window.location.href = dataUri;
    } else {
      const a=document.createElement('a'); a.href=dataUri;
      a.download=(title||'reminder').replace(/[^a-z0-9]/gi,'_').slice(0,30)+'.ics';
      document.body.appendChild(a); a.click(); a.remove();
    }
    toast('Opening reminder — tap Add in Calendar');
  }

    const toBuy=data.shopping.filter(i=>!i.bought);
    const totalToBuy=toBuy.reduce((s,i)=>s+Number(i.price||0),0);

    // grocery budget bar
    const limit=Number(S.groceryLimit||0);
    let limitBar='';
    if(limit>0){
      const pct=Math.min(100, Math.round(totalToBuy/limit*100));
      const over=totalToBuy>limit;
      limitBar=`<div class="card" style="margin-bottom:12px">
        <div class="row" style="font-size:13px"><span class="muted">Trip budget</span><div class="spacer"></div>
          <b style="color:${over?'var(--bad)':'var(--good)'}">${money(totalToBuy)} / ${money(limit)}</b></div>
        <div style="height:9px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden">

    let html=seg+controls+limitBar+`<div class="summary">
      <div class="stat good"><div class="k">To-buy total</div><div class="v">${money(totalToBuy)}</div></div>
      <div class="stat"><div class="k">List total</div><div class="v">${money(totalAll)}</div></div></div>`;
    Object.keys(byCat).sort().forEach(cat=>{
      const items=byCat[cat].sort((a,b)=>a.bought-b.bought);
      const left=items.filter(i=>!i.bought).length;
      const catSum=items.filter(i=>!i.bought).reduce((s,i)=>s+Number(i.price||0),0);
      html+=`<div class="group-title">${esc(cat)} <span class="count">${left} to buy · ${money(catSum)}</span></div><div class="card">`;

          storeHint = ` · ${esc(S.shopStore)}: ${money(S.priceBook[i.name][S.shopStore])}`;
        const meta=[i.qty?esc(i.qty):'', Number(i.price)>0?money(i.price):''].filter(Boolean).join(' · ')+storeHint;
        html+=`<div class="item ${i.bought?'done':''}">
          <button class="check ${i.bought?'on':''}" onclick="App.toggleShop('${i.id}')">${i.bought?'✓':''}</button>
          ${i.image?`<img src="${i.image}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none" onclick="App.editShopForm('${i.id}')" />`:''}
          <div class="body"><div class="title">${esc(i.name)}</div>${meta.trim()?`<div class="meta">${meta}</div>`:''}</div>

            <button class="icon-btn" onclick="App.editShopForm('${i.id}')">✏️</button>
            <button class="icon-btn del" onclick="App.delShop('${i.id}')">✕</button></div>
        </div>`;
      });

    wrap.innerHTML=html;
  }

  /* ----- Grocery price comparison table ----- */
  function priceTableHTML(){
    const stores = S.stores||[];
    const products = Object.keys(S.priceBook||{});
    let html=`<div class="card" style="margin-bottom:12px"><p class="muted" style="font-size:12px;margin:0">
      Log prices from your receipts. Rows are products, columns are stores. The cheapest store for each item is highlighted 💚.</p></div>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button class="btn ghost tiny" onclick="App.addProductRow()">+ Product</button>
        <button class="btn ghost tiny" onclick="App.addStore()">+ Store</button>
      </div>`;
    if(!stores.length && !products.length){
      return html+emptyState('No price book yet','Add a store and a product to start comparing prices across shops.');
    }
    html+=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;min-width:100%;font-size:13px">
      <thead><tr>
        <th style="text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;left:0;background:var(--card)">Product</th>
        ${stores.map(s=>`<th style="padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap">${esc(s)}<br><button class="icon-btn del" style="margin-top:4px" onclick="App.removeStore('${esc(s)}')">✕</button></th>`).join('')}
      </tr></thead><tbody>`;
    if(!products.length){
      html+=`<tr><td colspan="${stores.length+1}" class="muted" style="padding:12px">Add a product to start.</td></tr>`;
    }
    products.forEach(p=>{
      const row=S.priceBook[p]||{};
      const vals=stores.map(s=>Number(row[s])).filter(v=>v>0);
      const cheapest=vals.length?Math.min(...vals):null;
      html+=`<tr>
        <td style="padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;left:0;background:var(--card);white-space:nowrap">
          <span onclick="App.renameProduct('${esc(p)}')" style="cursor:pointer;border-bottom:1px dashed var(--muted)">${esc(p)}</span> <button class="icon-btn del" onclick="App.removeProductRow('${esc(p)}')" style="vertical-align:middle">✕</button></td>
        ${stores.map(s=>{
          const v=row[s]; const isCheap=cheapest!=null && Number(v)===cheapest && Number(v)>0;
          return `<td style="padding:6px 8px;border-bottom:1px solid var(--line);background:${isCheap?'var(--accent-soft)':'transparent'}">
            <input type="number" inputmode="decimal" value="${v!=null?v:''}" placeholder="—" onchange="App.setPrice('${esc(p)}','${esc(s)}',this.value)"
              style="width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);${isCheap?'font-weight:700;color:var(--accent)':''}" /></td>`;
        }).join('')}
      </tr>`;
    });
    html+=`</tbody></table></div>`;
    return html;
  }

  // shrink any picked photo to a small thumbnail data URL so sync stays light
  function compressImage(file, cb){
    const reader=new FileReader();
    reader.onload=e=>{ const img=new Image();
      img.onload=()=>{ const max=420; const scale=Math.min(1, max/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.72)); };
      img.src=e.target.result; };
    reader.readAsDataURL(file);
  }

  /* ----- Budget ----- */
  function setPeriod(p){ period=p; document.querySelectorAll('#periodSeg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); renderBudget(); }
  function shiftMonth(d){ const dt=new Date(month+'-01'); dt.setMonth(dt.getMonth()+d); month=dt.toISOString().slice(0,7); autoLogRecurring().then(renderBudget); }
  function periodsActive(){ return [period]; }

  function loanBudgetLines(per){
    const day15=S.payMid||15; const out=[];
    data.loans.forEach(loan=>{
      ((S.loanPayments&&S.loanPayments[loan.id])||[]).forEach(p=>{
        if(!p.date || p.date.slice(0,7)!==month) return;
        const d=Number(p.date.slice(8,10)); const pr=d<=day15?'mid':'end';
        if(pr!==per) return;
        out.push({id:'loan:'+p.id, category:'Loans', name:loan.name, amount:Number(p.amount)||0, status:'planned', virtual:true});
      });
    });
    return out;
  }
  function perStats(per){
    const exps=data.expenses.filter(e=>e.month===month && e.period===per);
    const incs=data.incomes.filter(i=>i.month===month && i.period===per);
    const income=incs.reduce((s,i)=>s+Number(i.amount||0),0);
    const planned=exps.filter(e=>e.status==='planned').concat(loanBudgetLines(per));
    const paid=exps.filter(e=>e.status==='paid');
    const sumPlanned=planned.reduce((s,e)=>s+Number(e.amount||0),0);
    const sumPaid=paid.reduce((s,e)=>s+Number(e.amount||0),0);
    return {income,incs,planned,paid,sumPlanned,sumPaid,remaining:income-sumPaid-sumPlanned};
  }
  function renderBudget(){
    $('#monthLabel').textContent=monthName(month);
    $('#budgetHint').textContent='';
    const tabs=[['mid','15','☀️','15th'],['end','30','🌙','30th'],['recurring','🔁','','Recurring'],['loans','💳','','Loans']];
    let row=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">`;
    tabs.forEach(([key,a,b,label])=>{
      const on=budgetTab===key;
      const badge = (key==='mid'||key==='end')
        ? `<span style="font-size:16px;font-weight:800;line-height:1;color:${on?'#fff':'var(--accent)'}">${a}</span><span style="font-size:10px;line-height:1">${b}</span>`
        : `<span style="font-size:20px">${a}</span>`;
      row+=`<button onclick="App.setBudgetTab('${key}')" style="text-align:center;border:none;border-radius:16px;padding:9px 3px;background:${on?'var(--accent)':'var(--accent-soft)'}">
        <div style="width:40px;height:40px;border-radius:50%;margin:0 auto;background:${on?'rgba(255,255,255,.22)':'var(--card)'};display:flex;flex-direction:column;align-items:center;justify-content:center">${badge}</div>
        <div style="font-family:var(--font-label);font-weight:700;font-size:11px;margin-top:5px;color:${on?'#fff':'var(--accent)'}">${label}</div></button>`;
    });
    row+=`</div>`;
    let body;
    if(budgetTab==='recurring') body=recurringInner();
    else if(budgetTab==='loans') body=loansContentHTML();
    else body=periodInner(budgetTab);
    $('#budgetBody').innerHTML=row+body;

  function setBudgetTab(k){ budgetTab=k; activeLoanId=null; if(k==='mid'||k==='end') period=k; renderBudget(); window.scrollTo(0,0); }

  function periodInner(per){
    const st=perStats(per);
    const dateStr = dueDateStr(month, per==='mid'? (S.payMid||15) : (S.payEnd||30));
    let incRows = st.incs.map(i=>`<div class="exp"><span class="nm">${esc(i.label||'Income')}</span>

        <div class="card">
          <div class="row" style="margin-bottom:6px"><span class="muted" style="font-size:13px">Income · <b style="color:var(--ink)">${money(st.income)}</b></span><div class="spacer"></div>

  function loanPaydaySection(dateStr){
    if(!data.loans.length) return '';
    const rows=data.loans.map(loan=>{
      const list=(S.loanPayments&&S.loanPayments[loan.id])||[];
      const pay=list.find(p=>p.date===dateStr && p.src==='payday');
      const amt=pay?pay.amount:'';
      const pos=loanPosition(loan);
      return `<div class="exp"><span class="nm">${esc(loan.name)} <span class="muted" style="font-size:11px">· ${pos.owed>0?money(pos.owed)+' left':pos.owed<0?'credit '+money(-pos.owed):'cleared'}</span></span>
        <input type="number" inputmode="decimal" value="${amt}" placeholder="0" onchange="App.setPayPeriodAmount('${loan.id}','${dateStr}',this.value)" style="width:96px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);text-align:right" /></div>`;
    }).join('');
    return `<div class="group-title" style="margin-top:20px">💳 Loan payments on ${fmtDay(dateStr)}</div>
      <div class="card"><p class="muted" style="font-size:12px;margin-bottom:6px">Set what you'll pay each loan this payday. It updates that loan's ledger.</p>${rows}</div>`;
  }
  async function setPayPeriodAmount(loanId, dateStr, val){
    const amt=parseFloat(val)||0;
    S.loanPayments={...(S.loanPayments||{})}; let list=[...(S.loanPayments[loanId]||[])];
    const idx=list.findIndex(p=>p.date===dateStr && p.src==='payday');
    if(amt>0){ if(idx>=0) list[idx]={...list[idx],amount:amt}; else list.push({id:'pp'+Date.now(), date:dateStr, amount:amt, src:'payday', note:'Payday'}); }
    else if(idx>=0){ list.splice(idx,1); }
    S.loanPayments[loanId]=list; await saveSettings(); await reconcileLoanBudget(); renderBudget();
  }

  /* ----- Recurring charges: compact entry (bottom of Budget) + its own page ----- */
  function recurringMonthlyTotals(){
    let mid=0,end=0;
    data.recurring.filter(r=>r.active!==false).forEach(r=>{ if(r.period==='mid')mid+=Number(r.amount||0); else end+=Number(r.amount||0); });
    return {mid,end,total:mid+end};
  }
  function recurringInner(){
    const list = data.recurring.slice().sort((a,b)=>(a.period+a.name).localeCompare(b.period+b.name));
    const t=recurringMonthlyTotals();
    let inner='';
    if(!list.length){ inner=`<p class="muted" style="font-size:13px;padding:4px 2px">No recurring charges yet — add rent, bills, subscriptions…</p>`; }
    else inner = list.map(r=>{
      const tf = (r.start_month||r.end_month)
        ? `${r.start_month?monthShort(r.start_month):'start'} – ${r.end_month?monthShort(r.end_month):'ongoing'}`
        : 'Always';
      const per = r.period==='mid'?'15th':'30th';
      const off = r.active===false;
      return `<div class="exp">

  /* ----- Calendar (payments + notes) ----- */
  let calMonth = new Date().toISOString().slice(0,7);

  function calMarks(){

    notes.forEach(n=>{ html+=`<div class="item"><div class="body"><div class="title">📝 ${esc(n.title||'Note')}</div>${n.body?`<div class="meta">${esc(n.body).slice(0,90)}</div>`:''}</div><button class="icon-btn" onclick="App.editNoteForm('${n.id}')">✏️</button></div>`; });

  /* ----- Loans (Dynamic Revolving Planning Engine) ----- */
  const PERIOD_LABEL = p => p==='mid' ? '15th Pay Period' : '30th Pay Period';
  const monthShort = ym => { const [y,m]=ym.split('-'); return new Date(y,m-1,1).toLocaleString(undefined,{month:'short',year:'2-digit'}); };
  const fmtDay = d => d ? new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '—';
  function nextPeriod(m,p){ if(p==='mid')return{month:m,period:'end'}; const d=new Date(m+'-01'); d.setMonth(d.getMonth()+1); return{month:d.toISOString().slice(0,7),period:'mid'}; }
  function periodDueDate(m,p){ const [y,mm]=m.split('-').map(Number); if(p==='mid')return m+'-15'; const last=new Date(y,mm,0).getDate(); return m+'-'+String(Math.min(30,last)).padStart(2,'0'); }
  function sortPeriods(a,b){ const k=x=>x.month+(x.period==='mid'?'1':'2'); return k(a)<k(b)?-1:k(a)>k(b)?1:0; }

  // Single source of truth: derive every window's balance from the fixed base (loan.balance),
  // carrying any overpayment forward as a negative (credit) into the next window.
  /* ----- Loans engine: dated dues + payments ----- */
  const ordinal=n=>{n=Number(n)||0;const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  function daysInMonth(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
  function dueDateStr(ym, day){ const d=Math.min(Number(day)||1, daysInMonth(ym)); return ym+'-'+String(d).padStart(2,'0'); }
  function monthsBetween(a,b){ const out=[]; let [y,m]=a.split('-').map(Number); const [ey,em]=b.split('-').map(Number); let g=0; while((y<ey||(y===ey&&m<=em)) && g<240){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} g++; } return out; }
  function loanFloor(loan){ return (loan.created_at? String(loan.created_at).slice(0,10) : (month+'-01')); }
  function loanEndDate(loan){ return (S.loanEnd&&S.loanEnd[loan.id])||null; }
  function loanDueList(loan){ return (S.loanDues&&S.loanDues[loan.id])||[]; }
  function loanPayList(loan){ return ((S.loanPayments&&S.loanPayments[loan.id])||[]).slice().sort((a,b)=>a.date<b.date?-1:1); }
  function loanDueOccurrences(loan, through){
    const end=loanEndDate(loan); if(end && end<through) through=end;   // stop dues after the loan ends
    const floor=loanFloor(loan), startYM=floor.slice(0,7), endYM=through.slice(0,7);
    const dues=loanDueList(loan), out=[];
    monthsBetween(startYM,endYM).forEach(ym=>dues.forEach(d=>{ const ds=dueDateStr(ym,d.day); if(ds>=floor && ds<=through) out.push({date:ds, amount:Number(d.amount)||0}); }));
    return out;
  }
  function loanPosition(loan){
    const t=todayStr();
    const dueSum=loanDueOccurrences(loan,t).reduce((s,d)=>s+d.amount,0);
    const paid=loanPayList(loan).filter(p=>p.date<=t).reduce((s,p)=>s+(Number(p.amount)||0),0);
    return {owed: Number(loan.balance||0)+dueSum-paid, paid};
  }
  function addMonths(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
  function loanLedgerEvents(loan){
    const horizon=Math.max(0, Number(S.loanHorizon||6));
    let endYM=addMonths(todayStr().slice(0,7), horizon);
    const pays=loanPayList(loan);
    if(pays.length){ const lastPay=pays[pays.length-1].date.slice(0,7); if(lastPay>endYM) endYM=lastPay; }
    const through=dueDateStr(endYM, 31);
    const dues=loanDueOccurrences(loan, through).map(d=>({date:d.date,type:'due',amount:d.amount}));
    const evPays=pays.map(p=>({date:p.date,type:'pay',amount:Number(p.amount)||0,id:p.id,note:p.note}));
    const ev=dues.concat(evPays).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.type==='due'?-1:1));
    let bal=Number(loan.balance||0); ev.forEach(e=>{ bal += e.type==='due'?e.amount:-e.amount; e.bal=bal; });
    return ev;
  }
  // Mirror every loan payment into the budget tracker as a "Loans" expense in its pay period
  async function reconcileLoanBudget(){
    // Loan payments show as live virtual lines now; quietly drop any old DB-synced
    // loan rows to avoid double-counting. Never let this throw a visible error.
    try{
      const stale=data.expenses.filter(e=>e && e.source==='loan');
      for(const e of stale){
        try{ const {error}=await sb.from('budget_expenses').delete().eq('id',e.id); if(!error){ const i=data.expenses.findIndex(x=>x.id===e.id); if(i>=0) data.expenses.splice(i,1); } }catch(_){}
      }
    }catch(_){}
  }

  /* ----- Admin: approve / reject payments ----- */
  async function approvePayment(id, userId){
    try{
      const { error } = await sb.from('access').upsert({ user_id:userId, paid:true, paid_at:new Date().toISOString() }, { onConflict:'user_id' });
      if(error){ alert('Approve failed: '+error.message); return; }
      const r = await sb.from('payment_submissions').update({ status:'approved' }).eq('id',id);
      if(r.error){ alert('Approve failed: '+r.error.message); return; }
      const s=data.submissions.find(x=>x.id===id); if(s)s.status='approved';
      renderSettings(); toast('Approved & unlocked ✓');
    }catch(e){ alert('Approve error: '+((e&&e.message)||e)); }
  }
  async function rejectPayment(id){
    try{
      const r = await sb.from('payment_submissions').update({ status:'rejected' }).eq('id',id);
      if(r.error){ alert('Reject failed: '+r.error.message); return; }
      const s=data.submissions.find(x=>x.id===id); if(s)s.status='rejected';
      renderSettings(); toast('Marked as rejected');
    }catch(e){ alert('Reject error: '+((e&&e.message)||e)); }
