<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#241a15" />
<title>Mugna · Café Ledger</title>

<!-- Fonts: Fraunces (display) · Hanken Grotesk (UI) · Spline Sans Mono (figures) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Supabase + Chart.js + Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --paper:#f3ede1;        /* kraft paper */
  --paper-2:#e9dfca;      /* deeper paper / wells */
  --card:#fffdf8;         /* card surface */
  --ink:#241a15;          /* espresso, near-black */
  --bean:#6b4a35;         /* mid coffee — secondary text */
  --bean-soft:#a98a73;    /* muted */
  --brass:#d35e2a;        /* Mugnâ sun — burnt orange */
  --brass-deep:#b54a1c;
  --sage:#5e7350;         /* money in */
  --sage-soft:#e7eede;
  --clay:#9e3a2b;         /* money out — deep brick */
  --clay-soft:#f1ddd5;
  --line:#e2d4bd;         /* hairline on paper */
  --line-soft:#efe5d2;
  --ok:#5e7350; --warn:#b97e2a; --bad:#b0543c;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(36,26,21,.06), 0 8px 24px rgba(36,26,21,.06);
  --mono:'Spline Sans Mono',ui-monospace,Menlo,monospace;
  --ui:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui); color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; line-height:1.45; font-size:15px;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:15px}
h1,h2,h3{font-family:var(--disp); font-weight:500; letter-spacing:-.01em; margin:0}
a{color:var(--brass-deep)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- Receipt-tear divider ---------- */
.tear{height:8px;background-image:radial-gradient(circle at 6px -2px, transparent 5px, var(--line) 5px);
  background-size:12px 8px; background-repeat:repeat-x; opacity:.7; margin:2px 0}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100dvh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(120% 90% at 50% -10%, #2f221b 0%, #241a15 55%, #1b130f 100%); color:var(--paper)}
.auth-card{width:min(420px,100%); background:var(--card); color:var(--ink); border-radius:18px;
  padding:34px 30px; box-shadow:0 30px 60px rgba(0,0,0,.35)}
.brand-mark{display:flex; align-items:center; gap:12px; margin-bottom:6px}
.brand-cup{width:44px;height:44px;border-radius:12px;background:var(--paper);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(36,26,21,.12);overflow:hidden}
.brand-cup svg{width:78%;height:78%;display:block}
#authView .brand-cup{width:60px;height:60px;border-radius:15px}
.brand-name{font-family:var(--disp); font-size:30px; line-height:1}
.brand-sub{color:var(--bean); font-size:13px; letter-spacing:.16em; text-transform:uppercase; margin-top:2px}
.auth-card h2{font-size:20px; margin:22px 0 4px}
.auth-card p.muted{color:var(--bean); font-size:13.5px; margin:0 0 18px}
label.fld{display:block; margin:14px 0 0}
label.fld>span{display:block; font-size:12.5px; font-weight:600; color:var(--bean); margin-bottom:6px; letter-spacing:.02em}
.input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--paper); color:var(--ink); outline:none}
.input:focus{border-color:var(--brass); box-shadow:0 0 0 3px rgba(211,94,42,.2)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent;
  padding:11px 16px; border-radius:var(--radius-sm); font-weight:600; font-size:14.5px; background:var(--paper-2); color:var(--ink)}
.btn:hover{filter:brightness(.98)}
.btn-primary{background:var(--ink); color:var(--paper)}
.btn-primary:hover{background:#34261d}
.btn-brass{background:var(--brass); color:#fff}
.btn-brass:hover{background:var(--brass-deep)}
.btn-ghost{background:transparent; border-color:var(--line)}
.btn-danger{background:var(--clay-soft); color:var(--clay); border-color:#eccabe}
.btn-block{width:100%}
.btn-sm{padding:7px 11px; font-size:13px; border-radius:99px}
.err{color:var(--clay); font-size:13px; margin-top:10px; min-height:1em}
.seg{display:flex; gap:6px; background:var(--paper-2); padding:4px; border-radius:11px; margin-top:6px}
.seg button{flex:1; border:none; background:transparent; padding:8px; border-radius:8px; font-weight:600; color:var(--bean); font-size:13.5px}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}

/* ---------- App shell ---------- */
.app{display:none; min-height:100dvh}
.app.show{display:grid; grid-template-columns:248px 1fr}
.side{position:sticky; top:0; height:100dvh; background:var(--ink); color:#e9ddcb; padding:18px 14px;
  display:flex; flex-direction:column; gap:4px; overflow-y:auto}
.side .brand-mark{margin:6px 8px 16px}
.side .brand-name{color:var(--paper); font-size:24px}
.nav-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:none; background:transparent;
  color:#cbb89f; padding:10px 12px; border-radius:10px; font-weight:600; font-size:14.5px}
.nav-btn .ico{width:20px; text-align:center; opacity:.9}
.nav-btn:hover{background:rgba(255,255,255,.06); color:#fff}
.nav-btn.on{background:var(--brass); color:#241a15}
.side-foot{margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); font-size:12.5px; color:#b39c81}
.side-foot .who{color:#f0e6d6; font-weight:600}
.role-pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin-top:6px; font-weight:700; letter-spacing:.04em}
.role-owner{background:var(--brass); color:#241a15}
.role-staff{background:var(--sage); color:#fff}
.role-investor{background:#3a2c22; color:#e9ddcb}

.main{min-width:0; padding:26px 30px 60px}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.topbar .eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--bean); font-weight:600}
.topbar h1{font-size:30px; margin-top:2px}
.readonly-banner{background:#3a2c22; color:#f0e6d6; border-radius:12px; padding:10px 14px; font-size:13.5px;
  display:flex; align-items:center; gap:9px; margin-bottom:16px}

/* mobile header + tabs */
.mobile-head{display:none}
@media (max-width:880px){
  .app.show{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:14px 14px 84px}
  .mobile-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; z-index:30; background:var(--ink); color:var(--paper);
    margin:-14px -14px 12px; padding:12px 14px; padding-top:max(12px,env(safe-area-inset-top))}
  .mobile-head .brand-name{color:var(--paper); font-size:22px}
  .mtabs{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; overflow-x:auto;
    background:var(--card); border-top:1px solid var(--line); padding:6px 6px max(6px,env(safe-area-inset-bottom))}
  .mtabs button{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none;
    color:var(--bean); font-size:11px; font-weight:600; padding:6px 12px; border-radius:10px; min-width:62px}
  .mtabs button.on{color:var(--brass-deep); background:var(--paper-2)}
  .mtabs .ico{font-size:18px}
  .topbar h1{font-size:24px}
}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:880px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}.cols-4.kpis{grid-template-columns:1fr 1fr}}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow)}
.card h3{font-size:17px; margin-bottom:4px}
.card .sub{color:var(--bean); font-size:13px; margin-bottom:14px}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 14px; flex-wrap:wrap}
.section-head h2{font-size:21px}

.kpi{display:flex; flex-direction:column; gap:6px}
.kpi .label{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--bean); font-weight:600}
.kpi .val{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.02em}
.kpi .val.in{color:var(--sage)} .kpi .val.out{color:var(--clay)}
.kpi .delta{font-size:12.5px; color:var(--bean)}

table{width:100%; border-collapse:collapse}
th,td{text-align:left; padding:10px 10px; border-bottom:1px solid var(--line-soft); font-size:14px; vertical-align:middle}
th{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--bean); font-weight:700; cursor:pointer; user-select:none}
th:hover{color:var(--ink)}
td.num,th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px}
.tag.business{background:var(--paper-2); color:var(--bean)}
.tag.personal{background:#e6e9f2; color:#46506b}
.tag.investor{background:var(--sage-soft); color:var(--sage)}
.tag.partner{background:var(--clay-soft); color:var(--clay)}
.tag.cash{background:var(--sage-soft); color:var(--sage)}
.tag.card{background:#e6e9f2; color:#46506b}
.tag.gcash,.tag.ewallet{background:#e3eefb; color:#1d6fb8}
.tag.bank{background:var(--paper-2); color:var(--bean)}
.tag.consumables{background:var(--sage-soft); color:var(--sage)}
.tag.recurring{background:#e3eefb; color:#1d6fb8}
.tag.fixed{background:#ece6f5; color:#6b4a9e}
.tag.onetime{background:var(--clay-soft); color:var(--clay)}
.tag.duplicate{background:var(--clay); color:#fff}
.muted{color:var(--bean)}
.right{text-align:right}
.row-actions{display:flex; gap:6px; justify-content:flex-end}
.iconbtn{border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 8px; font-size:13px}
.iconbtn:hover{border-color:var(--brass)}
.empty{text-align:center; color:var(--bean); padding:28px 12px}
.empty .big{font-size:30px; opacity:.5}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--line); border-radius:999px;
  background:var(--card); font-size:13px; font-weight:600; color:var(--bean)}
.chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

/* ---------- POS ---------- */
.pos-grid{display:grid; grid-template-columns:1fr 360px; gap:18px; align-items:start}
@media (max-width:980px){.pos-grid{grid-template-columns:1fr}}
.menu-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:12px}
.prod{position:relative; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:0; overflow:hidden; box-shadow:0 1px 2px rgba(36,26,21,.05); transition:transform .07s, box-shadow .1s, border-color .1s; cursor:pointer}
.prod:hover{border-color:var(--brass); box-shadow:0 6px 16px rgba(36,26,21,.10)}
.prod:active{transform:scale(.96)}
.prod .ph{height:96px; background:var(--paper-2); background-size:cover; background-position:center; display:grid; place-items:center; color:var(--bean-soft); font-size:30px}
.prod .pd{padding:11px 12px 13px}
.prod .pn{font-weight:600; font-size:14.5px; line-height:1.25; min-height:2.5em}
.prod .pp{font-family:var(--mono); font-size:14.5px; color:var(--sun-deep); font-weight:600; margin-top:5px}
.prod .lowtag{position:absolute; top:8px; right:8px; background:var(--clay); color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px}
.pos-cat{display:flex; align-items:center; gap:8px; margin:16px 2px 10px; font-family:var(--disp); font-size:18px; font-weight:600}
.cart{position:sticky; top:14px}
.cart .lines{max-height:none; margin:8px 0}
.cline{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line)}
.cline .nm{flex:1; font-size:13.5px; font-weight:600}
.qtybtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line); background:var(--card); font-weight:700; line-height:1}
.cline .lt{font-family:var(--mono); font-size:13px; width:78px; text-align:right}
.totrow{display:flex; justify-content:space-between; padding:5px 0; font-size:14px}
.totrow.grand{font-size:18px; font-weight:700; border-top:1px solid var(--line); margin-top:6px; padding-top:10px}
.totrow.grand .mono{font-size:20px}
.pay-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin:8px 0}
.pay-grid .chip{justify-content:center; cursor:pointer}

/* ---------- forms / modal ---------- */
.modal-back{position:fixed; inset:0; background:rgba(27,19,15,.5); backdrop-filter:blur(3px); z-index:100;
  display:grid; place-items:center; padding:16px}
.modal{background:var(--card); width:min(620px,100%); max-height:92dvh; overflow:auto; border-radius:18px; box-shadow:0 30px 70px rgba(0,0,0,.4)}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px}
.modal-head h3{font-size:20px}
.modal-body{padding:6px 20px 20px}
.modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:14px 20px 20px; position:sticky; bottom:0; background:var(--card)}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
.x{border:none; background:var(--paper-2); width:32px; height:32px; border-radius:99px; font-size:16px; color:var(--bean)}
textarea.input{min-height:64px; resize:vertical}
.help{font-size:12.5px; color:var(--bean); margin-top:6px}

/* toast */
.toasts{position:fixed; z-index:200; left:50%; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:10px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.3); font-weight:500}
.toast.bad{background:var(--clay)} .toast.ok{background:var(--sage)}

/* misc */
.kbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.spinner{width:18px;height:18px;border:2px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite; display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100dvh; display:grid; place-items:center; gap:14px; color:var(--bean)}
.thumb{width:42px;height:42px;border-radius:9px; object-fit:cover; background:var(--paper-2)}
.model-card{border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; background:var(--card)}
.model-card.on{border-color:var(--brass); box-shadow:0 0 0 2px rgba(185,126,42,.2)}
.model-card h4{margin:0 0 4px; font-family:var(--disp); font-weight:600; font-size:16px}
.model-card p{margin:0; font-size:13px; color:var(--bean)}
.bar{height:8px; background:var(--paper-2); border-radius:999px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--brass)}
.notice{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13.5px; color:var(--bean)}
.config-warn{background:var(--clay-soft); border:1px solid #eccabe; color:var(--clay); border-radius:12px; padding:14px 16px; margin:0 0 16px; font-size:14px}

/* shell components */
.apphead{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ink);color:var(--paper);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.homebtn{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--paper);cursor:pointer;padding:0}
.homebtn .brand-cup{width:34px;height:34px;border-radius:99px;background:var(--paper);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(36,26,21,.12)}
.homebtn .brand-cup svg{width:78%;height:78%}
.homebtn .brand-name{font-family:var(--disp);color:var(--paper)}
.lockbtn{background:rgba(255,255,255,.12);color:var(--paper);border:none;border-radius:999px;padding:9px 15px;font-weight:600;font-size:13px;cursor:pointer}
.lockbtn:active{transform:scale(.97)}
.main{padding:22px 22px 70px;max-width:1120px;margin:0 auto}
@media(max-width:880px){.main{padding:16px 14px 60px}}
.group{margin:6px 0 28px}
.group-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bean);margin:0 2px 14px}
.group-h .lockic{color:var(--bean-soft);font-weight:600;letter-spacing:.02em;text-transform:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 14px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .07s,box-shadow .07s}
.tile:hover{box-shadow:0 6px 18px rgba(36,26,21,.10)}
.tile:active{transform:scale(.96)}
.tile.locked{opacity:.7}
.tile .tico{font-size:32px;line-height:1;margin-bottom:9px}
.tile .tlabel{font-weight:600;font-size:14px}
.tile .tbadge{position:absolute;top:8px;right:8px;background:var(--brass);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--bean);font-weight:600;font-size:14.5px;margin-bottom:12px;cursor:pointer;padding:6px 2px}
.back:hover{color:var(--ink)}
.pindots{display:flex;gap:14px;justify-content:center;margin:16px 0 18px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.pindots i.on{background:var(--brass);border-color:var(--brass)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pinpad button{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:20px;font-weight:600;font-family:var(--mono);cursor:pointer}
.pinpad button:active{background:var(--paper-2)}
.table-filter-bar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}

/* Receipt View Styles */
.receipt-paper {
  background: #fff;
  border: 1px solid var(--line);
  padding: 20px;
  font-family: var(--mono);
  box-shadow: var(--shadow);
  max-width: 380px;
  margin: 0 auto;
}
.receipt-paper .r-head { text-align: center; border-bottom: 1px dashed #888; padding-bottom: 10px; margin-bottom: 10px; }
.receipt-paper .r-title { font-weight: 700; font-size: 16px; font-family: var(--disp); }
.receipt-paper .r-line { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; }
.receipt-paper .r-tot { border-top: 1px dashed #888; margin-top: 10px; padding-top: 8px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div id="loadingView" class="loading-screen"><span class="spinner"></span><div>Loading…</div></div>
<div id="cfgWarn" class="config-warn hide" style="margin:16px"></div>

<!-- ============ LOGIN ============ -->
<div id="authView" class="auth-wrap hide">
  <div class="auth-card">
    <div class="brand-mark"><div class="brand-cup"></div><div><div class="brand-name">Mugnâ</div><div class="brand-sub">Café</div></div></div>
    <h2 style="margin-top:18px">Sign in</h2>
    <p class="muted">Use the shared café login. Owner-only sections stay behind your PIN.</p>
    <label class="fld"><span>Email</span><input id="email" class="input" type="email" autocomplete="username" placeholder="team@mugna.coffee"></label>
    <label class="fld"><span>Password</span><input id="pass" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <div class="err" id="authErr"></div>
    <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:16px">Sign in</button>
  </div>
</div>

<!-- ============ APP ============ -->

/* ---------- Global Table Sorting & Filtering Helper ---------- */
const TableSortState = {}; 
function getSortState(key, defaultCol="date", defaultAsc=false) {
  if (!TableSortState[key]) {
    TableSortState[key] = { col: defaultCol, asc: defaultAsc, filter: "" };
  }
  return TableSortState[key];
}

function renderTableControls(key, placeholder="Search entries...", onUpdate=()=>{}) {
  const state = getSortState(key);
  const input = el("input", {
    class: "input",
    style: "max-width:300px; padding:6px 12px; font-size:13.5px;",
    placeholder: placeholder,
    value: state.filter || "",
    oninput: (e) => {
      state.filter = e.target.value.toLowerCase();
      onUpdate();
    }
  });
  return el("div", { class: "table-filter-bar" }, input);
}

function applySortAndFilter(data, key, filterFields=[], defaultCol="date") {
  const state = getSortState(key, defaultCol);
  let result = [...data];

  if (state.filter) {
    result = result.filter(item => {
      return filterFields.some(f => {
        let val = item[f];
        if (val === null || val === undefined) return false;
        if (typeof val === "object") val = JSON.stringify(val);
        return String(val).toLowerCase().includes(state.filter);
      });
    });
  }

  if (state.col) {
    result.sort((a, b) => {
      let va = a[state.col], vb = b[state.col];
      if (va === undefined || va === null) va = "";
      if (vb === undefined || vb === null) vb = "";
      
      if (typeof va === "string" && !isNaN(Date.parse(va))) va = new Date(va).getTime();
      if (typeof vb === "string" && !isNaN(Date.parse(vb))) vb = new Date(vb).getTime();

      if (va < vb) return state.asc ? -1 : 1;
      if (va > vb) return state.asc ? 1 : -1;
      return 0;
    });
  }

  return result;
}

function makeSortableTh(label, colName, stateKey, onUpdate=()=>{}) {
  const state = getSortState(stateKey);
  const isCurrent = state.col === colName;
  const arrow = isCurrent ? (state.asc ? " ▲" : " ▼") : "";
  return el("th", {
    onclick: () => {
      if (state.col === colName) {
        state.asc = !state.asc;
      } else {
        state.col = colName;
        state.asc = true;
      }
      onUpdate();
    }
  }, label + arrow);
}

/* ---------- Milk / Cup swap helpers (global, name-based) ----------
   Any ingredient whose name contains "milk" is a milk option; any
   ingredient whose name contains "cup" is a cup/size option. This lets
   a menu item's Milk or Cup recipe line be substituted at the POS
   (e.g. sub Oat Milk, upsize to 16oz) without per-item setup. */
function isMilkIng(ing){ return !!(ing && /milk/i.test(ing.name||"")); }
function isCupIng(ing){ return !!(ing && /cup/i.test(ing.name||"")); }
function milkLineOf(item,m){ m=m||ingMap(); return (item.recipe||[]).find(r=>isMilkIng(m[r.ingredient_id])); }
function cupLineOf(item,m){ m=m||ingMap(); return (item.recipe||[]).find(r=>isCupIng(m[r.ingredient_id])); }
function lineUpcharges(line){
  const m=ingMap(); let milk=0,cup=0;
  const milkDef=milkLineOf(line.item,m);
  if(line.milkSub && milkDef && line.milkSub!==milkDef.ingredient_id) milk=Number(m[line.milkSub]?.modifier_price||0);
  const cupDef=cupLineOf(line.item,m);
  if(line.cupSub && cupDef && line.cupSub!==cupDef.ingredient_id) cup=Number(m[line.cupSub]?.modifier_price||0);
  return {milk,cup};
}
function lineUnitPrice(line){
  const u=lineUpcharges(line);
  return (Number(line.item.price)||0) + u.milk + u.cup;
}
function modsLabel(mods,m){
  if(!mods) return "";
  m=m||ingMap(); const parts=[];
  if(mods.milk){const ing=m[mods.milk]; if(ing)parts.push(ing.name);}
  if(mods.cup){const ing=m[mods.cup]; if(ing)parts.push(ing.name);}
  return parts.length?` (${parts.join(", ")})`:"";
}
/* Resolves what's ACTUALLY consumed for one unit of an item given chosen
   mods: swaps the milk/cup ingredient id where applicable, and — when
   upsized to a bigger cup — scales every OTHER (non-cup) ingredient's
   quantity by +1/3 (×4/3), since a 16oz drink uses more milk, syrup,
   coffee, etc. than a 12oz one. The cup line itself just swaps SKU
   (still 1 cup either way), it doesn't scale. */
function effectiveRecipe(item, mods, m){
  m=m||ingMap();
  const cupDef=cupLineOf(item,m);
  const isUpsized=!!(mods && mods.cup && cupDef && mods.cup!==cupDef.ingredient_id);
  const scale=isUpsized?(4/3):1;
  return (item.recipe||[]).map(r=>{
    let ingId=r.ingredient_id, qty=Number(r.qty)||0;
    const baseIsCup=isCupIng(m[r.ingredient_id]);
    if(mods){
      if(mods.milk && isMilkIng(m[ingId])) ingId=mods.milk;
      else if(mods.cup && isCupIng(m[ingId])) ingId=mods.cup;
    }
    if(isUpsized && !baseIsCup) qty=qty*scale;
    return {ingredient_id:ingId, qty};
  });
}
/* True per-sale-line ingredient cost — follows whatever was actually consumed
   (including milk/cup swaps and the upsize portion increase), not just the
   menu's default recipe. */
function cogsOfSaleLine(li,m){
  m=m||ingMap();
  const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi) return 0;
  let c=0;
  effectiveRecipe(mi, li.mods, m).forEach(r=>{
    const ing=m[r.ingredient_id]; if(ing) c+=r.qty*(Number(ing.cost_per_unit)||0);
  });
  return c;
}
/* Substitutions report: for a set of sales, tally each milk/cup swap actually
   sold — how many times, the extra ingredient cost it caused vs the default
   recipe, and the upcharge revenue actually collected for it. Upsize's
   quantity-increase cost (the +1/3 across milk, syrup, coffee, etc.) is
   tallied separately from the milk-brand or cup-SKU swap cost so the two
   effects don't get double-counted. */
function computeSwapReport(sales){
  const m=ingMap(); const rows={};
  function addRow(name,count,extraCost,revenue){
    rows[name]=rows[name]||{name,count:0,extraCost:0,revenue:0};
    rows[name].count+=count; rows[name].extraCost+=extraCost; rows[name].revenue+=revenue;
  }
  sales.forEach(s=>(s.items||[]).forEach(li=>{
    if(!li.mods) return;
    const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi) return;
    const milkDef=milkLineOf(mi,m), cupDef=cupLineOf(mi,m);
    const isUpsized=!!(li.mods.cup && cupDef && li.mods.cup!==cupDef.ingredient_id);
    const scale=isUpsized?(4/3):1;

    if(li.mods.milk && milkDef && li.mods.milk!==milkDef.ingredient_id){
      const sub=m[li.mods.milk], def=m[milkDef.ingredient_id];
      const extraCost=((Number(sub?.cost_per_unit)||0)-(Number(def?.cost_per_unit)||0))*(Number(milkDef.qty)||0)*li.qty;
      addRow(sub?.name||"Milk swap", li.qty, extraCost, (Number(li.milkUpcharge)||0)*li.qty);
    }
    if(li.mods.cup && cupDef && li.mods.cup!==cupDef.ingredient_id){
      const sub=m[li.mods.cup], def=m[cupDef.ingredient_id];
      const extraCost=((Number(sub?.cost_per_unit)||0)-(Number(def?.cost_per_unit)||0))*(Number(cupDef.qty)||0)*li.qty;
      addRow(sub?.name||"Size swap", li.qty, extraCost, (Number(li.cupUpcharge)||0)*li.qty);
    }
    if(isUpsized){
      // +1/3 portion on every non-cup ingredient, valued at whatever that
      // ingredient actually is (the swapped-in milk if one was chosen)
      let upsizeCost=0;
      (mi.recipe||[]).forEach(r=>{
        if(isCupIng(m[r.ingredient_id])) return;
        let ingId=r.ingredient_id;
        if(li.mods.milk && isMilkIng(m[ingId])) ingId=li.mods.milk;
        const ing=m[ingId], baseQty=Number(r.qty)||0;
        upsizeCost += baseQty*(scale-1)*(Number(ing?.cost_per_unit)||0);
      });
      addRow("Upsize (16oz) — extra portions", li.qty, upsizeCost*li.qty, 0);
    }
  }));
  return Object.values(rows);
}

/* ============================================================
   OCR SCANNER HELPER (REUSABLE)
   ============================================================ */
function createOcrScannerModal(targetType="sales") {
  const isSales = targetType === "sales";
  const dateIn = el("input", {class:"input", type:"datetime-local", value: nowLocalISO()});
  const fileIn = el("input", {type:"file", accept:"image/*", style:"display:none;"});
  const fileBtn = el("button", {class:"btn btn-brass btn-block", onclick:()=>fileIn.click()}, "📷 Take Photo or Select Image");
  const statusDiv = el("div", {class:"help", style:"margin-top:10px; text-align:center; font-weight:600;"});
  const previewImg = el("img", {style:"max-width:100%; max-height:200px; border-radius:10px; margin-top:10px; display:none;"});
  const resultsBox = el("div", {style:"margin-top:14px;"});

  let scannedItems = [];

  fileIn.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    previewImg.src = URL.createObjectURL(file);
    previewImg.style.display = "block";
    statusDiv.textContent = "Scanning document for numbers and line items... Please wait.";
    resultsBox.innerHTML = "";

    try {
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(file);
      await worker.terminate();

      const lines = ret.data.text.split('\n').filter(l => l.trim().length > 0);
      scannedItems = [];

      lines.forEach(line => {
        // Look for line items ending with price/amount
        const matches = line.match(/(.*?)(?:₱|\$)?\s*(\d+(?:\.\d{2})?)\s*$/);
        if (matches) {
          const desc = matches[1].replace(/[^a-zA-Z0-9\s]/g, "").trim() || "Scanned Item";
          const amount = parseFloat(matches[2]);
          if (amount > 0) {
            scannedItems.push({ desc, amount });
          }
        }
      });

      statusDiv.textContent = `Scan Complete! Found ${scannedItems.length} potential entry/entries.`;
      renderDetectedItems();
    } catch (err) {
      statusDiv.textContent = "Error scanning image. " + err.message;
    }
  };

  function renderDetectedItems() {
    resultsBox.innerHTML = "";
    if(!scannedItems.length){
      resultsBox.append(el("div", {class:"notice"}, "Could not parse line items clearly. You can add items manually below or try a clearer photo."));
    }

    scannedItems.forEach((item, idx) => {
      const descIn = el("input", {class:"input", style:"flex:2", value: item.desc});
      const amtIn = el("input", {class:"input", type:"number", step:"0.01", style:"width:90px", value: item.amount});
      
      const row = el("div", {style:"display:flex; gap:6px; margin-bottom:6px; align-items:center;"},
        descIn, amtIn,
        el("button", {class:"iconbtn", onclick:()=>{ scannedItems.splice(idx,1); renderDetectedItems(); }}, "✕")
      );
      descIn.oninput = (e) => item.desc = e.target.value;

    });

    resultsBox.append(el("button", {class:"btn btn-ghost btn-sm", style:"margin-top:6px;", onclick:()=>{
      scannedItems.push({ desc:"Custom Item", amount: 0 });

    }}, "+ Add Item Line"));
  }

  // Extra inputs for Expense Scanning
  const supplierIn = el("input", {class:"input", placeholder:"Vendor / Store Name"});

  const body = el("div", {},
    field(isSales ? "Date & Time for Scanned Sales" : "Expense Date", dateIn),
    !isSales ? field("Supplier / Store Name", supplierIn) : null,
    el("div", {style:"margin-top:10px;"}, fileBtn, fileIn),
    previewImg,
    statusDiv,
    resultsBox
  );

  openModal({
    title: isSales ? "Scan Sales Receipt or Logbook" : "Scan Expense Receipt or Invoice",
    body,
    footer: bk => [
      el("button", {class:"btn btn-ghost", onclick:()=>bk.remove()}, "Cancel"),
      el("button", {class:"btn btn-brass", onclick:async()=>{
        if(!scannedItems.length) return toast("No line items to save", "bad");
        const targetDate = new Date(dateIn.value).toISOString();

        if (isSales) {
          for (const s of scannedItems) {
            if (s.amount > 0) {
              await ins("sales", {
                items: [{ name: s.desc, qty: 1, price: s.amount }],
                subtotal: s.amount,
                total: s.amount,
                payment_method: "Cash",
                payment_status: "paid",
                note: "Imported via Receipt/Log Scanner",
                sold_at: targetDate
              });
            }
          }
          await refresh("sales");
          bk.remove();
          drawSalesTable();
          if($("#salesKpis")) drawSummaryKpis();
          toast("Scanned sales logged successfully!", "ok");
        } else {
          // Saving to Expenses
          const totalAmt = scannedItems.reduce((acc, i) => acc + (i.amount || 0), 0);
          const validItems = scannedItems.map(i => ({ name: i.desc, qty: 1, price: i.amount }));
          
          await ins("expenses", {
            spent_at: dateIn.value.slice(0, 10),
            supplier: supplierIn.value.trim() || "Scanned Receipt",
            description: "Imported via OCR Receipt Scanner",
            items: validItems,
            category: "Supplies",
            amount: totalAmt,
            expense_type: "Consumables",
            source: "Business",
            has_receipt: "Yes",
            status: isOwner() ? "approved" : "pending"
          });

          await refresh("expenses");
          bk.remove();
          go("expenses");
          toast("Scanned expense logged!", "ok");
        }
      }}, isSales ? "Save All Scanned Sales" : "Save as Expense")
    ]
  });
}

}

async function completeSale(opts={}){
  const items=Object.values(CART).map(c=>{
    const up=lineUpcharges(c);
    return {menu_id:c.item.id,name:c.item.name,price:lineUnitPrice(c),qty:c.qty,
      mods:(c.milkSub||c.cupSub)?{milk:c.milkSub||null,cup:c.cupSub||null}:undefined,
      milkUpcharge:up.milk||undefined, cupUpcharge:up.cup||undefined};
  });
  if(!items.length)return;
  const subtotal=cartTotal(), tip=CART_TIP||0, discount=CART_DISC||0;
  const phone=CART_PHONE, custId=CART_CUST_ID;
  const soldAtISO = CART_DATE ? new Date(CART_DATE).toISOString() : new Date().toISOString();
  // Backdated entries (e.g. logging a sale that happened earlier and wasn't rung up
  // at the time) shouldn't pull from today's stock — those ingredients were already
  // used up in the past, not from what's currently on the shelf.
  const willDeduct = isToday(soldAtISO);

  try{
    await ins("sales",{items, subtotal, discount, tip, total:subtotal-discount+tip, payment_method:CART_PAY, note:CART_NOTE, payment_status:opts.unpaid?"unpaid":"paid", sold_at:soldAtISO, status:"completed", inventory_deducted:willDeduct});
    if(willDeduct) await deductInventory(items, +1);
    if(phone){ try{await loyaltyStamp(phone, null);}catch(_){} }
    if(custId){ try{await upd("customer_orders",custId,{status:"done"});}catch(_){} }
    await Promise.all([refresh("sales"),refresh("ingredients"),refresh("customer_orders")]);
    clearCart();drawCart();drawSalesTable();
    const iw=$("#incomingWrap"); if(iw)drawIncoming(iw);
    toast(opts.unpaid?"Saved as unpaid":(willDeduct?"Sale recorded":"Sale recorded (backdated — stock not deducted)"),"ok");
  }catch(e){toast(e.message||"Could not save sale","bad");}
}
function saleNet(s){return Number(s.subtotal!=null?s.subtotal:(s.total||0))-Number(s.discount||0);}
function isActiveSale(s){ return (s.status||"completed")!=="cancelled"; }

async function deductInventory(items, sign){
  const m=ingMap(); const deltas={};
  items.forEach(li=>{const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi)return;
    effectiveRecipe(mi, li.mods, m).forEach(r=>{
      deltas[r.ingredient_id]=(deltas[r.ingredient_id]||0)+ r.qty*li.qty*sign;
    });});
  for(const id in deltas){const ing=m[id]; if(!ing||ing.stock_qty==null)continue;
    const next=Number(ing.stock_qty)-deltas[id];
    try{await upd("ingredients",id,{stock_qty:next});}catch(_){}}
}

  const body=el("div",{},

  openModal({title:"Edit sale",body,footer:(bk)=>[
    el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Cancel"),
    el("button",{class:"btn btn-primary",onclick:async()=>{

      const soldAt=new Date(dateIn.value).toISOString();
      const wasDeducted = s.inventory_deducted!==false; // undefined = old record, was deducted
      const shouldDeduct = isToday(soldAt);
      try{
        // If the date edit crosses the "today" boundary, reconcile stock so it stays accurate
        if(wasDeducted && !shouldDeduct){ await deductInventory(s.items||[],-1); }
        else if(!wasDeducted && shouldDeduct){ await deductInventory(s.items||[],+1); }
        await upd("sales",s.id,{payment_method:pay,tip,note:noteIn.value,total:Number(s.subtotal||0)-Number(s.discount||0)+tip, sold_at:soldAt, inventory_deducted:shouldDeduct});

const CANCEL_REASONS=["Change order","Cancel","Refund"];
function cancelSale(s){
  let reason="Cancel";
  const rg=el("div",{class:"pay-grid"});
  CANCEL_REASONS.forEach(r=>{const b=el("button",{class:"chip"+(reason===r?" on":""),onclick:()=>{reason=r;$$(".chip",rg).forEach(x=>x.classList.remove("on"));b.classList.add("on"); noteBox.innerHTML=noteFor(r);}},r);rg.append(b);});
  function noteFor(r){
    if(r==="Refund") return "Item was already made & served — stock stays deducted, this just marks it refunded.";
    if(r==="Change order") return "Order gets voided and stock is restored — ring up the correct item as a new sale.";
    return "Order voided before it was made — stock is restored.";
  }
  const noteBox=el("div",{class:"notice",style:"margin-top:8px"},noteFor(reason));
  const notesIn=el("input",{class:"input",placeholder:"Optional note (what happened)"});
  const body=el("div",{},
    el("p",{class:"muted",style:"margin-top:0"},`Cancelling ${s.items?.length?`${s.items.reduce((a,i)=>a+i.qty,0)} item(s)`:"this order"} · ${peso(s.total)}. This stays on record as a cancelled sale — it isn't deleted.`),
    field("Reason",rg), noteBox, field("Note",notesIn));
  openModal({title:"Cancel order",body,footer:bk=>[
    el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Back"),
    el("button",{class:"btn btn-primary",onclick:async()=>{
      try{
        const wasDeducted = s.inventory_deducted!==false;
        const restoreStock = wasDeducted && reason!=="Refund"; // Cancel & Change order restore stock; Refund keeps it deducted (item was made)
        if(restoreStock) await deductInventory(s.items||[],-1);
        await upd("sales",s.id,{status:"cancelled", cancel_reason:reason, cancel_note:notesIn.value.trim(), cancelled_at:new Date().toISOString(), payment_status: reason==="Refund"?"refunded":s.payment_status});
        await Promise.all([refresh("sales"),refresh("ingredients")]);
        bk.remove(); drawSalesTable(); if($("#salesKpis"))drawSummaryKpis(); toast("Order cancelled","ok");
      }catch(e){toast(e.message,"bad");}
    }},"Confirm cancel")]});
}

let DASH_RANGE="30";
function renderDashboard(root){
  root.append(topbar("Reporting Dashboard","Sales, expenses and what's left over"));

    rangeChips(DASH_RANGE,v=>{DASH_RANGE=v;go("dashboard");})));
  root.append(head);

  const exps=State.data.expenses.filter(e=>inRange(e.spent_at||e.created_at,DASH_RANGE));
  const grossSales=sales.reduce((a,s)=>a+saleNet(s),0);
  const tips=sales.reduce((a,s)=>a+Number(s.tip||0),0);
  const counted=exps.filter(e=>(e.status||"approved")!=="pending");
  const pendingCount=exps.length-counted.length;
  const isOneTime=e=>(e.expense_type||"")==="One-time";
  const operatingExp=counted.filter(e=>!isOneTime(e)).reduce((a,e)=>a+Number(e.amount||0),0);
  const oneTimeExp=counted.filter(isOneTime).reduce((a,e)=>a+Number(e.amount||0),0);
  const net=grossSales-operatingExp;
  
  const kpis=el("div",{class:"grid cols-4 kpis"});
  kpis.append(kpiCard("Sales (excl. tips)",peso(grossSales),"in",`${sales.length} order(s)`));
  kpis.append(kpiCard("Operating expenses",peso(operatingExp),"out","consumables · fixed · recurring"));
  kpis.append(kpiCard("Net profit",peso(net),net>=0?"in":"out",net>=0?"in the black":"in the red"));
  kpis.append(kpiCard("One-time / capital",peso(oneTimeExp),"out","kept out of profit"));
  root.append(kpis);
  root.append(el("div",{class:"notice",style:"margin-top:10px"},`Tips collected: ${peso(tips)} — staff money, not counted in profit.`+(pendingCount?`  ·  ${pendingCount} expense(s) pending approval, not yet counted.`:"")));

const CAT_PALETTE=["#B5714B","#6E8F63","#C99A3E","#7A6BA6","#4E8FA3","#B65C6C","#8C9E4E","#5C7AB6","#C77B45","#5E9E8A"];
function catColorMap(){ const c=State.data.settings&&State.data.settings.config&&State.data.settings.config.category_colors; return (c&&typeof c==="object")?c:{}; }

  let h=0; for(let i=0;i<String(cat).length;i++) h=(h*31+String(cat).charCodeAt(i))>>>0;
  return CAT_PALETTE[h%CAT_PALETTE.length];
}

let BIZ_GRAIN="month"; // "month" | "week"
let BIZ_PERIODS=6;
function isoWeekKey(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThur=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const week=1+Math.round(((t-firstThur)/86400000-3+((firstThur.getUTCDay()+6)%7))/7);
  return {key:`${t.getUTCFullYear()}-W${String(week).padStart(2,"0")}`, label:`Wk ${week}, ${t.getUTCFullYear()}`};
}
/* Splits every expense (or, when itemized, every LINE ITEM) into Stock vs
   Other, bucketed by month or week. Only line items whose category is
   "Stock" count toward stock spend — everything else on the same receipt
   (even from the same store) falls into Other. */
function expenseStockSplit(grain){
  const buckets={};
  State.data.expenses.forEach(e=>{
    const d=new Date(e.spent_at||e.created_at); if(isNaN(d))return;
    let key,label;
    if(grain==="week"){ const w=isoWeekKey(d); key=w.key; label=w.label; }
    else { key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; label=d.toLocaleString("en-PH",{month:"short",year:"numeric"}); }
    buckets[key]=buckets[key]||{key,label,stock:0,other:0,sortD:d};
    if(d<buckets[key].sortD) buckets[key].sortD=d;
    const items=(e.items&&e.items.length)?e.items:null;
    if(items){
      items.forEach(it=>{
        const amt=(Number(it.qty)||1)*(Number(it.price)||0);
        const cat=(it.category||e.category||"").toLowerCase();
        if(cat==="stock") buckets[key].stock+=amt; else buckets[key].other+=amt;
      });
    } else {
      const amt=Number(e.amount||0);
      if((e.category||"").toLowerCase()==="stock") buckets[key].stock+=amt; else buckets[key].other+=amt;
    }
  });
  return Object.values(buckets).sort((a,b)=>b.sortD-a.sortD);
}
/* Every ingredient actually consumed across a set of sales (swaps & upsize
   scaling already resolved), with quantity and true cost — the "detailed
   view" behind the Stock Used number. */
function stockUsedDetail(sales){
  const m=ingMap(); const totals={};
  sales.forEach(s=>(s.items||[]).forEach(li=>{
    const mi=State.data.menu.find(x=>x.id===li.menu_id); if(!mi) return;
    effectiveRecipe(mi, li.mods, m).forEach(r=>{
      const ing=m[r.ingredient_id]; if(!ing) return;
      totals[r.ingredient_id]=totals[r.ingredient_id]||{name:ing.name,unit:ing.unit||"",qty:0,cost:0};
      totals[r.ingredient_id].qty += r.qty*li.qty;
      totals[r.ingredient_id].cost += r.qty*li.qty*(Number(ing.cost_per_unit)||0);
    });
  }));
  return Object.values(totals).sort((a,b)=>b.cost-a.cost);
}
/* Ingredients bought from more than one supplier, e.g. "Bravo Condensed" from
   two different stores — so you can see who's cheapest at a glance. */

    .map(i=>({...i,suppliers:[...i.suppliers].sort((a,b)=>Number(a.price)-Number(b.price))}));
}

  )));
  const tb=el("tbody");

    const who = e.source==="Investor"||e.source==="Partner" ? `${e.source}${e.partner_name?` · ${e.partner_name}`:""}` : (e.source||"Business");
    const pending=(e.status||"approved")==="pending";
    const isDup = duplicatesSet.has(e.id);

    tb.append(el("tr",{},
      el("td",{class:"muted",style:"white-space:nowrap"},fmtDate(e.spent_at||e.created_at)),
      el("td",{class:"mono",style:"font-weight:600;font-size:13px"},e.receipt_no||"—"),
      el("td",{style:"font-weight:600"},e.supplier||"—"),
      el("td",{style:"font-weight:600"},
        e.description||"—", 
        pending?el("span",{class:"tag fixed",style:"margin-left:6px"},"Pending"):null,
        isDup?el("span",{class:"tag duplicate",style:"margin-left:6px"},"DUPLICATE"):null
      ),
      el("td",{class:"muted"},e.category||"—"),
      el("td",{}, el("span",{class:"tag "+typeClass(e.expense_type)},e.expense_type||"Consumables")),
      el("td",{}, el("span",{class:"tag "+(e.source||"business").toLowerCase()},who)),
      el("td",{}, e.has_receipt==="No" ? el("span",{class:"muted",title:e.no_receipt_reason||"No reason provided"},`No (${e.no_receipt_reason||"No reason"})`) : "Yes"),
      el("td",{class:"num"},peso(e.amount)),
      el("td",{}, el("div",{class:"row-actions"},
        el("button",{class:"iconbtn",title:"View Receipt",onclick:()=>viewReceipt(e)},"🧾"),
        isOwner() && pending?el("button",{class:"iconbtn",title:"Approve",onclick:async()=>{await upd("expenses",e.id,{status:"approved"});await refresh("expenses");go("expenses");}},"✓"):null,
        isOwner()?el("button",{class:"iconbtn",onclick:()=>editExpense(e)},"✎"):null,
        isOwner()?el("button",{class:"iconbtn",onclick:()=>confirmDel("this expense",async()=>{await del("expenses",e.id);await refresh("expenses");go("expenses");})},"🗑"):null)) ));
  });
  const tot=rows.reduce((a,e)=>a+Number(e.amount||0),0);
  t.append(tb);
  t.append(el("tfoot",{},el("tr",{}, el("td",{colspan:"8",style:"font-weight:700"},`${rows.length} entr(ies)`), el("td",{class:"num",style:"font-weight:700"},peso(tot)), el("td",{}))));

const DEFAULT_EXP_CATS=["Stock","Supplies","Employee salary","Rent","Utilities","Marketing","Other"];
function expCats(){ const c=State.data.settings&&State.data.settings.config&&State.data.settings.config.expense_categories; return (Array.isArray(c)&&c.length)?c:DEFAULT_EXP_CATS; }
function manageCats(){
  let cats=expCats().slice();
  const box=el("div",{});
  function draw(){ box.innerHTML="";
    cats.forEach((c,idx)=>{
      const inp=el("input",{class:"input",style:"flex:1",value:c,oninput:e=>cats[idx]=e.target.value});
      box.append(el("div",{style:"display:flex;gap:8px;margin-top:8px;align-items:center"},inp,
        el("button",{class:"iconbtn",onclick:()=>{cats.splice(idx,1);draw();}},"✕")));
    });
    box.append(el("button",{class:"btn btn-ghost btn-sm",style:"margin-top:8px",onclick:()=>{cats.push("");draw();}},"+ Add category"));
  }
  draw();
  openModal({title:"Expense categories",body:el("div",{},el("p",{class:"muted",style:"margin-top:0"},"These appear in the expense dropdown."),box),

      el("button",{class:"btn btn-primary",onclick:async()=>{const clean=cats.map(x=>x.trim()).filter(Boolean); await saveSettings({config:{...(State.data.settings.config||{}),expense_categories:clean}}); bk.remove(); go("expenses"); toast("Categories saved","ok");}},"Save")]});
}

function editExpense(e){
  const date=el("input",{class:"input",type:"date",value:(e?.spent_at||todayISO()).slice(0,10)});
  const receiptNo=el("input",{class:"input",value:e?.receipt_no||"",placeholder:"INV-12345 or Receipt #" });
  const supplier=el("input",{class:"input",value:e?.supplier||"",placeholder:"Store / Vendor name"});
  const desc=el("input",{class:"input",value:e?.description||"",placeholder:"Summary (e.g. Weekly Groceries)"});
  
  const cat=el("select",{class:"input"});
  expCats().forEach(c=>cat.append(el("option",{value:c},c)));
  if(e?.category && !expCats().includes(e.category)) cat.append(el("option",{value:e.category},e.category));
  cat.value=e?.category||expCats()[0];

  const totalAmtInput=el("input",{class:"input",type:"number",step:"0.01",value:e?.amount??"", placeholder:"Total ₱"});

  let items = JSON.parse(JSON.stringify(e?.items || []));
  const itemsContainer = el("div", {style:"margin-top:8px;"});

  function recalcTotalFromItems() {
    if (items.length > 0) {
      const sum = items.reduce((acc, it) => acc + (Number(it.qty||0) * Number(it.price||0)), 0);
      totalAmtInput.value = sum ? sum.toFixed(2) : "";
    }
  }

  function renderItemsList() {
    itemsContainer.innerHTML = "";
    items.forEach((it, idx) => {
      const nameIn = el("input", {class:"input", style:"flex:2", value:it.name||"", placeholder:"Item name", oninput:ev=>{items[idx].name=ev.target.value;}});
      const qtyIn = el("input", {class:"input", type:"number", step:"any", style:"width:65px", value:it.qty??"1", placeholder:"Qty", oninput:ev=>{items[idx].qty=parseFloat(ev.target.value)||0; recalcTotalFromItems();}});
      const priceIn = el("input", {class:"input", type:"number", step:"0.01", style:"width:85px", value:it.price??"", placeholder:"₱ Price", oninput:ev=>{items[idx].price=parseFloat(ev.target.value)||0; recalcTotalFromItems();}});
      
      const itemCatSel = el("select", {class:"input", style:"flex:1.5", onchange:ev=>{items[idx].category=ev.target.value;}});
      expCats().forEach(c=>itemCatSel.append(el("option",{value:c},c)));
      itemCatSel.value = it.category || cat.value || "Supplies";
      
      const row = el("div", {style:"display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap;"},
        nameIn, qtyIn, priceIn, itemCatSel,
        el("button", {class:"iconbtn", onclick:()=>{ items.splice(idx,1); renderItemsList(); recalcTotalFromItems(); }}, "✕")
      );
      itemsContainer.append(row);
    });
  }

  const addItemBtn = el("button", {class:"btn btn-ghost btn-sm", style:"margin-top:6px;", onclick:()=>{
    items.push({name:"", qty:1, price:0, category: cat.value || "Supplies"});
    renderItemsList();
  }}, "+ Add line item");

  renderItemsList();

  let source=e?.source||"Business";
  let partnerId=e?.partner_id||"";
  const partnerWrap=el("div",{});
  const srcSel=el("select",{class:"input",onchange:ev=>{source=ev.target.value; drawPartner();}});
  ["Business","Personal","Investor","Partner"].forEach(s=>srcSel.append(el("option",{value:s},s)));
  srcSel.value=source;
  function drawPartner(){
    partnerWrap.innerHTML="";
    if(source==="Investor"||source==="Partner"){
      const sel=el("select",{class:"input",onchange:ev=>partnerId=ev.target.value});
      sel.append(el("option",{value:""},"— select person —"));
      State.data.partners.filter(p=> source==="Investor"? p.role==="investor" : true).forEach(p=>sel.append(el("option",{value:p.id},p.name)));
      sel.value=partnerId;
      partnerWrap.append(field(`Which ${source.toLowerCase()}?`,sel, State.data.partners.length?"":"Add people in the Profit tab first"));
    }
  }
  drawPartner();

  let etype=e?.expense_type||"Consumables";
  const typeSel=el("select",{class:"input",onchange:ev=>etype=ev.target.value});
  EXP_TYPES.forEach(s=>typeSel.append(el("option",{value:s},s)));
  typeSel.value=etype;

  let hasReceipt = e?.has_receipt || "Yes";
  const reasonIn = el("input", {class:"input", value:e?.no_receipt_reason||"", placeholder:"Reason for no receipt"});
  const reasonWrap = el("div", {class:hasReceipt==="No"?"":"hide"}, field("Reason why no receipt", reasonIn));
  const receiptSel = el("select", {class:"input", onchange:(ev)=>{
    hasReceipt = ev.target.value;
    if(hasReceipt === "No") reasonWrap.classList.remove("hide");
    else reasonWrap.classList.add("hide");
  }}, el("option",{value:"Yes",selected:hasReceipt==="Yes"},"Yes"), el("option",{value:"No",selected:hasReceipt==="No"},"No"));

  const body=el("div",{},
    el("div",{class:"form-row"},field("Date",date),field("Inv / Receipt #",receiptNo)),
    field("Supplier / Vendor", supplier),
    field("Description / Summary",desc),
    el("div",{style:"margin-top:10px; border:1px solid var(--line); padding:10px; border-radius:10px; background:var(--paper-2)"},
      el("span",{style:"font-size:12.5px; font-weight:700; color:var(--bean);"}, "Itemized Breakdown (Optional)"),
      itemsContainer,
      addItemBtn
    ),
    el("div",{class:"form-row", style:"margin-top:10px;"},field("Total Amount (₱)",totalAmtInput),field("Overall Category",cat)),
    el("div",{class:"form-row"},field("Type",typeSel,"One-time = capital/setup; left out of operating profit"),field("Paid by",srcSel)),
    partnerWrap,
    field("With receipt?", receiptSel),
    reasonWrap
  );

  openModal({title:e?"Edit expense":"New expense",body,footer:bk=>[
    el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Cancel"),
    el("button",{class:"btn btn-brass",onclick:async()=>{
      if(!totalAmtInput.value)return toast("Amount required","bad");

      const dVal = date.value || todayISO();
      const sVal = supplier.value.trim();
      const existing = State.data.expenses.find(x => x.id !== e?.id && (x.spent_at||"").slice(0,10) === dVal && (x.supplier||"").toLowerCase() === sVal.toLowerCase() && sVal !== "");
      if (existing) {
        if(!confirm("Warning: An expense entry for this Date and Supplier already exists. Proceed anyway?")) return;
      }

      const btn=bk.querySelector(".btn-brass");btn.disabled=true;btn.textContent="Saving…";
      try{
        const pName=(source==="Investor"||source==="Partner")?(State.data.partners.find(p=>p.id===partnerId)?.name||null):null;
        const validItems = items.filter(it => it.name.trim() !== "");

        const row={spent_at:dVal, receipt_no:receiptNo.value.trim(), supplier:sVal, description:desc.value.trim(), items:validItems, category:cat.value.trim(), amount:parseFloat(totalAmtInput.value)||0,
          expense_type:etype,source,partner_id:partnerId||null,partner_name:pName,
          has_receipt:hasReceipt, no_receipt_reason:hasReceipt==="No"?reasonIn.value.trim():"",
          status: isOwner()?"approved":"pending"};

        e?await upd("expenses",e.id,row):await ins("expenses",row);

        // Sync items categorized as "Stock" or "Ingredients" to the Ingredients tab
        for (const line of validItems) {
          const itemCat = (line.category || "").toLowerCase();
          if (itemCat === "stock" || itemCat === "ingredients" || itemCat === "ingredient") {
            const ingName = line.name.trim();
            const unitPrice = parseFloat(line.price) || 0;
            const existingIng = State.data.ingredients.find(i => i.name.toLowerCase().trim() === ingName.toLowerCase());

            if (existingIng) {
              const currentSups = Array.isArray(existingIng.suppliers) ? existingIng.suppliers : [];
              if (sVal && !currentSups.some(s => s.name.toLowerCase() === sVal.toLowerCase())) {
                currentSups.push({ name: sVal, price: unitPrice });
              }
              await upd("ingredients", existingIng.id, {
                cost_per_unit: unitPrice > 0 ? unitPrice : existingIng.cost_per_unit,
                suppliers: currentSups
              });
            } else {
              await ins("ingredients", {
                name: ingName,
                cost_per_unit: unitPrice,
                unit: "pc",
                stock_qty: parseFloat(line.qty) || 0,
                suppliers: sVal ? [{ name: sVal, price: unitPrice }] : []
              });
            }
          }
        }

        await Promise.all([refresh("expenses"), refresh("ingredients")]); 
        bk.remove(); go("expenses"); toast("Saved & Ingredients synced","ok");
      }catch(err){toast(err.message,"bad");btn.disabled=false;btn.textContent="Save";}
    }},"Save")]});
}

function uploadDoc(){

      if(!file)return toast("Pick a file","bad");

        await ins("documents",{name:name.value.trim()||file.name,kind,url:up.url,path:up.path});
        await refresh("documents"); bk.remove(); go("documents"); toast("Uploaded","ok");
      }catch(e){toast(e.message,"bad");btn.disabled=false;btn.textContent="Upload";}
    }},"Upload")]});
}

/* ============================================================
   PROFIT SHARING
   ============================================================ */
const MODELS={
  prorata:{name:"Pro-rata by ownership",desc:"Each partner gets profit equal to their ownership %. Simple and clean when everyone's stake is just capital."},
  draw_then_prorata:{name:"Operator draw, then pro-rata",desc:"You & Bryan take an agreed base draw for running the café, then the rest splits by ownership %. Fairest for owner-operators + passive investors."},
  capital_first:{name:"Return capital first, then split",desc:"Investors are paid back their capital before profit is split. After payback, distributions continue by ownership %."},
  fixed:{name:"Fixed % split",desc:"A flat agreed split between the operator side and the investor side, regardless of exact capital."},
};
function renderProfit(root){
  root.append(topbar("Profit Sharing","Partners, the rules, and what each person is owed"));
  const s=State.data.settings||{};
  const phead=el("div",{class:"section-head"}, el("h2",{},"Partners & investors"),
    isOwner()?el("button",{class:"btn btn-primary btn-sm",onclick:()=>editPartner()},"+ Person"):null);
  root.append(phead);
  const totalCap=State.data.partners.reduce((a,p)=>a+Number(p.capital||0),0);
  if(!State.data.partners.length){root.append(el("div",{class:"empty"},el("div",{class:"big"},"🤝"),el("div",{},"Add yourselves and your investors to start.")));}
  else{
    const tw=el("div",{class:"tbl-wrap card",style:"padding:0;overflow:hidden"});
    const t=el("table"); t.append(el("thead",{},el("tr",{},...["Name","Role","Capital in","Ownership",""].map((h,i)=>el("th",{class:i>=2&&i<=3?"num":""},h)))));
    const tb=el("tbody");
    State.data.partners.forEach(p=>{
      tb.append(el("tr",{},
        el("td",{style:"font-weight:600"},p.name),
        el("td",{}, el("span",{class:"tag "+(p.role==="operator"?"business":"investor")},p.role==="operator"?"Operator":"Investor")),
        el("td",{class:"num"},peso(p.capital)),
        el("td",{class:"num"},pct(p.ownership)),
        el("td",{}, isOwner()?el("div",{class:"row-actions"},
          el("button",{class:"iconbtn",onclick:()=>editPartner(p)},"✎"),
          el("button",{class:"iconbtn",onclick:()=>confirmDel(p.name,async()=>{await del("partners",p.id);await refresh("partners");go("profit");})},"🗑")):el("span",{class:"muted"},"—"))));
    });
    const totOwn=State.data.partners.reduce((a,p)=>a+Number(p.ownership||0),0);
    t.append(tb);
    t.append(el("tfoot",{},el("tr",{}, el("td",{colspan:"2",style:"font-weight:700"},"Total"), el("td",{class:"num",style:"font-weight:700"},peso(totalCap)), el("td",{class:"num",style:"font-weight:700;color:"+(Math.round(totOwn)===100?"var(--sage)":"var(--clay)")},pct(totOwn)), el("td",{}))));
    tw.append(t); root.append(tw);
    if(Math.round(totOwn)!==100)root.append(el("div",{class:"help",style:"margin-top:6px;color:var(--clay)"},"Ownership should total 100%. Tip: use “Set from capital” when editing a person."));
  }

  root.append(el("div",{class:"tear"}));
  root.append(el("h2",{style:"margin:8px 0 4px"},"How profit is shared"));
  root.append(el("p",{class:"muted",style:"margin:0 0 14px;max-width:60ch"},"Pick the model that matches your agreement. Nothing here is locked — change it any time."));
  const picker=el("div",{class:"grid cols-2"});
  Object.entries(MODELS).forEach(([key,m])=>{
    const card=el("div",{class:"model-card"+((s.profit_model||"draw_then_prorata")===key?" on":""),onclick:isOwner()?async()=>{await saveSettings({profit_model:key});go("profit");}:null},
      el("h4",{},m.name), el("p",{},m.desc));
    picker.append(card);
  });
  root.append(picker);

  root.append(el("div",{class:"card",style:"margin-top:16px"}, ...profitCalc(s,totalCap)));

  if(State.data.distributions.length){
    root.append(el("h2",{style:"margin:24px 0 10px"},"Payout history"));
    const tw=el("div",{class:"tbl-wrap card",style:"padding:0;overflow:hidden"});
    const t=el("table"); t.append(el("thead",{},el("tr",{},...["Date","Period","Net profit","Reinvested","Distributed",""].map((h,i)=>el("th",{class:i>=2?"num":""},h)))));
    const tb=el("tbody");
    State.data.distributions.forEach(d=>{
      tb.append(el("tr",{},
        el("td",{class:"muted"},fmtDate(d.created_at)),
        el("td",{},d.period||"—"),
        el("td",{class:"num"},peso(d.net_profit)),
        el("td",{class:"num"},peso(d.reserve)),
        el("td",{class:"num"},peso(d.distributed)),
        el("td",{}, isOwner()?el("button",{class:"iconbtn",onclick:()=>confirmDel("this payout record",async()=>{await del("distributions",d.id);await refresh("distributions");go("profit");})},"🗑"):"")));
    });
    t.append(tb);tw.append(t);root.append(tw);
  }
}
function profitCalc(s, totalCap){
  const model=s.profit_model||"draw_then_prorata";
  const nodes=[];
  nodes.push(el("h3",{},"Distribution calculator"));
  nodes.push(el("div",{class:"sub"},MODELS[model].name));
  let range="30";
  const rangeWrap=el("div",{class:"kbar",style:"margin-bottom:14px"});
  const out=el("div",{});
  function calc(){
    const sales=State.data.sales.filter(x=>isActiveSale(x)&&inRange(x.sold_at||x.created_at,range));
    const exps=State.data.expenses.filter(x=>inRange(x.spent_at||x.created_at,range));
    const gross=sales.reduce((a,x)=>a+saleNet(x),0);
    const totExp=exps.filter(x=>(x.expense_type||"")!=="One-time" && (x.status||"approved")!=="pending").reduce((a,x)=>a+Number(x.amount||0),0);
    const net=gross-totExp;
    const reservePct=Number(s.reserve_pct||0);
    const reserve=Math.max(0,net)*reservePct/100;
    const cfg=s.config||{};
    const drawTotal=Number(cfg.operator_draw||0);
    const fixedOpPct=Number(cfg.operator_pct||60);
    const parts=State.data.partners;
    const ops=parts.filter(p=>p.role==="operator"), invs=parts.filter(p=>p.role==="investor");
    let distributable=net-reserve;
    const result=[];
    if(net<=0){
      out.innerHTML=""; out.append(el("div",{class:"notice"},`Net profit for this period is ${peso(net)} — nothing to distribute. ${net<0?"You're running at a loss; cover costs before drawing profit.":""}`));
      buildOutput(net,reserve,0,[]); return;
    }
    if(model==="prorata"){
      parts.forEach(p=>result.push({name:p.name,role:p.role,amount:distributable*Number(p.ownership||0)/100,note:""}));
    }
    else if(model==="draw_then_prorata"){
      const afterDraw=Math.max(0,distributable-drawTotal);
      const perOp=ops.length?drawTotal/ops.length:0;
      parts.forEach(p=>{
        const share=afterDraw*Number(p.ownership||0)/100;
        const draw=p.role==="operator"?perOp:0;
        result.push({name:p.name,role:p.role,amount:draw+share,note:p.role==="operator"&&drawTotal?`incl. ${peso(draw)} draw`:""});
      });
    }
    else if(model==="capital_first"){
      const paidMap={}; State.data.distributions.forEach(d=>{(d.detail||[]).forEach(x=>{if(x.toward_capital)paidMap[x.partner_id]=(paidMap[x.partner_id]||0)+x.amount;});});
      let pool=distributable;
      const remaining=invs.map(p=>({p,rem:Math.max(0,Number(p.capital||0)-(paidMap[p.id]||0))}));
      const totRem=remaining.reduce((a,r)=>a+r.rem,0);
      const repay={};
      if(totRem>0){const payback=Math.min(pool,totRem);
        remaining.forEach(r=>{const amt=totRem? payback*r.rem/totRem:0; repay[r.p.id]=amt;}); pool-=payback;}
      parts.forEach(p=>{
        const rb=repay[p.id]||0; const share=pool*Number(p.ownership||0)/100;
        result.push({name:p.name,role:p.role,amount:rb+share,partner_id:p.id,toward_capital:rb>0,note:rb>0?`incl. ${peso(rb)} capital return`:""});
      });
    }
    else if(model==="fixed"){
      const opPool=distributable*fixedOpPct/100, invPool=distributable*(100-fixedOpPct)/100;
      const opOwn=ops.reduce((a,p)=>a+Number(p.ownership||0),0)||1;
      const invCap=invs.reduce((a,p)=>a+Number(p.capital||0),0)||1;
      parts.forEach(p=>{
        let amt=0;
        if(p.role==="operator")amt=opPool*(Number(p.ownership||0)/opOwn);
        else amt=invPool*(Number(p.capital||0)/invCap);
        result.push({name:p.name,role:p.role,amount:amt,note:""});
      });
    }
    buildOutput(net,reserve,result.reduce((a,r)=>a+r.amount,0),result);
  }
  function buildOutput(net,reserve,distributed,result){
    out.innerHTML="";
    const sum=el("div",{class:"grid cols-3",style:"margin-bottom:14px"});
    sum.append(kpiCard("Net profit",peso(net),net>=0?"in":"out",""));
    sum.append(kpiCard("Reinvestment reserve",peso(reserve),"",pct(Number(s.reserve_pct||0))+" held back"));
    sum.append(kpiCard("To distribute",peso(distributed),"",""));
    out.append(sum);
    if(result.length){
      const t=el("table"); t.append(el("thead",{},el("tr",{},...["Partner","Role","Share","Note"].map((h,i)=>el("th",{class:i===2?"num":""},h)))));
      const tb=el("tbody");
      result.forEach(r=>tb.append(el("tr",{},
        el("td",{style:"font-weight:600"},r.name),
        el("td",{}, el("span",{class:"tag "+(r.role==="operator"?"business":"investor")},r.role==="operator"?"Operator":"Investor")),
        el("td",{class:"num",style:"font-weight:600"},peso(r.amount)),
        el("td",{class:"muted"},r.note||""))));
      t.append(tb); out.append(el("div",{class:"tbl-wrap"},t));
      if(isOwner())out.append(el("button",{class:"btn btn-primary btn-sm",style:"margin-top:14px",onclick:async()=>{
        try{await ins("distributions",{period:rangeLabel(range),net_profit:net,reserve,distributed,
          detail:result.map(r=>({partner_id:r.partner_id||null,name:r.name,amount:r.amount,toward_capital:!!r.toward_capital}))});
          await refresh("distributions"); go("profit"); toast("Payout recorded","ok");}catch(e){toast(e.message,"bad");}
      }},"Record this payout"));
    }
  }
  ["7","30","90","all"].forEach(r=>rangeWrap.append(el("button",{class:"chip"+(range===r?" on":""),onclick:e=>{range=r;$$(".chip",rangeWrap).forEach(c=>c.classList.remove("on"));e.target.classList.add("on");calc();}},rangeLabel(r))));
  nodes.push(rangeWrap);
  if(isOwner()){
    const cfg=s.config||{};
    const reserveIn=el("input",{class:"input",type:"number",step:"1",style:"width:110px",value:s.reserve_pct??10,onchange:async e=>{await saveSettings({reserve_pct:parseFloat(e.target.value)||0});}});
    const cfgRow=el("div",{class:"kbar",style:"margin-bottom:14px;gap:18px;flex-wrap:wrap"});
    cfgRow.append(el("label",{class:"chip",style:"gap:10px"},"Reinvestment reserve %",reserveIn));
    if(model==="draw_then_prorata"){
      const drawIn=el("input",{class:"input",type:"number",step:"0.01",style:"width:140px",value:cfg.operator_draw||0,onchange:async e=>{await saveSettings({config:{...cfg,operator_draw:parseFloat(e.target.value)||0}});calc();}});
      cfgRow.append(el("label",{class:"chip",style:"gap:10px"},"Total operator draw (₱)",drawIn));
    }
    if(model==="fixed"){
      const opIn=el("input",{class:"input",type:"number",step:"1",style:"width:110px",value:cfg.operator_pct||60,onchange:async e=>{await saveSettings({config:{...cfg,operator_pct:parseFloat(e.target.value)||0}});calc();}});
      cfgRow.append(el("label",{class:"chip",style:"gap:10px"},"Operator side %",opIn));
    }
    nodes.push(cfgRow);
  }
  nodes.push(out);
  nodes.push(el("div",{class:"notice",style:"margin-top:16px"},MODELS[model].desc+" · Profit uses operating expenses (consumables, fixed & recurring). One-time/capital spend and tips are left out. Capital contributions are tracked per partner, not as expenses."));
  setTimeout(calc,20);
  return nodes;
}
function rangeLabel(r){return r==="all"?"All time":r==="7"?"Last 7 days":r==="30"?"Last 30 days":"Last 90 days";}
function editPartner(p){
  const name=el("input",{class:"input",value:p?.name||""});
  let role=p?.role||"investor";
  const seg=el("div",{class:"seg"});
  ["operator","investor"].forEach(r=>seg.append(el("button",{class:role===r?"on":"",onclick:e=>{role=r;$$("button",seg).forEach(b=>b.classList.remove("on"));e.target.classList.add("on");}},r==="operator"?"Operator (runs it)":"Investor (passive)")));
  const cap=el("input",{class:"input",type:"number",step:"0.01",value:p?.capital??""});
  const own=el("input",{class:"input",type:"number",step:"0.01",value:p?.ownership??""});
  const body=el("div",{}, field("Name",name),
    el("div",{style:"margin-top:6px"},el("span",{style:"font-size:12.5px;font-weight:600;color:var(--bean)"},"Role"),seg),
    el("div",{class:"form-row",style:"margin-top:12px"},field("Capital invested (₱)",cap),field("Ownership %",own)),
    el("button",{class:"btn btn-ghost btn-sm",style:"margin-top:10px",onclick:()=>{
      const total=State.data.partners.reduce((a,x)=>a+Number(x.capital||0),0) + (parseFloat(cap.value)||0) - (p?Number(p.capital||0):0);
      if(total>0)own.value=(((parseFloat(cap.value)||0)/total)*100).toFixed(1);
    }},"Set ownership from capital"));
  openModal({title:p?"Edit person":"Add person",body,footer:bk=>[
    el("button",{class:"btn btn-ghost",onclick:()=>bk.remove()},"Cancel"),
    el("button",{class:"btn btn-primary",onclick:async()=>{
      if(!name.value.trim())return toast("Name required","bad");
      const row={name:name.value.trim(),role,capital:parseFloat(cap.value)||0,ownership:parseFloat(own.value)||0};
      try{p?await upd("partners",p.id,row):await ins("partners",row); await refresh("partners"); bk.remove(); go("profit"); toast("Saved","ok");}catch(e){toast(e.message,"bad");}
    }},"Save")]});
}
async function saveSettings(patch){
  const cur=State.data.settings||{id:1};
  const row={...cur,...patch,id:1};
  const {data,error}=await sb.from("settings").upsert(row).select().single();
  if(error){toast(error.message,"bad");return;}
  State.data.settings=data;
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  if(!CONFIGURED){
    $("#loadingView").classList.add("hide");
    $("#cfgWarn").classList.remove("hide");
    $("#cfgWarn").innerHTML="⚙️ Not connected yet. Open <b>index.html</b> and paste your Supabase URL + anon key (and set OWNER_PIN) in the CONFIG block at the top of the script.";
    return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("#loadingView").classList.add("hide"); $("#authView").classList.remove("hide"); return; }
  await enterApp();
}
async function enterApp(){
  $("#authView").classList.add("hide");
  $("#loadingView").classList.remove("hide");
  try{ await loadAll(); }catch(_){}
  $("#loadingView").classList.add("hide");
  $("#appView").style.display="block";
  $("#backBtn").addEventListener("click", backHome);
  $("#homeBtn").addEventListener("click", backHome);
  renderHome();
  startIncomingPoll();
}
async function doLogin(){
  const email=$("#email").value.trim(), password=$("#pass").value;
  $("#authErr").textContent=""; const b=$("#loginBtn"); b.disabled=true; b.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ $("#authErr").textContent=error.message; b.disabled=false; b.textContent="Sign in"; return; }
  await enterApp();
}
async function signOut(){ try{await sb.auth.signOut();}catch(_){} location.reload(); }
function wireAuth(){
  $("#loginBtn").addEventListener("click", doLogin);
  $("#pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}

function sunburstSVG(){
  const cx=50, cy=60, R=15, n=13;
  const ink="#211a15", sun=getCss("--brass")||"#d35e2a";
  let rays="";
  for(let i=0;i<n;i++){
    const ang=Math.PI*(i/(n-1));                 
    const dx=Math.cos(ang), dy=-Math.sin(ang);   
    const ri=R+4, len=(i%2===0)?17:11.5, ro=ri+len;
    rays+=`<line x1="${(cx+ri*dx).toFixed(1)}" y1="${(cy+ri*dy).toFixed(1)}" x2="${(cx+ro*dx).toFixed(1)}" y2="${(cy+ro*dy).toFixed(1)}" stroke="${ink}" stroke-width="3.1" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mugnâ">`+
    `<g>${rays}</g>`+
    `<path d="M${cx-R},${cy} A${R},${R} 0 0 1 ${cx+R},${cy} Z" fill="${sun}"/>`+
    `</svg>`;
}
function paintBrand(){ $$(".brand-cup").forEach(c=>{ c.textContent=""; c.innerHTML=sunburstSVG(); }); }

paintBrand();
wireAuth();
boot();
